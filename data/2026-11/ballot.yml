  # ---------- State propositions ----------
  - id: prop-1
    section: State propositions
    title: Proposition 1
    kind: measure
    description: "Authorizes Bonds for Housing Affordability Programs"
    summary:
      text: "Authorizes $11.25 billion in state general obligation bonds for housing affordability programs, including multifamily rental housing, mortgages for veterans, supportive housing, preservation of existing affordable housing, and downpayment assistance."
      yes: "The state could borrow $11.25 billion to support veterans and affordable housing."
      no: "The state could not borrow $11.25 billion to support veterans and affordable housing."
    link: https://voterguide.sos.ca.gov/propositions/1/
    jurisdiction: { level: state, name: California }
  - id: prop-2
    section: State propositions
    title: Proposition 2
    kind: measure
    description: "Increases State’s Rainy Day Fund"
    summary:
      text: "Increases California's Rainy Day Fund, approved by voters in 2014, to provide funding for education, health care, public safety, and other essential services during economic downturns."
      yes: "Rules for building state budget reserves and paying down extra state debts would change. As a result, state budget reserves would be higher. The state also would be required to make extra debt payments for longer."
      no: "Rules for building state budget reserves and paying down extra state debts would not change."
    link: https://voterguide.sos.ca.gov/propositions/2/
    jurisdiction: { level: state, name: California }
  - id: prop-3
    section: State propositions
    title: Proposition 3
    kind: measure
    description: "Provides Permanent Funding for Schools and Health Care by Extending Existing Tax on High Incomes"
    summary:
      text: "Makes permanent existing voter-approved tax rates for individuals earning over $371,000 (adjusted annually for inflation). Allocates tax revenues to public education."
      yes: "An income tax increase on high-income earners in place since 2012 would become permanent instead of expiring in 2031."
      no: "An income tax increase on high-income earners in place since 2012 would expire in 2031."
    link: https://voterguide.sos.ca.gov/propositions/3/
    jurisdiction: { level: state, name: California }
  - id: prop-4
    section: State propositions
    title: Proposition 4
    kind: measure
    description: "Repeals Prohibition Against Public Funding of Election Campaigns"
    summary:
      text: "Repeals prohibition on state and local governments offering public funding of candidate election campaigns. Public funding programs may not use funds earmarked for education, transportation, or public safety."
      yes: "State and local governments could create public campaign financing programs for public office candidates, subject to limits on which public funds could be used, how the public funds could be used, and who could receive them."
      no: "State and most local governments would remain unable to create public campaign finance programs for public office candidates."
    link: https://voterguide.sos.ca.gov/propositions/4/
    jurisdiction: { level: state, name: California }
  - id: prop-5
    section: State propositions
    title: Proposition 5
    kind: measure
    description: "Changes Recall Election Process for Statewide Officers"
    summary:
      text: "Under current law, voters elect replacement candidates at the same time as the recall election. This measure instead fills recall vacancies by subsequent special election or appointment."
      yes: "Recall elections would no longer include a question about who should fill the vacancy. Instead, vacancies typically would be filled through special elections or appointments, depending on the office and timing."
      no: "Voters would continue to be asked who should fill the vacancy as part of recall elections."
    link: https://voterguide.sos.ca.gov/propositions/5/
    jurisdiction: { level: state, name: California }
  - id: prop-37
    section: State propositions
    title: Proposition 37
    kind: measure
    description: "Creates Loan Program for Middle-Income Buyers of Qualified New Homes"
    summary:
      text: "Authorizes $25 billion in bonds to offer eligible buyers fixed-rate mortgages for up to 17% of purchase price of a newly constructed home priced below about $1.5 million. Borrowers must be California residents, occupy the home, meet income limits, and pay at least 3% down. Bonds repaid by mortgage payments, not State."
      yes: "The state would create a new homebuying assistance program. The state could sell up to $25 billion in revenue bonds to fund the program. Bonds would be paid back by homeowners’ payments on their home loans."
      no: "The state would not be required to create a new homebuying assistance program."
    link: https://voterguide.sos.ca.gov/propositions/37/
    jurisdiction: { level: state, name: California }
  - id: prop-38
    section: State propositions
    title: Proposition 38
    kind: measure
    description: "Authorizes Bonds for Immunology Medical Research"
    summary:
      text: "Authorizes $8.4 billion in general obligation bonds for immunology and immunotherapy research, half to a single University of California-affiliated nonprofit medical research institute, half to research grants."
      yes: "The state could borrow $8.4 billion to support medical research in immunology and immunotherapy conducted by California research institutes and universities."
      no: "The state could not borrow $8.4 billion to support medical research in immunology and immunotherapy conducted by California research institutes and universities."
    link: https://voterguide.sos.ca.gov/propositions/38/
    jurisdiction: { level: state, name: California }
  - id: prop-39
    section: State propositions
    title: Proposition 39
    kind: measure
    description: "Prohibits Citizens from Voting Unless They Present Government-Issued Identification"
    summary:
      text: "Invalidates mail ballots that do not have last four digits of designated government-issued identification number written on envelope. Prohibits in-person voting without presenting government-issued identification."
      yes: "Voters would be required to present additional identifying information to elections officials each time they vote."
      no: "A voter’s identity would continue to be established with the voter’s signature."
    link: https://voterguide.sos.ca.gov/propositions/39/
    jurisdiction: { level: state, name: California }
  - id: prop-40
    section: State propositions
    title: Proposition 40
    kind: measure
    description: "Imposes One-Time Tax on Certain Taxpayers"
    summary:
      text: "Imposes 5% tax on certain taxpayers with assets over $1 billion; revenue primarily for health care. Exempts revenues from constitutional requirements for school funding and spending limit."
      yes: "The state would collect a one-time tax from billionaires equal to 5 percent of their wealth."
      no: "The state would not collect a one-time tax from billionaires equal to 5 percent of their wealth."
    link: https://voterguide.sos.ca.gov/propositions/40/
    jurisdiction: { level: state, name: California }
  - id: prop-41
    section: State propositions
    title: Proposition 41
    kind: measure
    description: "Prohibits New State Taxes that Exclude Revenues from State Spending Limit. Requires Audits for New State Special Taxes"
    summary:
      text: "Nullifies state taxes enacted after January 1, 2026 that exempt their revenues from voter-approved state spending limit. Requires pre-election and recurring audits of programs funded by new special taxes."
      yes: "When special taxes are proposed by voter initiatives, the California State Auditor would review programs funded by the tax before the initiative appears on the ballot. The California State Auditor also would regularly review programs funded by special taxes approved by voters or the Legislature. In addition, the state might not be able to exclude any new special tax spending from its spending limit."
      no: "The California State Auditor’s responsibility to review government programs would not change. The state spending limit requirements would not change."
    link: https://voterguide.sos.ca.gov/propositions/41/
    jurisdiction: { level: state, name: California }
  - id: prop-42
    section: State propositions
    title: Proposition 42
    kind: measure
    description: "Prohibits New State Personal Property Taxes and Certain Retroactive State Taxes"
    summary:
      text: "Prohibits any new state tax (1) imposed on the ownership of personal property (all things people own other than real estate), or (2) that applies retroactively based on taxpayer’s past activities. Nullifies taxes enacted after January 1, 2026 that conflict with this measure."
      yes: "The state could not establish new taxes on the ownership of financial assets or other personal property."
      no: "The state would continue to have the option to establish new taxes on the ownership of financial assets or other personal property."
    link: https://voterguide.sos.ca.gov/propositions/42/
    jurisdiction: { level: state, name: California }
  - id: prop-43
    section: State propositions
    title: Proposition 43
    kind: measure
    description: "Limits Voters’ Ability to Raise Revenues for Local Government Services"
    summary:
      text: "Limits voters’ ability to pass voter-proposed local special taxes by increasing percentage of votes needed to approve such ballot measures from a majority (over 50%) to two-thirds, beginning January 1, 2027."
      yes: "Certain local government taxes would require two-thirds approval by voters."
      no: "Certain local government taxes could continue to be approved by voters with a majority vote."
    link: https://voterguide.sos.ca.gov/propositions/43/
    jurisdiction: { level: state, name: California }
  - id: prop-44
    section: State propositions
    title: Proposition 44
    kind: measure
    description: "Requires Community Health Clinics Spend 90% of Revenue on Program Services"
    summary:
      text: "Imposes penalties on nonprofit Federally Qualified Health Centers (community clinics providing primary care to medically underserved areas and populations) that spend less than 90% of revenue on “program services” advancing their charitable purpose, including but not limited to patient services."
      yes: "Certain private nonprofit health care clinics would have to spend at least 90 percent of their revenue each year on providing health care services."
      no: "The new requirement on health care clinic spending would not go into effect."
    link: https://voterguide.sos.ca.gov/propositions/44/
    jurisdiction: { level: state, name: California }
  - id: prop-45
    section: State propositions
    title: Proposition 45
    kind: measure
    description: "Modifies Environmental Review for Certain Projects"
    summary:
      text: "Amends California Environmental Quality Act (CEQA) to expedite environmental review for certain projects (including most housing, transportation, water, and health projects) by setting deadlines to complete environmental review and resolve lawsuits challenging project approvals."
      yes: "Certain public and private projects would be eligible for new project review and court challenge procedures. For example, new procedures would tighten time limits for environmental review and reduce the scope of what courts can consider when reviewing legal challenges."
      no: "Public and private projects would continue to use existing project review and court challenge procedures."
