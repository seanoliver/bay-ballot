fetchedAt: 2026-10-08
hasReasoning: true
picks:
  prop-a:
    pick: Y
    quotes:
      - text: Although the proposed measure contains many individual amendments, nearly all are technical, administrative, or housekeeping changes that simplify and modernize the charter without materially changing city policy.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-a-departments-and-commission
      - text: While the final package avoids more controversial but needed reforms, it nonetheless reflects a worthwhile housekeeping package worthy of voters’ support.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-a-departments-and-commission
  prop-b:
    pick: N
    quotes:
      - text: However, Prop. B’s proposed charter amendment does not reflect SPUR’s principles of good governance.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-b-public-bank
      - text: Importantly, establishing a public bank does not require these governance provisions to be in the charter.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-b-public-bank
      - text: The city could pursue a public bank through ordinance, administrative action, and existing oversight processes.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-b-public-bank
  prop-c:
    pick: Y
    quotes:
      - text: Affordable housing is one of San Francisco's highest priorities, yet it consistently struggles to secure sufficient funding, and state and federal funding is increasingly unreliable.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-c-housing-trust-fund
  prop-d:
    pick: Y
    quotes:
      - text: By allowing a mayor alone or a minority of the Board of Supervisors to bypass standard public processes, these processes discourage elected leaders from building consensus to solve an identified problem and reduce opportunities for the public to participate in crafting legislative proposals.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-d-ballot-measure-process
      - text: On balance, SPUR believes the measure's benefits outweigh its downsides and will lead to more effective policies and greater voter engagement.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-d-ballot-measure-process
  prop-e:
    pick: Y
    quotes:
      - text: San Francisco’s procurement system has become so fragmented that no single official has the authority to ensure that purchasing processes operate efficiently, consistently, and accountably.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-e-city-administrator-duties
      - text: We believe they would reduce duplicative reviews, shorten contracting timelines, improve service delivery, lower administrative costs, and make it easier for businesses and nonprofits to work with the city — critical improvements as the city faces persistent fiscal pressures and growing public service demands.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-e-city-administrator-duties
  prop-f:
    pick: Y
    quotes:
      - text: It would remove charter limits on the mayor’s ability to structure the Mayor’s Office to manage a large and complex government.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-f-executive-branch-management
      - text: Taken together, these changes would strengthen the mayor’s ability to serve as the city’s chief executive and voters’ ability to hold the mayor accountable for results.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-f-executive-branch-management
  prop-g:
    pick: N
    quotes:
      - text: Prop. G would undo a successful city effort to protect neighborhoods from the threats of rising sea levels and coastal erosion and create more places for San Franciscans to recreate safely and connect with nature.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-g-cars-sunset-dunes
      - text: It would delay the city’s plan for addressing climate impacts at a time when the effects of climate change are only increasing.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-g-cars-sunset-dunes
  prop-h:
    pick: Y
    quotes:
      - text: "Life will get much harder and more expensive in San Francisco and the region if Prop. H does not pass, especially for people with the fewest options: when transit service is cut, riders with disabilities, seniors, students, and low-income workers are hit first and hardest."
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-h-muni-parcel-tax
      - text: Muni has made financial management a top priority and proven to be a good steward of public funds and responsive to customers.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-h-muni-parcel-tax
  prop-i:
    pick: N
    quotes:
      - text: This diversion would reduce General Fund revenue available for core services, including fire, police, public health, and children's programs.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-i-transfer-tax-set-aside
      - text: Prop. I would also remove the Board of Supervisors’ authority to adjust the transfer tax and the flexibility to respond to evolving housing needs.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-i-transfer-tax-set-aside
  prop-j:
    pick: Y
    quotes:
      - text: San Francisco is facing significant fiscal uncertainty and needs revenue to support basic municipal functions, programs, and services.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-j-transfer-tax-foreclosures
      - text: Closing the foreclosure loophole for commercial and multi-family residential properties offers a way to increase revenue without harming individual homeowners or small landlords.
        source: https://www.spur.org/voter-guide/2026-11/sf-prop-j-transfer-tax-foreclosures
  rtm:
    pick: Y
    quotes:
      - text: The potential collapse of transit services poses a serious threat to the many people who rely on transit to access jobs, medical appointments, and groceries.
        source: https://www.spur.org/voter-guide/2026-11/ba-prop-rtm-regional-transit-sales-tax
      - text: SPUR believes maintaining reliable transit funding outweighs concerns about the regressive nature of a sales tax.
        source: https://www.spur.org/voter-guide/2026-11/ba-prop-rtm-regional-transit-sales-tax
      - text: "Transit is also vital for the region’s economy: half of all transit trips are work-related, and transit supports access to job opportunities."
        source: https://www.spur.org/voter-guide/2026-11/ba-prop-rtm-regional-transit-sales-tax
  prop-1:
    pick: Y
    quotes:
      - text: California’s housing affordability crisis continues to worsen, largely because of a supply shortage and inadequate funding to build more.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-1-affordable-housing-bond
      - text: This measure is critical to expanding affordable housing opportunities for lower-income residents across California through new construction, preservation, and homebuyer assistance.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-1-affordable-housing-bond
  prop-2:
    pick: Y
    quotes:
      - text: Given the volatile nature of California’s tax revenue structure, adequate reserve requirements are necessary to avoid severe service reductions during economic downturns.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-2-rainy-day-fund
      - text: The proposed measure would better manage this boom-and-bust cycle by requiring greater savings during good times to avoid deeper reductions during bad ones — when public safety-net services are most needed.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-2-rainy-day-fund
  prop-3:
    pick: Y
    quotes:
      - text: This tax has generated more than $119 billion for education and healthcare, with no evidence that it has driven high earners out of state.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-3-high-earner-income-tax-extension
      - text: It’s highly progressive, hitting only top earners while sustaining programs such as universal school meals that disproportionately benefit low-income students, and it would help backfill Medi-Cal funding just as federal cuts threaten healthcare access for millions of low-income Californians.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-3-high-earner-income-tax-extension
  prop-4:
    pick: Y
    quotes:
      - text: California campaigns are expensive and donor-dependent.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-4-campaign-financing
      - text: Public financing brings in more small-dollar donors, lowers barriers for first-time and under-resourced candidates, and increases candidate diversity and voter engagement.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-4-campaign-financing
  prop-5:
    pick: Y
    quotes:
      - text: Prop. 5 would help California avoid scenarios in which a successor can take statewide office with only a small plurality of votes.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-5-recall-process-reform
      - text: It would eliminate an incentive structure that has made recalls an attractive strategic partisan tool for removing elected officials without majority support.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-5-recall-process-reform
  prop-37:
    pick: Y
    quotes:
      - text: SPUR supports the creation of new tools and financing to promote homeownership, and these revenue bonds would have no impact on the state’s General Fund.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-37-homeowner-loans
      - text: The focus on new construction will increase the supply of for-sale homes in the state and allow homebuyers to build generational wealth through home equity.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-37-homeowner-loans
  prop-39:
    pick: N
    quotes:
      - text: California already has safeguards to protect election integrity.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-39-california-voter-id
      - text: California has no evidence of widespread voter fraud, despite allegations following the 2020 presidential election.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-39-california-voter-id
      - text: Research has found that strict voter ID requirements can create barriers for voters who lack acceptable identification.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-39-california-voter-id
  prop-41:
    pick: N
    quotes:
      - text: Prop. 41 was primarily placed on the ballot to defeat Prop. 40, a measure to tax billionaires.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-41-audits-special-taxes
      - text: In addition, it would constrain local and state governments’ ability to raise revenue now and in the future for much-needed housing, transportation, infrastructure, and social services, which are already facing cuts at the federal and state levels.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-41-audits-special-taxes
  prop-42:
    pick: N
    quotes:
      - text: Prop. 42 was primarily placed on the ballot to defeat Prop. 40, a competing tax measure on billionaires.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-42-personal-property-taxes
      - text: If passed, it would constrain local and state governments’ current and future ability to raise revenues for much-needed housing, transportation, infrastructure, and social services, which are already facing cuts at the federal and state levels.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-42-personal-property-taxes
  prop-43:
    pick: N
    quotes:
      - text: SPUR has consistently called for reforming Prop. 13 and opposed onerous new restrictions on the government’s ability to raise needed revenue.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-43-local-tax-threshold
      - text: It would undermine both the democratic principle of majority rule and one of the few remaining pathways for funding important services.
        source: https://www.spur.org/voter-guide/2026-11/ca-prop-43-local-tax-threshold
  oakland-measure-ee:
    pick: Y
    quotes:
      - text: Oakland's government has operated for more than two decades under a hybrid structure that gives voters an executive to blame while withholding the tools that executive needs to govern and leaving the council without independent fiscal capacity to check the budget it approves.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ee-governance-structure
      - text: SPUR concluded in 2021 that Oakland should commit fully to a strong-mayor system, and the Mayor's Working Group on Charter Reform (which SPUR helped facilitate) reached the same conclusion in January 2026.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ee-governance-structure
      - text: The measure moves the city toward clearer accountability.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ee-governance-structure
  oakland-measure-ff:
    pick: Y
    quotes:
      - text: Oakland is struggling to address projected budget deficits and needs revenue to fund city functions and service programs.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ff-transfer-tax-foreclosures
      - text: The city has few ways to generate revenue without increasing the tax burden for working families and small businesses.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ff-transfer-tax-foreclosures
      - text: Closing the foreclosure loophole for most commercial and larger residential properties offers a path to increase revenue by treating foreclosure transactions like other sales while protecting homeowners, small landlords, affordable housing, commercial-to-residential conversion projects, and community banking institutions.
        source: https://www.spur.org/voter-guide/2026-11/oak-measure-ff-transfer-tax-foreclosures
