  prop-1:
    pick: Y
    quotes:
      - text: VOTING YES will create significant economic benefits across the state, including over 50,000 new construction jobs, and $1.3 billion in state and local tax revenue.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-2:
    pick: Y
    quotes:
      - text: Federal funding has become increasingly unreliable during the current administration.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
      - text: VOTING YES will ensure that California maintains a larger state-based stockpile of rainy day funds that can be easily accessed during difficult times.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-3:
    pick: Y
    quotes:
      - text: California is already facing budget deficits, in part because of the deep cuts that Republicans enacted for health care and other critical services in H.R. 1 to subsidize massive tax breaks for the wealthy and corporations.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
      - text: VOTING YES will prevent a significant loss of revenue as federal cuts impact the state and Californians for years.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-4:
    pick: Y
    quotes:
      - text: VOTING YES will allow grassroots candidates with limited resources to receive enough critical funds to launch and sustain a campaign and engage with voters on local issues.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-5:
    pick: Y
    quotes:
      - text: VOTING YES will reform the process to potentially reduce the number of recall special elections and save taxpayer dollars.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-38:
    pick: N
    quotes:
      - text: VOTING NO on Prop 38 will save the state from having to divert $500 million to $600 million in state funding each year from critical health and human services to bond repayment.
