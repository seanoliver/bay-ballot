  prop-39:
    pick: N
    quotes:
      - text: VOTING NO will ensure that California does not waste millions of dollars and disenfranchise eligible voters in an effort to solve a problem that does not exist.
        source: https://www.progressivevotersguide.com/california/2026/general/county/sanmateo
  prop-40:
    pick: Y
