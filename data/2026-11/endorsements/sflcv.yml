hasReasoning: true
picks:
  supervisor-2:
    pick:
      - Stephen Sherrill
    quotes:
      - text: Sherrill is a strong supporter of public transit in San Francisco, including the November 2026 Stronger Muni for All (Proposition H) and Connect Bay Area (the Regional Transit Measure or RTM) transit funding measures, pedestrian infrastructure, and other transit-first improvements.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-stephen-sherrill-for-district-2-supervisor
  supervisor-6:
    pick:
      - Matt Dorsey
    quotes:
      - text: The San Francisco League of Conservation Voters (SFLCV) endorses Matt Dorsey for supervisor in District 6 based on his steadfast support for increasing housing density, improving transit, and reducing San Francisco’s carbon footprint by shifting away from automobile dependency.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-matt-dorsey-for-district-6-supervisor
  supervisor-8:
    pick:
      - Gary McCoy
    quotes:
      - text: McCoy is a Muni supporter, rider, and policy expert who understands its value as well as its complexity.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-gary-mccoy-for-district-8-supervisor
      - text: McCoy's record is unusually deep for a first-time candidate.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-gary-mccoy-for-district-8-supervisor
  supervisor-10:
    pick:
      - Theo Ellington
    quotes:
      - text: The San Francisco League of Conservation Voters (SFLCV) endorses Theo Ellington for District 10 Supervisor for his strong alignment with our environmental priorities and his long-standing commitment to environmental justice in District 10.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-theo-ellington-for-district-10-supervisor
      - text: Ellington’s environmental work in southeast San Francisco is rooted in lived experience.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-sflcv-endorses-theo-ellington-for-district-10-supervisor
  bart-8:
    pick:
      - Sara Barz
  college-board:
    pick:
      - Elijah Ball
  board-of-education:
    pick:
      - Alida Fisher
      - Phil Kim
      - Tim Tung
  prop-a:
    pick: Y
    quotes:
      - text: The accumulation of requirements in the City Charter regarding numerous boards and commissions has reduced the efficiency of City government and made it less responsive to current needs.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-a-charter-changes-affecting-departments-and-commissions
      - text: Moving many of those requirements to the Municipal Code would allow the Board of Supervisors to more readily adjust requirements in light of experience and current needs and priorities.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-a-charter-changes-affecting-departments-and-commissions
  prop-b:
    pick: Y
  prop-c:
    pick: Y
    quotes:
      - text: San Francisco’s chronic shortage of affordable housing is not only an urgent social and economic problem, but also a serious climate and environmental problem.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-c-the-housing-trust-fund-charter-amendment
      - text: Prop C would provide significant and predictable additional funding for affordable housing while taking into account other important City priorities and the possibility of future budgetary crises.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-c-the-housing-trust-fund-charter-amendment
      - text: Prop C is thus fiscally responsible in how it addresses the City’s affordable housing crisis.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-c-the-housing-trust-fund-charter-amendment
  prop-d:
    pick: Y
    quotes:
      - text: San Francisco’s current threshold of only 2% of registered voters for non-Charter measures is significantly lower than what other major cities in California require.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-d-for-hopefully-shorter-ballots
      - text: A higher threshold for qualifying ballot measures - for both citizens and elected officials - can help ensure that measures placed before voters demonstrate substantial support.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-d-for-hopefully-shorter-ballots
  prop-e:
    pick: Y
    quotes:
      - text: San Francisco’s current slow and expensive contracting procedures can be a major obstacle to accomplishing the City’s environmental priorities, such as projects to improve Muni service, provide affordable housing, enhance public parks, or safeguard the environment.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-e-the-city-administrator-and-city-contracting-reform-charter-amendment
      - text: Proposition E would empower the City Administrator to simplify contracting procedures and to drive down the cost of goods and services that the City purchases.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-proposition-e-the-city-administrator-and-city-contracting-reform-charter-amendment
  prop-g:
    pick: N
    quotes:
      - text: Dismantling Sunset Dunes Park in favor of automobile traffic during weekdays would be a costly backtrack on what has been a successful project providing needed recreation areas for San Franciscans year-round.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-no-on-prop-g-to-protect-sunset-dunes-park-recreation-space-and-san-franciscos-budget
      - text: Eliminating the park would thus deprive thousands of San Franciscans of recreation space while making little improvement to traffic patterns.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-no-on-prop-g-to-protect-sunset-dunes-park-recreation-space-and-san-franciscos-budget
  prop-h:
    pick: Y
    quotes:
      - text: Bay Area transit systems are facing a fiscal crisis that will result in major cutbacks on services unless voters step in to authorize increased funding.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-h-and-rtm
      - text: Investing in transit is an investment in a healthier and more resilient Bay Area.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-h-and-rtm
  rtm:
    pick: Y
    quotes:
      - text: Bay Area transit systems are facing a fiscal crisis that will result in major cutbacks on services unless voters step in to authorize increased funding.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-h-and-rtm
      - text: Investing in transit is an investment in a healthier and more resilient Bay Area.
        source: https://www.sflcv.org/blog/2026/9/29/november-2026-vote-yes-on-prop-h-and-rtm
