picks:
  us-rep-4:
    pick:
      - Mike Thompson
    quotes:
      - text: Thompson also has a stronger stance on gun control than Jones.
        source: https://www.pressdemocrat.com/2026/10/06/endorsement-californias-4th-congressional-district-deserves-experience-mike-thompson-will-deliver/
      - text: Thompson, who chairs the Gun Violence Prevention Task Force, helped pass and craft the Bipartisan Safer Communities Act.
        source: https://www.pressdemocrat.com/2026/10/06/endorsement-californias-4th-congressional-district-deserves-experience-mike-thompson-will-deliver/
      - text: As California and the United States head into two more years of a Trump presidency, voters deserve a representative with expertise and experience in Washington, D.C..
        source: https://www.pressdemocrat.com/2026/10/06/endorsement-californias-4th-congressional-district-deserves-experience-mike-thompson-will-deliver/
  prop-3:
    pick: Y
    quotes:
      - text: More Sonoma County school districts are in financial crisis than in any other county.
        source: https://www.pressdemocrat.com/2026/10/02/endorsement-vote-yes-on-propositions-40-and-3-so-the-wealthy-pay-a-fair-share-to-help-all-californians/
  prop-4:
    pick: N
    quotes:
      - text: Our tax dollars should not be spent on election campaigns.
        source: https://www.pressdemocrat.com/2026/09/18/pd-endorsement-no-on-prop-4-taxpayer-dollars-should-not-support-campaigns/
      - text: Creating a fund of taxpayer dollars and making it available for election campaigns is not the answer.
        source: https://www.pressdemocrat.com/2026/09/18/pd-endorsement-no-on-prop-4-taxpayer-dollars-should-not-support-campaigns/
  prop-40:
    pick: Y
    quotes:
      - text: Five percent of a billionaire’s wealth is a lot of money, but no billionaire will become poor paying it.
        source: https://www.pressdemocrat.com/2026/10/02/endorsement-vote-yes-on-propositions-40-and-3-so-the-wealthy-pay-a-fair-share-to-help-all-californians/
      - text: Prop. 40 is not a permanent fix. It is a cash infusion to deal with an emergency caused by the Trump administration.
        source: https://www.pressdemocrat.com/2026/10/02/endorsement-vote-yes-on-propositions-40-and-3-so-the-wealthy-pay-a-fair-share-to-help-all-californians/
      - text: Last year, Republicans in Congress and President Donald Trump cut roughly $1 trillion from Medicaid over a decade.
        source: https://www.pressdemocrat.com/2026/10/02/endorsement-vote-yes-on-propositions-40-and-3-so-the-wealthy-pay-a-fair-share-to-help-all-californians/
  prop-41:
    pick: N
    quotes:
      - text: There is an interesting case to make that new taxes should fit within the spending limit, but retroactively creating that system to target one tax on about 200 billionaires is not the right way to get there.
        source: https://www.pressdemocrat.com/2026/10/10/endorsement-if-you-support-the-billionaire-tax-vote-no-on-props-41-and-42/
  prop-42:
    pick: N
  prop-43:
    pick: N
    quotes:
      - text: Local tax measures in Sonoma County demonstrate the harm that could follow when little more than one-third of voters can block what most of their neighbors want.
        source: https://www.pressdemocrat.com/2026/10/03/endorsement-prop-43-wants-to-fix-a-system-that-isnt-broken/
      - text: Residents who organize, qualify a measure and persuade a majority of their voting neighbors to support it have an easier path to fund the things they care about.
        source: https://www.pressdemocrat.com/2026/10/03/endorsement-prop-43-wants-to-fix-a-system-that-isnt-broken/
  prop-44:
    pick: N
    quotes:
      - text: Unless Prop. 44 is defeated, many clinics offering a safety net could close at a time when Californians need affordable healthcare the most.
        source: https://www.pressdemocrat.com/2026/09/26/endorsement-no-on-prop-44-politics-dont-belong-in-californias-community-health-clinics/
      - text: "Here’s the rub with Prop. 44: the measure would set strict spending requirements for nonprofit health clinics that could put precious revenue at risk."
        source: https://www.pressdemocrat.com/2026/09/26/endorsement-no-on-prop-44-politics-dont-belong-in-californias-community-health-clinics/
