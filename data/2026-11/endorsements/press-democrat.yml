        source: https://www.pressdemocrat.com/2026/09/21/endorsement-yes-on-ab-support-srjcs-historic-830-million-bond-with-caution/
      - text: If Measure AB is approved, the cost, spread out over the entire county to local homeowners, would continue to be $30 per $100,000 of assessed value of local property.
