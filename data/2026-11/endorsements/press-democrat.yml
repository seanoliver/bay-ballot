    pick: Y
    quotes:
      - text: Students deserve school buildings that contribute to their educational experience — not distract from it.
        source: https://www.pressdemocrat.com/2026/10/13/endorsement-yes-on-measure-j-windsors-students-deserve-safe-classrooms/
  napa-county-measure-b:
    pick: Y
    quotes:
      - text: Measure B is a proposed new half-cent sales tax that would bring $23 million annually into the county for wildfire prevention and open space preservation maintenance.
        source: https://www.pressdemocrat.com/2026/10/08/endorsement-yes-on-b-keep-napa-fire-resilient-and-maintain-its-open-space/
      - text: As climate change continues to make North Bay summers hotter and dryer, this new funding source could help bring continued peace of mind to Napa County residents.
        source: https://www.pressdemocrat.com/2026/10/08/endorsement-yes-on-b-keep-napa-fire-resilient-and-maintain-its-open-space/
  american-canyon-measure-p:
    pick: N
    quotes:
      - text: The city’s leadership needs to do the work first, tightening the proverbial belt until there are no more belt holes left.
        source: https://www.pressdemocrat.com/2026/09/23/endorsement-no-on-measure-p-american-canyon-needs-to-look-elsewhere-for-revenue-growth/
      - text: Right now, because residents cannot look at city operations and say they’re lean and mean, the Press Democrat recommends a No vote on Measure P.
        source: https://www.pressdemocrat.com/2026/09/23/endorsement-no-on-measure-p-american-canyon-needs-to-look-elsewhere-for-revenue-growth/
