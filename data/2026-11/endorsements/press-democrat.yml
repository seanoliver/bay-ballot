rejectedQuotes:
  - text: The Press Democrat believes that’s a fair price to continue to pay to extend the value the SRJC provides to the community.
    reason: 'does not stand alone: "that" refers to the price in the previous sentence (review 2026-10-10)'
    contestId: srjc-measure-ab
  - text: The system, admittedly, is strange, but it works.
    reason: 'does not stand alone: "the system" refers back to the previous sentence (review 2026-10-10)'
    contestId: prop-43
  - text: What it would do is give a minority of voters a veto over funding local services such as parks, fire protection and child care that most of their neighbors want.
    reason: 'does not stand alone: "What it would do" points back to the previous passage (review 2026-10-10)'
    contestId: prop-43
  - text: Moreover, people should be able to decide whether or not they want their money to go toward supporting a candidate.
    reason: 'does not stand alone: opens with "Moreover" (review 2026-10-10)'
    contestId: prop-4
  - text: Students would lose even more if the higher rates were to expire.
    reason: 'does not stand alone: "the higher rates" and "even more" refer back to the previous passage (review 2026-10-10)'
    contestId: prop-3
  - text: Leaders also need to be more straightforward about their plans for the money.
    reason: 'does not stand alone: "the money" refers back to the previous passage (review 2026-10-10)'
    contestId: american-canyon-measure-p
  - text: Unlike other ballot measures, this is not a new tax; it’s an extension of a countywide sales tax we already pay.
    reason: 'does not stand alone: a bare "this" refers back instead of naming the measure (review 2026-10-10)'
    contestId: sonoma-county-measure-h
  - text: For too long, the council has been dominated by upper-class homeowners who sometimes have a difficult time thinking outside of their property-ownership box.
    reason: "does not stand alone: does not name or describe the pick (review 2026-10-10)"
    contestId: healdsburg-council-2
  - text: The council and the city’s residents would benefit from a representative with a strong civic understanding and who could serve as a liaison to the Rohnert Park business community.
    reason: "does not stand alone: does not name the pick and leans on the next sentence (review 2026-10-10)"
