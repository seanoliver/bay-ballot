hasReasoning: true
rejectedQuotes:
  - text: However, the IJ editorial board is generally in support of term limits and it is time for leaders with fresh ideas on the council.
    reason: 'does not stand alone: opens with "However" (review 2026-10-10)'
    contestId: tiburon-council
  - text: There is only one candidate who grasps the complexity of this crisis and has the legislative experience to address it.
    reason: 'does not stand alone: names no candidate and "this crisis" refers back (review 2026-10-10)'
    contestId: insurance-commissioner
  - text: Further, unlike Kim, Allen has already been working on these issues in the Legislature.
    reason: 'does not stand alone: opens with "Further" and "these issues" refers back (review 2026-10-10)'
    contestId: insurance-commissioner
  - text: Huffman is up for the challenge, including the addition of those Republican-leaning counties.
    reason: 'does not stand alone: "those Republican-leaning counties" refers back to the previous passage (review 2026-10-10)'
    contestId: us-rep-2
  - text: But the breadth of Elward’s governmental experience and knowledge of Marin, more than half the district’s population, and its local issues is limited compared to Lucan.
    reason: 'does not stand alone: opens with "But" (review 2026-10-10)'
    contestId: assembly-12
  - text: The experience and knowledge gained from having served as a decision-maker in those positions clearly makes him the best-qualified candidate.
    reason: 'does not stand alone: "those positions" refers back (review 2026-10-10)'
    contestId: state-senate-2
  - text: Affordability is a big concern.
    reason: not a reason on its own (review 2026-10-10)
    contestId: san-rafael-measure-w
  - text: The big increase will bring in more than the city needs right now.
    reason: 'does not stand alone: "The big increase" refers back to the previous passage (review 2026-10-10)'
    contestId: san-rafael-measure-w
  - text: His leadership and record of representation are well-known.
    reason: "bare verdict: says his record is well known without saying what it is (review 2026-10-11)"
    contestId: us-rep-2
  - text: Andre, Margulies and Friedel are solid experienced choices for the council.
    reason: bare verdict; gives no reason (review 2026-10-11)
    contestId: larkspur-council
  - text: Larry Bragman and Matt Da Cunha stand out as the two candidates the town needs at this time.
    reason: 'bare verdict; gives no reason. No other sentence about the picks stands alone: the rest point back ("Toward that same end", "His election") or quote the candidate (review 2026-10-11)'
    contestId: fairfax-council
  - text: What convinces us that Ma can actually move the needle on her agenda items is the fact that she has already been knee-deep advancing them in a senior executive capacity.
    reason: 'does not stand alone: "her agenda items" refers back to the previous paragraph (review 2026-10-11)'
    contestId: lt-governor
picks:
  us-rep-2:
    pick:
      - Jared Huffman
    quotes:
      - text: How Littau’s moderate politics would function in Congress, where partisan lines have rarely been deeper, is a huge unknown.
        source: https://www.marinij.com/2026/09/02/editorial-huffman-has-earned-chance-to-represent-expanded-district-in-congress/
      - text: Huffman is a well-known quantity, especially in Marin and Sonoma where he served on the Marin Municipal Water District board and represented the two counties while serving three terms in the state Assembly and seven terms in Congress.
        source: https://www.marinij.com/2026/09/02/editorial-huffman-has-earned-chance-to-represent-expanded-district-in-congress/
      - text: He’s been an advocate for the environment, commonsense gun control, wildfire protection and the communities that he represents.
        source: https://www.marinij.com/2026/09/02/editorial-huffman-has-earned-chance-to-represent-expanded-district-in-congress/
  lt-governor:
    pick:
      - Fiona Ma
  treasurer:
    pick:
      - Eleni Kounalakis
  insurance-commissioner:
    pick:
      - Ben Allen
  state-senate-2:
    pick:
      - Damon Connolly
    quotes:
      - text: He’s faced the challenges of reducing homelessness, of dealing with illegal immigration, the funding of public schools, land-use planning and fighting crime.
        source: https://www.marinij.com/2026/08/31/editorial-ij-recommends-connolly-in-race-for-state-senate-seat/
      - text: In Sacramento, he worked to end the misguided and costly bike lane trial on the Richmond-San Rafael Bridge and advanced tougher safety rules for e-bikes and youths who ride them.
        source: https://www.marinij.com/2026/08/31/editorial-ij-recommends-connolly-in-race-for-state-senate-seat/
  assembly-12:
    pick:
      - Eric Lucan
    quotes:
      - text: Given his deep experience in leadership positions in Marin, including the bi-county Sonoma-Marin Area Rail Transit board, Lucan brings the most political leadership to the race.
        source: https://www.marinij.com/2026/09/05/editorial-in-close-race-lucans-experience-makes-him-choice-for-assembly/
      - text: Lucan has proven himself to be a careful, caring, responsive and responsible local political leader.
        source: https://www.marinij.com/2026/09/05/editorial-in-close-race-lucans-experience-makes-him-choice-for-assembly/
  superintendent:
    pick:
      - Richard Barrera
    quotes:
      - text: Barrera is a thoughtful, detail-oriented reformer with concrete, measurable objectives.
        source: https://www.mercurynews.com/2026/10/07/endorsement-elect-richard-barrera-californias-superintendent-of-public-instruction-november-election-california-public-schools-sonja-shaw/
      - text: Barrera has specific ideas for reducing chronic student absenteeism by focusing on safe and healthy environments, student connectedness and family engagement.
        source: https://www.mercurynews.com/2026/10/07/endorsement-elect-richard-barrera-californias-superintendent-of-public-instruction-november-election-california-public-schools-sonja-shaw/
      - text: Barrera’s emphasis on practical solutions and clear sense of the evolving responsibilities are distinguishing.
        source: https://www.mercurynews.com/2026/10/07/endorsement-elect-richard-barrera-californias-superintendent-of-public-instruction-november-election-california-public-schools-sonja-shaw/
  prop-38:
    pick: N
    quotes:
      - text: No matter how one looks at it, Prop. 38 makes little sense unless your research institution expects to get a windfall of public funds.
        source: https://www.mercurynews.com/2026/10/13/endorsement-no-on-california-proposition-38-an-8-4-billion-money-grab-immunotherapy-ucla-research-ballot-measure/
      - text: The Legislative Analyst’s Office reports that repaying the bond will require $500 million to $600 million in spending out of the state general fund for 20 years.
        source: https://www.mercurynews.com/2026/10/13/endorsement-no-on-california-proposition-38-an-8-4-billion-money-grab-immunotherapy-ucla-research-ballot-measure/
  prop-44:
    pick: N
  rtm:
    pick: N
  palo-alto-measure-j:
    pick: N
  concord-council-1:
    pick:
      - Laura Hoffmeister
  concord-council-3:
    pick:
      - Dena Acosta Beere
  concord-council-5:
    pick:
      - Laura Nakamura
  san-rafael-council-3:
    pick:
      - Daryoush Davidi
    quotes:
      - text: Davidi’s stronger connection with San Rafael’s business community would fill a lacking need on the current council.
        source: https://www.marinij.com/2026/09/09/editorial-davidi-gets-nod-in-tight-race-for-district-3-seat-on-san-rafael-council/
  novato-usd-trustee-area-4:
    pick:
      - Abbey Picus
    quotes:
      - text: Picus’ experience and knowledge are going to be valuable to the board as it navigates difficult financial shoals confronting Novato’s public schools.
        source: https://www.marinij.com/2026/09/06/editorial-novato-should-reelect-picus-to-school-board/
      - text: Her experience as an educator, having three children in Novato public schools and having served four years as a trustee make Abbey Picus the clear choice for the Novato Union School District board.
        source: https://www.marinij.com/2026/09/06/editorial-novato-should-reelect-picus-to-school-board/
      - text: In Picus, the school board has an educator who knows the local public schools from the perspective of being a parent and from being a classroom teacher who’s working with students every day.
        source: https://www.marinij.com/2026/09/06/editorial-novato-should-reelect-picus-to-school-board/
  novato-council-2:
    pick:
      - Rachel Farac
  novato-council-4:
    pick:
      - Dan Christian
    quotes:
      - text: Christian stands out as a pragmatic choice, someone in touch with residents and the business community.
        source: https://www.marinij.com/2026/09/13/editorial-ij-recommends-farac-christian-in-novato-council-races/
  larkspur-council:
    pick:
      - Stephanie Andre
      - Sarah Margulies
      - Jeanne Friedel
    quotes:
      - text: Andre, a former investment banker, has brought her business acumen to the council.
        source: https://www.marinij.com/2026/09/16/editorial-andre-friedel-margulies-best-for-larkspur/
      - text: Among the challengers, Friedel offers the most City Hall experience, as an 18-year member of the city parks and recreation commission and a volunteer in the successful effort to raise more than $5 million in donations that helped make the city’s new library a reality.
        source: https://www.marinij.com/2026/09/16/editorial-andre-friedel-margulies-best-for-larkspur/
  san-anselmo-council:
    pick:
      - Steve Burdo
      - Will Dittmar
    quotes:
      - text: Retaining Burdo provides continuity, community experience and a representative who does his homework.
        source: https://www.marinij.com/2026/09/20/editorial-in-tight-race-ij-picks-burdo-dittmar-for-san-anselmo-council/
      - text: In this race, Dittmar stands out as someone who provides the perspective of organizational leadership, an awareness of issues facing local businesses and a knowledge of the financial struggles facing many households.
        source: https://www.marinij.com/2026/09/20/editorial-in-tight-race-ij-picks-burdo-dittmar-for-san-anselmo-council/
      - text: Dittmar would strengthen the council’s balance.
        source: https://www.marinij.com/2026/09/20/editorial-in-tight-race-ij-picks-burdo-dittmar-for-san-anselmo-council/
  tiburon-council:
    pick:
      - Jack Ryan
      - Kathleen Defever
      - Chuck Hornbrook
    quotes:
      - text: Defever’s time on the Planning Commission has been steeped in housing mandates from the state.
        source: https://www.marinij.com/2026/09/23/endorsement-ryan-hornbrook-defever-best-for-tiburon-council/
  sausalito-council:
    pick:
      - Joan Cox
      - Jill James Hoffman
    quotes:
      - text: Cox was a strong voice in support of the 2025 city-sponsored measure that re-zoned part of the city-owned Martin Luther King Jr. school property for affordable housing.
        source: https://www.marinij.com/2026/09/24/endorsement-cox-huffman-get-nod-over-strong-challengers-in-sausalito/
  sausalito-measure-x:
    pick: Y
  marin-county-measure-p:
    pick: Y
    quotes:
      - text: Childcare for families in need allows Marin workers to contribute to businesses that support the economy.
        source: https://www.marinij.com/2026/09/26/endorsement-marin-childcare-tax-measure-p-deserves-support/
      - text: Quality early education provides important cognitive and social skills during a time of life when 90% of the brain is developed.
        source: https://www.marinij.com/2026/09/26/endorsement-marin-childcare-tax-measure-p-deserves-support/
  ross-council:
    pick:
      - Julie A McMillan
      - Robert Herbst
    quotes:
      - text: McMillan and Herbst offer a balance and breadth of civic experience and perspectives.
        source: https://www.marinij.com/2026/09/27/endorsement-ij-recommends-herbst-mcmillan-for-ross-council-seats/
      - text: Reelecting McMillan and electing Herbst is a balanced approach.
        source: https://www.marinij.com/2026/09/27/endorsement-ij-recommends-herbst-mcmillan-for-ross-council-seats/
      - text: McMillan is a lawyer and a longtime civic leader, including having served a term on the Ross School Board.
        source: https://www.marinij.com/2026/09/27/endorsement-ij-recommends-herbst-mcmillan-for-ross-council-seats/
  san-rafael-measure-w:
    pick: N
    quotes:
      - text: Officials should consider a smaller increase with less chance of impacting the real estate market.
        source: https://www.marinij.com/2026/10/05/editorial-ij-recommends-no-vote-on-san-rafael-measure-w/
      - text: In Measure W, the San Rafael City Council is asking voters to impose a tax most of them won’t have to pay.
        source: https://www.marinij.com/2026/10/05/editorial-ij-recommends-no-vote-on-san-rafael-measure-w/
      - text: It is a hefty tax – a $10,000 tax on the sale of a $1 million home; a charge that local Realtors warn will cool the local real estate market, reduce the amount sellers will get for their houses and make it that much harder for people to afford to buy in San Rafael.
        source: https://www.marinij.com/2026/10/05/editorial-ij-recommends-no-vote-on-san-rafael-measure-w/
  marin-healthcare-measure-cc:
