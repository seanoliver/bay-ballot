      - Scott Wiener
    quotes:
      - text: Senator Scott Wiener, with his prolific legislative history and bold, detailed agenda, is the climate champion we need.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
      - text: Critically, Wiener has jumped into the fray three times in three years to save the Bay Area’s public transit systems from financial collapse, including authoring the law that authorized the Connect Bay Area regional funding measure.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
      - text: Sen. Wiener has championed numerous Sierra Club priorities over his 9 years in the California Senate.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
