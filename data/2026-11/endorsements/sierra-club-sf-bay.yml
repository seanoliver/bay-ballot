    pick: Y
    quotes:
      - text: Building homes in San Francisco is a climate issue.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
      - text: If passed, it would expand the Housing Trust Fund from $52 million to $125 million a year and extend it for thirty years, dedicating more than $3 billion to building and preserving affordable housing in San Francisco.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
      - text: And because the measure is a charter amendment, the funding cannot be redirected in a future budget season.
        source: https://www.sierraclub.org/sfbay/november-2026-combined-endorsements-explanations
