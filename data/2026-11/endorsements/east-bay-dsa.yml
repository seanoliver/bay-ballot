    contestId: berkeley-measure-aa
  - text: Overall, this is a very minimally progressive proposal.
    reason: "does not stand alone: 'this' refers to an earlier passage (review 2026-10-08)"
    contestId: oakland-measure-ff
  - text: "On balance, this is a measure that redirects governance in minor, insufficient ways toward socialist priorities: by expanding influence of non-citizens in governance, mandating technical and environmental expertise, allowing Councilmembers to hire staff, and clarifying outdated, administrative laws that complicate the administration of government."
    reason: "does not stand alone: 'this' refers to an earlier passage (review 2026-10-08)"
    contestId: alameda-measure-m
  - text: On balance, this is a limited but progressive measure that increases the tax contributions of big businesses to Emeryville.
    reason: "does not stand alone: 'this' refers to an earlier passage (review 2026-10-08)"
    contestId: emeryville-measure-bb
  - text: Measure Z would impose a progressive (per square foot of building footprint) parcel tax to fund a public bank, which offers government agencies lower interest rates and fees for community-wide projects.
    reason: "descriptive: says what the measure does (review 2026-10-08)"
    contestId: berkeley-measure-z
  - text: Before being elected, she spent 27 years teaching in Oakland public schools, including as a special-education teacher and history teacher.
    reason: "does not stand alone: 'she' refers to an earlier sentence (review 2026-10-08)"
    contestId: oakland-usd-2
  - text: Absent the passage of this tax, the city will face a deficit that is likely including mass city worker layoffs and the continued funding of city services serving the homeless and providing permanently affordable housing to residents.
    reason: garbled sentence (review 2026-10-08)
