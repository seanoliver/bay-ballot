  insurance-commissioner:
    pick:
      - Ben Allen
    quotes:
      - text: Insurance Commissioner plays a big role in housing affordability and Ben Allen is the best person on the ballot for the job.
        source: https://marinyimby.org/endorsements/endorsements/statewide-offices/
  prop-1:
    pick: Y
    quotes:
      - text: We support the $11.25 billion Veterans and Affordable Housing Bond Act, because it puts real money behind building new homes.
        source: https://marinyimby.org/endorsements/endorsements/local-ballot-measures/
  prop-37:
    pick: Y
    quotes:
      - text: The program is intended to be self-sustaining because participating homebuyers — not the state — would ultimately repay the bonds through their mortgage payments.
        source: https://marinyimby.org/endorsements/endorsements/local-ballot-measures/
  prop-43:
    pick: N
    quotes:
      - text: As communities across California are facing substantial challenges and uncertainties, this measure would make it harder for local voters to raise revenues to support local public services and give outsized power to a small share of voters.
        source: https://marinyimby.org/endorsements/endorsements/local-ballot-measures/
      - text: Approval of the measure would decrease the likelihood that local governments meet the needs of their residents and could increase hardship in some communities throughout the state.
        source: https://marinyimby.org/endorsements/endorsements/local-ballot-measures/
  state-senate-10:
    pick:
      - Scott Sakakihara
  assembly-11:
    pick:
      - Lori D Wilson
  assembly-12:
    pick:
      - Eric Lucan
    quotes:
      - text: Eric has been a strong advocate for housing during his time on the Board of Supervisors, and we’re especially encouraged by his commitment to advancing policies that will help Marin build more homes, as well as his past work on Marin’s inclusionary zoning ordinance and its HCD-compliant Housing Element.
        source: https://marinyimby.org/endorsements/endorsements/ca-state-assembly/
      - text: If elected, Eric has also pledged to unlock the financing pipeline for housing and bring back redevelopment agencies through tax increment financing, which could provide important new tools for getting housing built.
        source: https://marinyimby.org/endorsements/endorsements/ca-state-assembly/
