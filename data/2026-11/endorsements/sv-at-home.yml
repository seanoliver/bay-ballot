  prop-43:
    pick: N
    quotes:
      - text: Prop 43 takes power away from voters.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
      - text: Prop 43 would let 1/3rd of voters block funding measures supported by 2/3rds of voters.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
      - text: Prop 43 makes it harder for communities to fund critical services like police and fire departments, fix and repair local roads, staff our local schools, or backfill federal healthcare cuts.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
  prop-4:
    pick: Y
    quotes:
      - text: Public financing of elections will make it easier for our communities to elect people who are not personally very wealthy and who are not beholden to special interests.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
      - text: Prop 4 is a step in the right direction toward cleaner elections and more representative politics.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
  mountain-view-measure-e:
    pick: Y
    quotes:
      - text: Mountain View Charter Amendment includes non-controversial clean-up charter amendments that will improve Council meeting efficiency, align with state law, and modernize outdated language.
        source: https://siliconvalleyathome.org/action-fund/2026-election-voter-guide/
  mountain-view-measure-f:
    pick: Y
    quotes:
