      - text: YES on Prop 1 means safe, affordable homes for California’s veterans, low-income seniors on fixed incomes, survivors of domestic violence and their families, at risk and foster youth, working families, & people with disabilities — with strict accountability, transparency, and WITHOUT RAISING TAXES.
