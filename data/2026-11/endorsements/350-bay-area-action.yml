  prop-3:
    pick: Y
    quotes:
      - text: Supporting this tax expands the state’s revenue sources, making more funds available for climate change mitigation programs and initiatives.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-4:
    pick: Y
    quotes:
      - text: By removing the influence of wealthy campaign donors, candidates who advocate for environmental justice and climate issues will have a fair chance of being elected.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-39:
    pick: N
    quotes:
      - text: To promote environmental and social justice, we have to remove obstacles to voting for disadvantaged communities, not create them.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-40:
    pick: Y
    quotes:
      - text: This measure will levy a one-time 5% tax on billionaires’ accumulated wealth to keep local hospitals and ERs open, fund food aid, and support K-14 public education.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-41:
    pick: N
    quotes:
      - text: "WHY NO: Prop 41 could nullify Prop 40, which excludes the revenue raised by its one-time wealth tax from the state spending limit."
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-42:
    pick: N
    quotes:
      - text: Tech billionaires, including Sergey Brin and Eric Schmidt, are the main supporters of the campaign to pass Prop 42, which would nullify Prop 40.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-43:
    pick: N
    quotes:
      - text: The proposal is in effect minority rule as it allows a third of the voters to stop a special tax favored by close to two-thirds of the voters.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  prop-45:
    pick: N
    quotes:
      - text: Should Proposition 45 pass, localities would be severely limited in their ability to determine environmental impacts and deny permits to detrimental projects.
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
  rtm:
    pick: Y
    quotes:
      - text: "WHY YES: It avoids catastrophic service cuts for AC Transit (16%), BART (70%), Caltrain, SamTrans, SF Muni (50%), and VTA."
        source: https://350contracostaaction.org/california-ballot-propositions-2026-our-guide/
