hasReasoning: true
picks:
  us-rep-11:
    pick:
      - Connie Chan
    quotes:
      - text: Chan distinguishes herself from her opponent in the race by insisting on sustainable housing that would not lead to further gentrification or de-regulation.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
      - text: She also has strong labor support and a demonstrated history of progressive organizing in San Francisco.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
      - text: Wiener has been a tireless lackey for the real estate industry and tech billionaires, as well as the "Israel First" crowd who demand the censorship of any language critical of Israel on our campuses and in our civic institutions.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  supervisor-4:
    pick:
      - Jeremy Julian Greco
    quotes:
      - text: Greco shares many values with the Greens, including a dedication to grassroots democracy.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  supervisor-8:
    pick:
      - Michael T. Nguyen
    quotes:
      - text: Unlike the last several Supervisors from his district, Nguyen has good ideas on how to solve the homelessness crisis.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  supervisor-10:
    pick:
      - Pearci "PJ" Bastiany III
    quotes:
      - text: Although he's a member of the Democratic Party, Bastiany is a fierce opponent of the Israeli genocide in Gaza.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  board-of-education:
    pick:
      - Virginia Cheung
      - Alida Fisher
    quotes:
      - text: Of all the incumbents on the Board, Fisher seems to be the most in support of real public education and the one who best understands the pitfalls of moving to an unpopular system that would ban most families in SF from accessing the best public schools that our taxes pay for.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  college-board:
    pick:
      - Leah LaCroix
      - Jeremy Lee
    quotes:
      - text: Leah LaCroix gave great answers to our questionnaire, and she has clear ideas for increasing revenue while maintaining Free City College.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
      - text: Jeremy Lee is co-president of the Rose Pak Asian American Club, and is also a staunch defender of Free City College.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-a:
    pick: N
    quotes:
      - text: Although proponents claim the measure would streamline efficiency, the net result would be a lot less public oversight and a transfer of power to the Mayor's office.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
      - text: Greens believe that more oversight and transparency is the best way to reduce the amount of illegal behavior by our notoriously corrupt 1-party government.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-b:
    pick: Y
    quotes:
      - text: Greens have advocated for and worked towards a public bank for decades, because public banks save taxpayers a lot of money compared to storing public funds in private banks.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-d:
    pick: N
    quotes:
      - text: If Prop D passes, only wealthy special interests such as the tech and real estate industry will be able to afford to pay to get measures on the ballot.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-e:
    pick: N
  prop-f:
    pick: N
    quotes:
      - text: Prop F means less public accountability and more corruption.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-h:
    pick: Y
    quotes:
      - text: Prop H is about as progressive a tax as San Francisco can enact (since we aren't allowed to collect an income tax).
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-j:
    pick: Y
    quotes:
      - text: Greens endorsed YES on J, as it will both raise money and reduce evictions.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-1:
    pick: N
    quotes:
      - text: Public bond money should not be used for private cars or private housing.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-2:
    pick: N
    quotes:
      - text: We should be spending state money on priorities like public transit rather than raising taxes on poor people.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-3:
    pick: Y
  prop-4:
    pick: Y
    quotes:
      - text: Public financing is really the only defense that grassroots candidates have to even partially level the playing field against well-funded corporate candidates and their Super PACs.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-5:
    pick: N
    quotes:
      - text: Greens oppose Prop 5, as it would completely neuter the power that voters currently have to recall elected officials.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-37:
    pick: N
    quotes:
      - text: Prop 37 is a taxpayer subsidy to the real estate industry, and a totally inappropriate use of bond money.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-38:
    pick: N
    quotes:
      - text: Prop 38 also contains a kickback scheme.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-39:
    pick: N
    quotes:
      - text: Prop 39 would make it harder to vote by requiring you to show ID at the polls or remember to write in an ID number on your mail-in ballot.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-40:
    pick: Y
    quotes:
      - text: Prop 40 would raise about $100 billion to replace lost federal dollars that have been cut in California at the same time that taxes on billionaires have been reduced.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-41:
    pick: N
    quotes:
      - text: Billionaires reacted to Prop 40 by placing Prop 41 (and 42, see below) on the ballot to block it.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-42:
    pick: N
    quotes:
      - text: Prop 42 would block any taxes in CA on personal property, including Prop 40 (the billionaire tax).
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-43:
    pick: N
    quotes:
      - text: Prop 43 would make it harder to raise local taxes.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
  prop-44:
    pick: Y
  prop-45:
    pick: N
    quotes:
      - text: Prop 45 was put on the ballot by real estate developers in order to gut the environmental review process in CA, allowing all kinds of destructive projects (data centers, the Oakland coal terminal, massive YIMBY condo towers) to proceed without regard for long term consequences.
        source: https://www.sfgreenparty.org/endorsements/123-november-2026-endorsements
