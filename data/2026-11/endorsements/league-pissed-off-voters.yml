guide: league-pissed-off-voters
election: 2026-11
status: published
source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
archived:
  - source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
    snapshot: https://web.archive.org/web/20261005221544/https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
fetchedAt: 2026-10-05
hasReasoning: true
picks:
  us-rep-11:
    pick:
      - Connie Chan
    quotes:
      - text: Connie’s track record shows she can lead with her values and still get shit done.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: She’s accountable to the communities she comes from and not to corporate donors.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: We need a leader whose track record shows she can lead with San Francisco values while still getting shit done, take Congress’s responsibility to oversee military spending seriously, and fight for the dignity and rights of all people.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  secretary-of-state:
    pick:
      - Shirley N. Weber
    quotes:
      - text: She’s experienced, a fierce defender of voting rights, and the rare state official whose integrity is not compromised by ambition.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Her opponent, Orange County Republican Don Wagner, is a voter ID hawk who wants to stop sending mail-in ballots to all voters, so this vote really matters.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  insurance-commissioner:
    pick:
      - Jane Kim
    quotes:
      - text: "And though she admits she doesn’t have a background in the insurance industry, that’s actually a plus: we believe California’s Insurance Commissioner needs to take on the big insurers, not cozy up to them."
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Jane Kim is proposing to create a public insurer for natural disasters, much like the system in New Zealand, and she promises to use the office to rein in the powerful industry and develop new, functional alternatives.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  board-of-equalization-2:
    pick:
      - Sally J. Lieber
    quotes:
      - text: Now she’s the incumbent, and doing a great job.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Clearly everyone can see that Lieber knows what she’s doing.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  superintendent:
    pick:
      - Richard Barrera
    quotes:
      - text: In his 18 years on the San Diego school board, Richard Barrera has led the charge to reject austerity narratives, direct district leaders to stop hoarding taxpayer money in reserves, increase teacher pay, and improve outcomes for low-income and BIPOC students.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: He is running to increase funding, stabilize the education workforce, and grow the model of schools as community hubs.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  supreme-court-groban:
    pick: Y
  supreme-court-evans:
    pick: Y
  court-of-appeal-1:
    pick: Y
  board-of-education:
    pick:
      - Virginia Cheung
      - Reina Tello
      - Ryan Hazelton
    quotes:
      - text: Virginia Cheung is a SFUSD parent, a longtime leader in the nonprofit world, and a strong advocate for families and educators.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Reina Tello is a single parent of SFUSD kids (and an SFUSD graduate herself) and has been an organizer with PODER for decades.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Ryan Hazelton is the executive director of Mariposa Kids afterschool and summer programs, and the chair of the SF Childcare Planning & Advisory Council.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  college-board:
    pick:
      - Leah LaCroix
      - Bunny McFadden
    quotes:
      - text: Leah LaCroix has put in the work.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Leah has the policy chops and patience to bring community voices into long Board of Trustee meetings, and we know she’ll fight like hell to protect and grow City College.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  assessor:
    pick:
      - Joaquín Torres
  public-defender:
    pick:
      - Mano Raju
  supervisor-8:
    pick:
      - Gary McCoy
      - Michael T. Nguyen
    ranked: true
    quotes:
      - text: Gary brings years of legislative experience and is committed to tackling homelessness and supporting mental health with more crisis response teams and recovery services.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: As a former legislative aide to Nancy Pelosi, Gary’s a practical problem-solver with the policy chops to get things done on day one.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: "Michael Nguyen gets our #2 vote because of his platform as a pro-people power, anti-displacement advocate focused on working families, renters, and everyday residents."
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  supervisor-10:
    pick:
      - J.R. Eppler
      - Dionjay (DJ) Brookter
    quotes:
      - text: Either candidate would make a formidable legislator, since they both have experience serving on city commissions and in neighborhood coalitions.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-1:
    pick: Y
    quotes:
      - text: "We especially like that Prop 1 tackles the “3 P’s” of affordable housing: production of new housing, preservation of existing units, and protections against displacement."
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-3:
    pick: Y
    quotes:
      - text: So, Prop 3 is basically just asking if we can stick with this modestly higher tax rate for the top 2% to fund, well, everything.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: This is cash we’re already counting on, so if it doesn’t pass, we’re screwed [gritted teeth emoji].
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-4:
    pick: Y
    quotes:
      - text: Public financing is a way for communities to counter the power of big-money campaign contributions by setting public money aside for small-dollar candidates who agree to fundraising limits.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: It’s one basic way to un-stack the deck, at least a little bit.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-5:
    pick: Y
    quotes:
      - text: As much fun as it is to watch statewide political hijinks with a big bowl of popcorn, we agree that Prop 5 will make recalls more democratic and less like a game show.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-38:
    pick: N
    quotes:
      - text: Immunology is an important research priority, but we’re against rich people pushing through ballot initiatives that use our bond dollars to support their own science projects.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-39:
    pick: N
    quotes:
      - text: Prop 39 is a bullshit Voter ID law put forth by Trump’s lackeys to stoke fears of “illegal voting” this November.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Prop 39 is also super-wasteful.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: It’s a costly political stunt we can’t afford.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-40:
    pick: Y
    quotes:
      - text: At a time when the rich keep getting richer while everyone else struggles to keep afloat, a billionaire tax is a great idea.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: "Passing Prop 40 is not only the logical and moral thing to do, it would also send a loud and clear message to billionaires: You need to finally pay your fair share, and you can’t spend $50 million in attack ads to buy your way out of it."
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-41:
    pick: N
    quotes:
      - text: "But, as usual, the real purpose of the measure is buried in the fine print: it’s a poison pill to retroactively invalidate Proposition 40, the billionaire tax."
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-42:
    pick: N
  prop-43:
    pick: N
  prop-44:
    pick: N
  prop-45:
    pick: N
  rtm:
    pick: Y
    quotes:
      - text: BART estimates that without Prop RTM funds, it would have to close 15 stations and cut up to 70% of service.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Muni would have to cut 20 lines and end regular bus service at 9pm without the combined funds of Prop RTM and the Prop H parcel tax.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-a:
    pick: N
    quotes:
      - text: If Prop A passes, this voter-mandated oversight committee would be removed from the protection of the city charter and could be dissolved by a simple majority vote of the Board of Supervisors.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Lucrative city contracts will be awarded without citizen oversight.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-b:
    pick: Y
    quotes:
      - text: For affordable housing to be built, we need our own bank.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: If San Francisco owns the banks, it would allow us to facilitate affordable housing construction, particularly social housing.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-c:
    pick: Y
  prop-d:
    pick: N
    quotes:
      - text: Prop D increases the number of signatures needed for voter initiatives, making it much harder for anyone but the super-wealthy (who can buy armies of paid signature-gatherers) to get props on the ballot.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: If Prop D passes, we’d have to collect 4 times as many signatures to put anything on the ballot, which would further silence the voice of everyday San Franciscans at the ballot box.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-e:
    pick: N
    quotes:
      - text: Mayor Lurie already has a track record of demanding shady sweetheart contracts for his political allies (see OpenGov contract).
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: Prop E also gives the City Administrator sweeping new powers and extends their term from 5 to 10 years.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-f:
    pick: N
    quotes:
      - text: And even if you like this mayor, no mayor should have this much power.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-h:
    pick: Y
    quotes:
      - text: Prop H would bring badly needed funds to Muni via a parcel tax on San Francisco properties.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
      - text: We’re frustrated that Muni is being held hostage by corporations that want to pass the cost of transit to regular people instead of paying increased transit sustainability fees, but we certainly can’t do without Muni, which Prop H will fund to the tune of $150 million a year.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-i:
    pick: Y
    quotes:
      - text: Prop I is also the only measure on the ballot that dedicates funds to rent relief and eviction defense.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
  prop-j:
    pick: Y
    quotes:
      - text: Since the rest of us aren’t affected by Prop J, this is a no-brainer to raise more money for the general fund to pay for vital city services.
        source: https://www.theleaguesf.org/san_francisco_pissed_off_voter_guide_november_2026
