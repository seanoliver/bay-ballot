picks:
  antioch-council-1:
    pick:
      - Tamisha Torres-Walker
    quotes:
      - text: If you look at the city council as a bowl of soup, Torres-Walker makes the recipe complete as she represents an entire community that would otherwise be ignored by the city and that can’t happen ever again.
        source: https://contracosta.news/2026/10/05/editorial-the-antioch-endorsements-i-never-thought-id-make/
  antioch-council-4:
    pick:
      - Monica E Wilson
    quotes:
      - text: Wilson at least brings institutional knowledge and established governmental relationships to that fight — Antioch will need it!
        source: https://contracosta.news/2026/10/05/editorial-the-antioch-endorsements-i-never-thought-id-make/
      - text: Without Lamar Hernandez-Thorpe dominating every oxygen molecule in the council chamber, Wilson appears more comfortable speaking up, pushing back and taking a leadership role.
        source: https://contracosta.news/2026/10/05/editorial-the-antioch-endorsements-i-never-thought-id-make/
  brentwood-council-2:
    pick:
      - Tammy Zickuhr
    quotes:
      - text: Zickuhr will come into council meetings open-minded.
        source: https://contracosta.news/2026/10/05/editorial-bishop-mello-and-zickuhr-give-brentwood-the-reset-it-needs/
  brentwood-council-4:
    pick:
      - Holley Bishop-Mello
    quotes:
      - text: Bishop-Mello isn’t going to sit quietly while ridiculous policy sails through because questioning it might make somebody uncomfortable.
        source: https://contracosta.news/2026/10/05/editorial-bishop-mello-and-zickuhr-give-brentwood-the-reset-it-needs/
  pittsburg-council:
    pick:
      - Dionne Adams
      - Wolf Croskey
    quotes:
      - text: Adams’ relationships and understanding of regional and state government will matter as Pittsburg fights for investment, infrastructure and economic opportunities.
        source: https://contracosta.news/2026/10/05/editorial-pittsburg-must-look-at-the-big-picture-not-a-pixel/
      - text: Croskey would bring a different perspective, and Pittsburg could benefit from it.
        source: https://contracosta.news/2026/10/05/editorial-pittsburg-must-look-at-the-big-picture-not-a-pixel/
