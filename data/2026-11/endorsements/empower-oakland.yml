picks:
  oakland-usd-2:
    pick:
      - Arielle Fleisher
    ranked: true
    quotes:
      - text: Arielle Fleisher is an OUSD parent, a PTA member, co-leader of her neighborhood council, and founder of a 300+ member moms group.
        source: https://www.empoweroakland.com/voter-guide
      - text: Before becoming a candidate, she helped build an independent parent-led guide to the OUSD budget, so families could actually engage instead of tuning out.
        source: https://www.empoweroakland.com/voter-guide
  oakland-usd-4:
    pick:
      - Mike Hutchinson
      - Kathryn Camp
    ranked: true
  oakland-usd-6:
    pick:
      - Alexandra Williams
      - LeAna Powell
    ranked: true
    quotes:
      - text: Williams brings vast experience having worked at both district-run schools and charters.
        source: https://www.empoweroakland.com/voter-guide
  oakland-mayor:
    pick:
      - Barbara Lee
    quotes:
      - text: Mayor Lee has brought steady leadership and righted the ship, laying the foundation for Oakland’s comeback.
        source: https://www.empoweroakland.com/voter-guide
      - text: She has effectively brought together many constituencies to the table and taken the temperature down in local politics.
        source: https://www.empoweroakland.com/voter-guide
  oakland-council-2:
    pick:
      - Charlene Wang
    quotes:
      - text: Charlene is perfect for this district as she is both progressive and practical.
        source: https://www.empoweroakland.com/voter-guide
      - text: She is a workhorse for her constituents who tirelessly gathers feedback from the community and then puts that into practice at City Hall.
        source: https://www.empoweroakland.com/voter-guide
  oakland-council-4:
    pick:
      - Janani Ramachandran
    quotes:
      - text: She has a consistent record of asking hard questions and following through.
        source: https://www.empoweroakland.com/voter-guide
  oakland-council-6:
    pick:
      - Kevin E. Jenkins
    quotes:
      - text: Our endorsement also reflects Kevin’s willingness to pursue greater accountability and effectiveness within City Hall.
        source: https://www.empoweroakland.com/voter-guide
      - text: During his tenure, he’s demonstrated an ability to help lead Oakland through its most unstable stretch in recent history.
        source: https://www.empoweroakland.com/voter-guide
      - text: He has supported reforms designed to clarify responsibility, strengthen oversight, improve access to objective fiscal analysis, and make city government more responsive to residents.
        source: https://www.empoweroakland.com/voter-guide
  oakland-auditor:
    pick:
      - Michael C. Houston
    quotes:
      - text: Michael Houston is unopposed for the second time, and he still completed our questionnaire and participated in the endorsement process, demonstrating his commitment to transparency and engaging with his constituents.
        source: https://www.empoweroakland.com/voter-guide
      - text: He is a certified internal auditor who has done government audit work since 2008 and ran Oakland's whistleblower program before winning the 2024 special election.
        source: https://www.empoweroakland.com/voter-guide
      - text: He focused his team on critical areas such as 911 response times, and under his leadership the share of audit recommendations the administration has actually implemented is up 20 points.
        source: https://www.empoweroakland.com/voter-guide
  bart-4:
    pick:
      - Robert Raburn
    quotes:
      - text: Before Robert Raburn ever held office, he spent a decade chairing Alameda County’s Measure B Citizens Watchdog Committee (the body that makes sure voter-approved transportation dollars actually go where voters were told they’d go).
        source: https://www.empoweroakland.com/voter-guide
      - text: Now is not the moment to hand District 4’s seat (with some of the most at-risk stations in the system) to someone learning the budget from scratch. Raburn’s institutional knowledge, fiscal discipline, and real relationships in these neighborhoods are assets we cannot afford to throw away this cycle.
        source: https://www.empoweroakland.com/voter-guide
  ac-transit-ward-3:
    pick:
      - Adriana Valencia
    quotes:
      - text: Adriana Valencia brings an infectious energy and user-centered perspective to the AC Transit Board.
        source: https://www.empoweroakland.com/voter-guide
      - text: Her focus on transparency and accountability is demonstrated by her public-interest lawsuit against AC Transit over Brown Act violations following a closed-door $500,000 executive payout.
        source: https://www.empoweroakland.com/voter-guide
  ac-transit-ward-4:
    pick:
      - Sarah Syed
    quotes:
      - text: When nighttime service on Broadway was terminated, she worked to bring it back.
        source: https://www.empoweroakland.com/voter-guide
      - text: Her ideas for on-time performance are cheap and practical, like stop sign placement and traffic signal fixes.
        source: https://www.empoweroakland.com/voter-guide
  ebmud-ward-3:
    pick:
      - Marguerite Young
    quotes:
      - text: Marguerite Young has served Ward 3 for more than a decade, and she has spent that time on the critical work of keeping a century-old water and wastewater system funded, maintained, and replaced before it fails.
        source: https://www.empoweroakland.com/voter-guide
  peralta-ccd-trustee-area-5:
    pick:
      - Cindi Reiss
    quotes:
      - text: Cindi Reiss has served on the Peralta Board since 2018, through accreditation probation, chancellor turnover, and the threat of state takeover.
        source: https://www.empoweroakland.com/voter-guide
      - text: She put forward the June resolution to merge Laney and Merritt into Oakland City College by fall 2027, and we believe she is in a strong position to see it through.
        source: https://www.empoweroakland.com/voter-guide
      - text: Despite a turbulent tenure, she has not shied away from hard conversations, including saying plainly that a shrinking district cannot sustain four colleges.
        source: https://www.empoweroakland.com/voter-guide
  oakland-measure-ee:
    pick: Y
    quotes:
      - text: Empower Oakland endorses YES on Measure EE because Oakland needs clear accountability at City Hall.
        source: https://www.empoweroakland.com/voter-guide
      - text: Measure EE will make the position of mayor a true chief executive role, with clear responsibility for managing city affairs and delivering results.
        source: https://www.empoweroakland.com/voter-guide
  oakland-measure-ff:
    pick: Y
    quotes:
      - text: It is not a new tax, and it does not raise anyone’s property tax rate.
        source: https://www.empoweroakland.com/voter-guide
  rtm:
    pick: Y
    quotes:
      - text: Oakland’s economy cannot recover if transit collapses.
        source: https://www.empoweroakland.com/voter-guide
      - text: With vehicle ownership costs pushing more people onto public transit, the region needs this safety net.
        source: https://www.empoweroakland.com/voter-guide
