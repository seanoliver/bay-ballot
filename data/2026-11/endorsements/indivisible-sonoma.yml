    pick: N
    quotes:
      - text: Prop 44 could worsen health disparities rather than reduce them, and would potentially put safety-net clinics, which serve low-income and uninsured patients, out of business, because it requires affected clinics to pay a penalty to the state if they fall short of the new health care spending minimum.
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
  prop-45:
    pick: N
    quotes:
