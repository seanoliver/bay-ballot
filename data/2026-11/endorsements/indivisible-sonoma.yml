  prop-38:
    pick: N
    quotes:
      - text: The billionaire founders of that non-profit are co-sponsors of Prop 38 and have written the proposition to so narrowly define the criteria for the $4B that only their non-profit is eligible.
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
  prop-39:
    pick: N
    quotes:
      - text: "Make no mistake: Prop 39 will make voting harder, riskier, and more expensive for Californians because that’s what it was designed to do."
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
  prop-40:
    pick: Y
    quotes:
      - text: Right now, families across California are one hospital closure away from losing the care they depend on.
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
      - text: "Federal healthcare cuts have blown a $30 billion hole in Medi-Cal funding, and Prop 40 is our chance to fix it directly: a one-time 5% tax on the roughly 200 Californians worth over $1 billion."
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
  prop-41:
    pick: N
    quotes:
      - text: Propositions 41 and 42 aren’t independent policy proposals; they exist to cancel out Proposition 40.
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
      - text: Under California’s rules, if either measure gets more “yes” votes than Prop 40, the billionaire tax could be nullified even if it also passes.
        source: https://indivisiblesonomacounty.substack.com/p/indivisible-sonoma-county-recommends
