picks:
  menlo-park-measure-p:
    pick: Y
    quotes:
      - text: By requiring voter approval before the city can sell, lease, or permanently alter our eight downtown parking lots, this measure establishes a vital safeguard for our vibrant commercial core.
        source: https://padailypost.com/2026/10/03/daily-post-editorial-vote-yes-on-p-to-save-downtown/
      - text: Wiping out 556 essential parking spaces would hand a death sentence to the mom-and-pop storefronts, hardware stores and restaurants that are already struggling with rising vacancies.
        source: https://padailypost.com/2026/10/03/daily-post-editorial-vote-yes-on-p-to-save-downtown/
      - text: The city’s current plan to replace Plaza 1, 2, and 3 with high-density public housing is a gamble Menlo Park cannot afford to take.
        source: https://padailypost.com/2026/10/03/daily-post-editorial-vote-yes-on-p-to-save-downtown/
  palo-alto-council:
    pick:
      - Bryna Chang
      - Ed Lauing
      - Vicki Veenker
    quotes:
      - text: However, Ed Lauing has proven to be a steady voice for transparency.
        source: https://padailypost.com/2026/10/03/daily-post-editorial-elect-chang-lauing-veenker-to-council/
      - text: Despite our reservations about the incumbents’ past performance, the combination of Chang’s fiery advocacy for neighborhood safety, Lauing’s steady hand and Veenker’s experience offers the most capable leadership for our city’s future.
        source: https://padailypost.com/2026/10/03/daily-post-editorial-elect-chang-lauing-veenker-to-council/
  pausd-trustee:
    pick:
      - Avery Wang
      - John Craig
    quotes:
      - text: We strongly favor Wang and Craig for their unwavering emphasis on merit and the rebuilding of an educational meritocracy.
        source: https://padailypost.com/2026/10/05/daily-post-editorial-wang-and-craig-for-school-board/
      - text: Avery Wang, in particular, has been a tireless champion for advanced math opportunities.
        source: https://padailypost.com/2026/10/05/daily-post-editorial-wang-and-craig-for-school-board/
      - text: John Craig joins him with a sharp focus on restoring academic rigor, financial transparency and common-sense governance.
        source: https://padailypost.com/2026/10/05/daily-post-editorial-wang-and-craig-for-school-board/
  valley-water-7:
    pick:
      - Pete Dailey
    quotes:
      - text: Northern Santa Clara County needs a serious, collaborative professional, and Pete Dailey fits the bill perfectly.
        source: https://padailypost.com/2026/09/29/daily-post-editorial-elect-pete-dailey-to-valley-water-board/
      - text: Dailey has earned broad, trusted regional support, including endorsements from his fellow council members, Santa Clara County Supervisor Margaret Abe-Koga, and District Attorney Jeff Rosen.
        source: https://padailypost.com/2026/09/29/daily-post-editorial-elect-pete-dailey-to-valley-water-board/
