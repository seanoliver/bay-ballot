picks:
  us-rep-15:
    pick:
      - Kevin Mullin
  us-rep-16:
    pick:
      - Sam Liccardo
  assembly-23:
    pick:
      - Marc Berman
  assembly-21:
    pick:
      - Diane Papan
  san-mateo-county-supervisor-5:
    pick:
      - Mark Nagales
    quotes:
      - text: Having difficult conversations, especially around challenging topics like tenant protections, is Nagales’ specialty and he was part of those discussions in South City so that relocation assistance in some instances was passed with support all around.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nagales-for-district-5-board-of-supervisors/article_c43d10a2-0417-47b8-bd14-db43d80f8651.html
      - text: He is involved, active and engaged with anyone who seeks ways to better the community overall.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nagales-for-district-5-board-of-supervisors/article_c43d10a2-0417-47b8-bd14-db43d80f8651.html
      - text: He also has provided specific experience from the South San Francisco City Council on important issues like childcare and universal basic income during COVID that would tie in directly to the work of the Board of Supervisors.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nagales-for-district-5-board-of-supervisors/article_c43d10a2-0417-47b8-bd14-db43d80f8651.html
  smcccd-trustee-area-2:
    pick:
      - Mike Guingona
    quotes:
      - text: Guingona is well versed in the district’s finances, plans, challenges and opportunities.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-guingona-for-area-2-community-college-trustee/article_0ca98605-cf72-4269-88af-fd3cdfd06a6e.html
  san-mateo-county-board-of-education-2:
    pick:
      - Dana Johnson
    quotes:
      - text: Gerard is in the game, and understands the role but Johnson exhibits more creativity — including connecting incarcerated youth with college and job training programs and making new community partnerships for assistance.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-johnson-for-board-of-education/article_63e644b2-1dbd-4f8d-8fee-60b79fca4a9e.html
  smuhsd-trustee-area-3:
    pick:
      - Diana Harris
    quotes:
      - text: As a teacher in the San Mateo-Foster City School District, she knows what the current classroom challenges are for those at the ground level in the education field.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-harris-proctor-for-san-mateo-union-high-school-district-board/article_08a8790e-6e35-44e0-99f8-407d563b0c33.html
      - text: We also like her idea of having regular community listening sessions outside of board meetings to reach those who may be unable to attend.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-harris-proctor-for-san-mateo-union-high-school-district-board/article_08a8790e-6e35-44e0-99f8-407d563b0c33.html
      - text: She is knowledgable, informed and a natural connector and collaborator.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-harris-proctor-for-san-mateo-union-high-school-district-board/article_08a8790e-6e35-44e0-99f8-407d563b0c33.html
  smuhsd-trustee-area-5:
    pick:
      - Alison Proctor
    quotes:
      - text: Proctor has long been known as an active listener who digs into data and makes decisions based on what is best for students first, but also considers the impact on the larger school community.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-harris-proctor-for-san-mateo-union-high-school-district-board/article_08a8790e-6e35-44e0-99f8-407d563b0c33.html
  ssfusd-trustee-area-c:
    pick:
      - Chialin Hsieh
    quotes:
      - text: The achievement gap is a real concern, and Hsieh was there to create the district’s 2024-29 strategic plan and revamp the math curriculum.
        source: https://www.smdailyjournal.com/opinion/editorials/hsieh-richardson-for-south-san-francisco-unified-school-district-board-of-trustees/article_b3e62f36-3892-4fa7-8a71-2458bd6492cb.html
      - text: Her experience in K-16 is a true asset to the district and she knows to point the ship in the right direction and be patient for all to get on board.
        source: https://www.smdailyjournal.com/opinion/editorials/hsieh-richardson-for-south-san-francisco-unified-school-district-board-of-trustees/article_b3e62f36-3892-4fa7-8a71-2458bd6492cb.html
  ssfusd-trustee-area-e:
    pick:
      - Mina A. Richardson
    quotes:
      - text: Richardson has been a good representative for the largely Latino Area E.
        source: https://www.smdailyjournal.com/opinion/editorials/hsieh-richardson-for-south-san-francisco-unified-school-district-board-of-trustees/article_b3e62f36-3892-4fa7-8a71-2458bd6492cb.html
  sequoia-uhsd-trustee-area-a:
    pick:
      - Alon Shiran
    quotes:
      - text: Shiran is not radical in his thoughts, he simply wants to bring his background in data-driven solutions to the table.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-shiran-for-sequoia-union-school-board/article_ef900a9f-4455-45a1-82ea-fb3085094650.html
      - text: He is thoughtful, practical and steady.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-shiran-for-sequoia-union-school-board/article_ef900a9f-4455-45a1-82ea-fb3085094650.html
      - text: Shiran’s practical approach and calm demeanor is a bonus.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-shiran-for-sequoia-union-school-board/article_ef900a9f-4455-45a1-82ea-fb3085094650.html
  san-carlos-sd-trustee:
    pick:
      - Boris Lipkin
      - Megha Chawla
      - Shivani Tripathi
    quotes:
      - text: Current Trustee Boris Lipkin is by far the most knowledgable and engaged.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-lipkin-chawla-tripathi-for-san-carlos-school-board/article_f9ee0b59-6fcc-4471-8ecf-0f3f5249f78d.html
      - text: Tripathi is intimately familiar with all the volunteer positions in which a parent can engage and is well versed in the issues the district faces.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-lipkin-chawla-tripathi-for-san-carlos-school-board/article_f9ee0b59-6fcc-4471-8ecf-0f3f5249f78d.html
      - text: Also impressive is Chawla, who focuses on data and also making sure she can be a bridge of communication with parents.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-lipkin-chawla-tripathi-for-san-carlos-school-board/article_f9ee0b59-6fcc-4471-8ecf-0f3f5249f78d.html
  south-san-francisco-council-3:
    pick:
      - Buenaflor (Flor) Nicolas
    quotes:
      - text: Flor Nicolas may not be the most progressive member of the South San Francisco City Council, but she listens to constituents, puts thought into her decisions and responds and votes accordingly.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nicolas-for-south-san-francisco-district-3/article_a53021af-b9b9-4f1f-9745-42061a89773e.html
      - text: Nicolas has a practical stance when it comes to city issues, and the city overall benefits from her know-how, perspective and experience.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nicolas-for-south-san-francisco-district-3/article_a53021af-b9b9-4f1f-9745-42061a89773e.html
  foster-city-council-1:
    pick:
      - Phoebe Shin Venkat
    quotes:
      - text: Venkat speaks up and speaks out.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-venkat-for-district-1-foster-city-council/article_c9deeec4-18d4-4bf0-9215-9c4aa02daa20.html
      - text: In her time on the council, she has been highly communicative and transparent.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-venkat-for-district-1-foster-city-council/article_c9deeec4-18d4-4bf0-9215-9c4aa02daa20.html
      - text: Venkat has proven to be a quick learner and her ability to communicate and bring a needed perspective to the city gives her the edge in this contest.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-venkat-for-district-1-foster-city-council/article_c9deeec4-18d4-4bf0-9215-9c4aa02daa20.html
  san-mateo-council-1:
    pick:
      - Lisa Diaz Nash
    quotes:
      - text: With the proposal for the Horizon treatment center, Nash was the first elected official who pushed for more communication and transparency.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
      - text: She is a gifted politician, whose enthusiasm for helping people is admirable.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
  san-mateo-council-3:
    pick:
      - Robert G. Newsom Jr.
    quotes:
      - text: Progress is made in the middle, and this is where Newsom shines.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
      - text: Rather than using information to advance an agenda, Newsom uses it make sure more people are being served and can feel good about the direction of the city.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
      - text: In his work on the Delaware Street bicycle lane proposal, he showed that meeting people where they are, listening, compromising and coming up with creative solutions can stem controversy and produce wins.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
  san-mateo-council-5:
    pick:
      - Dana Yates Sahae
    quotes:
      - text: She has strong ideas, and knows the city and its issues.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
      - text: The current City Council has been challenged at times by its lack of institutional knowledge. Sahae can bring that knowledge, along with a fresh approach to issues that have long plagued the city.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-nash-newsom-sahae-for-san-mateo-city-council/article_13221fdc-ae9a-4af4-bae4-90342ae8d51f.html
  burlingame-council-3:
    pick:
      - Howard Wettan
    quotes:
      - text: As a member of the Parks and Recreation Commission, Wettan didn’t shy from controversial topics and found solutions that benefited Burlingame.
        source: https://www.smdailyjournal.com/opinion/editorials/wettan-for-district-3-burlingame-city-council/article_9d79323e-6766-4c12-a1cb-6115386874a2.html
      - text: As a member of the Traffic, Safety and Parking Commission, Wettan knows the city’s needs to keep the streets safe for all through thoughtful decisions that don’t pit people against each other but rather look for wins for all.
        source: https://www.smdailyjournal.com/opinion/editorials/wettan-for-district-3-burlingame-city-council/article_9d79323e-6766-4c12-a1cb-6115386874a2.html
  millbrae-council-3:
    pick:
      - Ann Schneider
    quotes:
      - text: She would provide some depth on the dais.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-schneider-yam-for-millbrae-city-council/article_54702e64-e769-4207-853e-172016ed3d6f.html
  millbrae-council-4:
    pick:
      - Albert Yam
    quotes:
      - text: When it comes to downtown, which is critical to Millbrae’s character and success, Yam has better defined ideas that are in tune with the city’s small businesses.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-schneider-yam-for-millbrae-city-council/article_54702e64-e769-4207-853e-172016ed3d6f.html
      - text: Nguyen is service oriented, which is good, but Yam is action oriented, which is better.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-schneider-yam-for-millbrae-city-council/article_54702e64-e769-4207-853e-172016ed3d6f.html
