  burlingame-measure-d:
    pick: Y
    quotes:
      - text: Raising the hotel tax in Burlingame from 12% to 15% to generate an additional $5.7 million a year for the city’s coffers is a no-brainer.
        source: https://www.smdailyjournal.com/opinion/editorials/editorial-yes-on-measure-d/article_1202b9ee-9707-463f-9b29-b6605fc30017.html
      - text: Hotel tax revenue is one of the more consistent drivers of tax revenue in Burlingame, and its 12% rate is lower than most other cities on the Peninsula.
