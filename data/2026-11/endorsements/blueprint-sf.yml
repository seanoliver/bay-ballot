  supervisor-2:
    pick:
      - Stephen Sherrill
    quotes:
      - text: Since becoming supervisor back in 2024, Sherrill has supported stronger enforcement against drug dealing and helped pass an extension of SF’s First Year Free program, which waives certain fees for small businesses.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: Sherrill comes to the job with a data-driven mindset; he’s a former staffer for NYC Mayor Michael Bloomberg and prior to becoming supervisor led the Mayor’s Office of Innovation under former Mayor London Breed.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  supervisor-4:
    pick:
      - Alan Wong
    quotes:
      - text: Since becoming supervisor in 2025, Wong has supported policies necessary for San Francisco’s recovery.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: Wong supports fully staffing SFPD and making it easier for small businesses to open and operate in the city.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  supervisor-6:
    pick:
      - Matt Dorsey
    quotes:
      - text: Since joining the Board in 2022, Dorsey has been one of City Hall's most consistent voices for public safety and a recovery-first approach to the drug crisis.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: As the only board member who’s experienced recovery, he authored the Recovery First ordinance, passed unanimously and signed by Mayor Lurie in May 2025, making long-term remission the city's stated drug-policy goal.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  supervisor-10:
    pick:
      - Theo Ellington
    quotes:
      - text: As the Golden State Warriors' first public affairs director, he helped bring the Chase Center to SF, boosting the City’s economy and creating thousands of jobs.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-a:
    pick: Y
    quotes:
      - text: Reforming the commission structure will reduce redundant bureaucracy and create a more efficient and responsive government.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-b:
    pick: N
  prop-d:
    pick: Y
    quotes:
      - text: We support this measure because San Francisco’s current ballot measure system is flawed and results in overly long ballots in which residents are asked to vote on a wide variety of measures that can be quite complex in nature.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-e:
    pick: Y
    quotes:
      - text: Currently, the City’s contracting process is convoluted and confusing, leading to a lack of competitive bidding and higher costs for the City. For example, the notorious $1.7 million Noe Valley public toilet was a product of SF’s current contracting process.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-f:
    pick: Y
    quotes:
      - text: This charter amendment would clarify lines of authority and thus accountability in government, making it clear that the elected Mayor is responsible for department performance by giving the Mayor direct hire/fire authority over department heads.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: Overall, this measure will create a more effective and accountable City Hall that will be better structured to address resident needs.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-h:
    pick: N
    quotes:
      - text: SF residents already pay some of the highest taxes in the country and our city has a high cost of living.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: When we’re in the middle of a cost of living crisis, the last thing our residents need is a new tax that will heavily impact homeowners and renters. Additionally, this tax measure disappointingly does not require SFMTA to make structural financial changes to help address its financial deficit.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-i:
    pick: N
    quotes:
      - text: This measure moves General Fund money into an earmarked fund, which means the city loses flexibility to use those dollars where they're needed most, like covering budget shortfalls.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
      - text: The city is already facing a General Fund budget deficit.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
  prop-j:
    pick: N
    quotes:
      - text: SF doesn't have a revenue problem. It has a spending problem.
        source: https://www.sfblueprint.org/advocacy/november-2026-voter-guide
