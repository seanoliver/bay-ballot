  miller-creek-sd-measure-n:
    pick: Y
    quotes:
      - text: Most MCSD schools were built 60 to 70 years ago and need repairs and updates to meet current academic and safety standards.
        source: https://marindemocrats.org/measure-n-miller-creek-school-district/
  marin-county-measure-p:
    pick: Y
    quotes:
      - text: Measure P is a voter-led solution that generates $12.5 million annually to expand access to high-quality, affordable preschool and child care for low- and middle-income families in Marin County.
        source: https://marindemocrats.org/measure-p/
      - text: Measure P ensures every dollar stays local.
        source: https://marindemocrats.org/measure-p/
  san-rafael-measure-w:
    pick: Y
    quotes:
      - text: Measure W allows San Rafael to address critical needs now - before deferred maintenance becomes more expensive and harder to fix.
        source: https://marindemocrats.org/measure-w-san-rafael-services/
  marin-healthcare-measure-cc:
    pick: Y
    quotes:
      - text: Measure CC ensures that we have access to life-saving medical care when we need it most.
        source: https://marindemocrats.org/measure-cc-critical-care-for-marin/
      - text: MarinHealth Medical Center is the only designated trauma center in Marin County — and a full-service community hospital providing emergency care, heart and stroke treatment, cancer care, surgery, and mental health services.
        source: https://marindemocrats.org/measure-cc-critical-care-for-marin/
