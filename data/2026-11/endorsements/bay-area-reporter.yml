  prop-g:
    pick: N
    quotes:
      - text: The park is there; the city controller’s office estimates it would cost millions of dollars to remove it and reconstruct the roadway, along with an annual cost of about $1.4 million.
        source: https://www.ebar.com/story/170564/Opinion/Editorial/Editorial%3A%20B.A.R.%20endorses%20SF%2C%20regional%20measures
      - text: Sea level rise and erosion are already a threat that will eventually overwhelm the roadway, as well as the cost to constantly remove sand from it.
        source: https://www.ebar.com/story/170564/Opinion/Editorial/Editorial%3A%20B.A.R.%20endorses%20SF%2C%20regional%20measures
  prop-h:
    pick: Y
    quotes:
      - text: Reliable public transportation is critical as San Francisco continues its economic recovery post COVID.
        source: https://www.ebar.com/story/170564/Opinion/Editorial/Editorial%3A%20B.A.R.%20endorses%20SF%2C%20regional%20measures
      - text: Prop H only funds Muni service, and San Franciscans are aware that the agency is facing severe fiscal challenges.
        source: https://www.ebar.com/story/170564/Opinion/Editorial/Editorial%3A%20B.A.R.%20endorses%20SF%2C%20regional%20measures
      - text: A reliable Muni will help San Francisco workers and residents, as well as visitors who bring in tourist dollars.
        source: https://www.ebar.com/story/170564/Opinion/Editorial/Editorial%3A%20B.A.R.%20endorses%20SF%2C%20regional%20measures
