  attorney-general:
    pick:
      - Rob Bonta
    quotes:
      - text: In our endorsement interview, incumbent Rob Bonta’s calm, clear and concise grasp of the complexities and nuances of California law — honed through more than eight years in the state Assembly — surpassed that of most of the current gubernatorial candidates.
        source: https://www.sfchronicle.com/projects/2026/california-sf-election-endorsements/
  insurance-commissioner:
