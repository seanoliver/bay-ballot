picks:
  prop-1:
    pick: Y
  prop-2:
    pick: Y
  prop-3:
    pick: Y
  prop-4:
    pick: Y
    quotes:
      - text: Wealthy donors and special interests continue to dominate election campaign spending.
        source: https://bayrisingaction.org/voterguide/
      - text: Money in politics sways our elections.
        source: https://bayrisingaction.org/voterguide/
  prop-5:
    pick: Y
  prop-38:
    pick: Y
  prop-39:
    pick: N
    quotes:
      - text: Prop 39 creates significant barriers to voting by prohibiting voting by mail or voting in person without disclosing or presenting a government-issued identification number.
        source: https://bayrisingaction.org/voterguide/
      - text: Voter suppression tactics like requiring government-issued IDs at the polls or on mail-in ballots create unnecessary barriers to engage in our democracy.
        source: https://bayrisingaction.org/voterguide/
  prop-40:
    pick: Y
    quotes:
      - text: Federal cuts will strip $100 billion from healthcare in California over the next five years—resulting in higher premiums and loss of coverage for millions of Californians.
        source: https://bayrisingaction.org/voterguide/
      - text: To stop the healthcare collapse in the state, Prop 40 would impose a one-time tax of up to 5% on taxpayers with covered assets over $1 billion, generating $100 billion in revenue over 5 years.
        source: https://bayrisingaction.org/voterguide/
  prop-41:
    pick: N
    quotes:
      - text: Prop 41 requires audits on new spending, but goes beyond oversight by creating structural barriers to future voter-approved revenue measures.
        source: https://bayrisingaction.org/voterguide/
      - text: The combination of Prop 41 and Prop 42 would make it significantly more difficult to design and implement progressive revenue solutions to fund schools, healthcare, housing, and other public priorities.
        source: https://bayrisingaction.org/voterguide/
  prop-42:
    pick: N
    quotes:
      - text: Prop 42 blocks new state taxes on personal property, including business interests, intellectual property, and financial assets—restricting California’s ability to ask the wealthiest individuals to contribute more toward public investments.
        source: https://bayrisingaction.org/voterguide/
      - text: The combination of Prop 41 and Prop 42 would make it significantly more difficult to design and implement progressive revenue solutions to fund schools, healthcare, housing, and other public priorities.
        source: https://bayrisingaction.org/voterguide/
  prop-43:
    pick: N
    quotes:
      - text: Under Prop 43, two-thirds of voters would need to approve local funding measures and taxes, allowing one-third of voters to overrule the majority and block funding for essential services.
        source: https://bayrisingaction.org/voterguide/
      - text: In practice, Prop 43 would make it nearly impossible to raise local revenue.
        source: https://bayrisingaction.org/voterguide/
  prop-44:
    pick: N
  prop-45:
    pick: N
  rtm:
    pick: Y
    quotes:
      - text: "Without this funding, public transit services would be cut dramatically: MUNI would cut services by at least 30%, AC Transit would reduce service by 16%, and BART would close 15 stations and cut service by 70%."
        source: https://bayrisingaction.org/voterguide/
      - text: An investment in public transit is an investment in a thriving economy, clearer air, and a more affordable region.
        source: https://bayrisingaction.org/voterguide/
  prop-a:
    pick: N
  prop-b:
    pick: Y
    quotes:
      - text: Banks currently invest our public dollars in harmful industries like fossil fuels, tobacco, the military, and weapons manufacturing.
        source: https://bayrisingaction.org/voterguide/
      - text: A public bank would benefit San Franciscans by creating low-interest loans for city infrastructure and affordable housing, commercial loans through credit unions and community banks, and loans to drive community revitalization.
        source: https://bayrisingaction.org/voterguide/
  prop-c:
    pick: Y
  prop-d:
    pick: N
    quotes:
      - text: Prop D would make it harder for voters to have their voices heard by increasing the number of signatures a measure needs to reach the ballot.
        source: https://bayrisingaction.org/voterguide/
  prop-e:
    pick: N
    quotes:
      - text: Prop E slashes the authority and community oversight provided by the city’s commissions and replaces it with more Deputy Mayors in a bloated executive branch of government.
        source: https://bayrisingaction.org/voterguide/
  prop-f:
    pick: N
    quotes:
      - text: Prop F gives the Mayor more powers vis-à-vis the Board of Supervisors by raising the threshold for Board approval and amendments of contracts, increasing the Mayor’s authority over contracts, and extending the City Administrator’s term from 5 to 10 years.
        source: https://bayrisingaction.org/voterguide/
  prop-h:
    pick: Y
    quotes:
      - text: After years of pandemic disruption and lost revenue, Muni is confronting a $307 million annual deficit—a shortfall so large it rivals the combined budgets of the city’s parks and library systems.
        source: https://bayrisingaction.org/voterguide/
      - text: Resulting cuts to Muni would worsen SF’s congestion and gridlock, which is already ranked the 3rd-worst in any major US city.
        source: https://bayrisingaction.org/voterguide/
  prop-i:
    pick: Y
    quotes:
      - text: San Francisco faces an affordable housing crisis that is displacing thousands of people from the city.
        source: https://bayrisingaction.org/voterguide/
      - text: Measure I dedicates an existing, voter-approved tax to fund permanently affordable housing and preventing displacement.
        source: https://bayrisingaction.org/voterguide/
  prop-j:
    pick: Y
  redwood-city-measure-e:
    pick: Y
