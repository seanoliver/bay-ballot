  prop-1:
    pick: N
    quotes:
      - text: Provides taxpayer-funded subsidies to developers without reforming costly mandates that make housing so expensive.
        source: https://www.reformcalifornia.org/voter-guides/solano
      - text: Prop 1 does nothing to make housing more affordable.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-2:
    pick: N
    quotes:
      - text: Prop 2 eviscerates the current voter-imposed spending limit on state politicians.
        source: https://www.reformcalifornia.org/voter-guides/solano
      - text: With Prop 2, politicians get to keep more of your money so they can waste more of your money.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-3:
    pick: N
    quotes:
      - text: Worse, Prop 3 does nothing to reform wasteful spending in the programs it purports to fund, so taxpayers will not see better services.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-4:
    pick: N
    quotes:
      - text: Voters wisely decided years ago that their tax dollars should never be used to fund the campaigns of politicians, but with Prop 4 the politicians are refusing to take no for an answer.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-5:
    pick: N
    quotes:
      - text: Under Prop 5, if the voters recall the Governor, you don’t get to choose the replacement — the office is automatically handed to the political machine’s second-in-command.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-37:
    pick: N
    quotes:
      - text: Worse, Prop 37 makes the State of California one of the biggest mortgage lenders in America overnight – and taxpayers are left holding the bag for any losses.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-38:
    pick: Y
    quotes:
      - text: Every drug and treatment developed with this funding must be sold in California at 20% BELOW the national average price.
        source: https://www.reformcalifornia.org/voter-guides/solano
      - text: Half of the research money is required by law to target cancer, heart disease and Alzheimer's.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-39:
    pick: Y
    quotes:
      - text: Prop 39 is a bipartisan solution for Voter ID!
        source: https://www.reformcalifornia.org/voter-guides/solano
      - text: Prop 39 requires cleaning up and auditing of voter rolls and citizenship verification of anyone registering to vote.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-40:
    pick: N
    quotes:
      - text: Worse, Prop 40 creates the first-in-the-nation Wealth Tax (or Savings Tax) on Californians.
        source: https://www.reformcalifornia.org/voter-guides/solano
      - text: Prop 40 allows government to tax the value of your savings, checking account, 401k, stock portfolio, and current equity in your home.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-41:
    pick: Y
    quotes:
      - text: Prop 41 requires that all special taxes include audits on all revenues raised and programs funded through the tax to prevent waste, fraud and abuse or diversion of the funds by politicians.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-42:
    pick: Y
    quotes:
      - text: Prop 42 would prohibit politicians from taxing the value of your savings, checking account, 401k, stock portfolio, and current equity in your home.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-43:
    pick: Y
    quotes:
      - text: Prop 43 makes it harder for local politicians to raise your taxes by restoring the two-thirds vote requirement on any local tax measures.
        source: https://www.reformcalifornia.org/voter-guides/solano
  prop-44:
    pick: N
    quotes:
      - text: Increases mandates and costs on community health clinics, threatening their ability to provide patient care.
