  prop-45:
    pick: Y
    quotes:
      - text: California’s environmental review law (CEQA) has been weaponized to block and delay housing, adding years and millions of dollars to every project.
        source: https://www.reformcalifornia.org/voter-guides/solano
  rtm:
    pick: N
    quotes:
      - text: Imposes a new costly sales tax despite massive levels of wasteful spending, giving government workers massive salary hikes and pension spikes, and awarding contracts to political supporters without fair and open competition.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-a:
    pick: N
    quotes:
      - text: Sold as streamlining while eliminating just three of the city's hundred-plus commissions, it makes pension board members nearly impossible to remove, hands organized labor a guaranteed seat on the commission that sets water and power rates, strips the city's authority to discipline striking government employees, and lets politicians abolish the watchdog committee voters created to guard homelessness tax dollars.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-b:
    pick: N
    quotes:
      - text: Puts taxpayers on the hook for a loan portfolio written by political appointees, where every lending decision becomes a political decision, every loss lands on the general fund, and the whole operation sits outside the budget scrutiny that applies to real city departments.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-c:
    pick: N
    quotes:
      - text: Locks up an ever-growing share of the city's general fund for another thirty-two years, ratcheting automatically to $125 million every year regardless of deficits, police and fire needs, or the condition of the streets, while expanding taxpayer-funded down payment loans to households earning twice the area median income.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-d:
    pick: N
    quotes:
      - text: Quadruples the signatures ordinary citizens need to put a measure on the ballot, from 2 percent to 8 percent of registered voters, pricing grassroots taxpayer groups and neighborhood coalitions out of the initiative process while leaving well-funded special interests free to simply buy the signatures they need.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-e:
    pick: N
    quotes:
      - text: Hands an unelected City Administrator rulemaking power that takes effect unless politicians affirmatively stop it, raising the dollar threshold above which elected supervisors must approve a contract, and extending that same official's term.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-f:
    pick: Y
    quotes:
      - text: Gives the mayor San Franciscans actually elect the authority to hire and fire the department heads responsible for city services, including — by the measure's own findings — department heads implicated in serious ethical lapses whom the mayor currently cannot remove.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-g:
    pick: Y
    quotes:
      - text: Reopens a taxpayer-funded arterial to the taxpayers who paid for it, undoing a closure that pushed traffic onto Sunset District residential streets and cut off seniors, parents and everyone who cannot make the trip by bicycle.
        source: https://www.reformcalifornia.org/voter-guides/san-francisco
  prop-h:
    pick: N
  prop-i:
