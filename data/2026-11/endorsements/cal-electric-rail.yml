picks:
  prop-2:
    pick: Y
    quotes:
      - text: Proposition 2 is a sensible solution that allows the Legislature to bank more money in peak years to reduce downside risks when the economy falters.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
      - text: Prop 2 would increase the size of the Rainy Day Fund to 20% of revenues, ensuring more consistent funding from year to year.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
  prop-43:
    pick: N
    quotes:
      - text: This measure would handicap the ability of local governments to raise revenue for transit service and capital projects by raising the margin to two thirds for citizen tax initiatives.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
      - text: Prop 43 would seriously hamper future attempts to save transit systems like Metrolink, NCTD, or San Diego MTS from impending fiscal cliffs.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
  prop-45:
    pick: N
  rtm:
    pick: Y
    quotes:
      - text: If measure RTM doesn’t pass, severe service cuts to BART, Caltrain, Muni, and other Bay Area transit agencies could go into effect as soon as January 2027.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
      - text: Failure to pass RTM would mean undoing the success of Caltrain electrification, create a traffic nightmare, and harm the Bay Area economy.
        source: https://calelectricrail.org/2026-californians-for-electric-rail-voter-guide/
