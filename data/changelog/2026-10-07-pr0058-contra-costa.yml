date: 2026-10-07
type: new
title: Contra Costa County is on Bay Ballot, with its own page at /2026-11/contra-costa
details: 32 guides cover Contra Costa, 19 of them new, with 59 local contests plus Congress Districts 8 to 10 and Assembly Districts 11, 14, 15 and 16. Thirteen existing guides, including the Sierra Club, SEIU 1021 and Courage California, now count on Contra Costa contests, and The Mercury News guide now names the East Bay Times. Six of the new guides also cover Marin. Contra Costa is in the Counties filter on the Bay Area list.
pr: 58
