date: 2026-10-09
type: data
title: Twelve more local measures in Marin and Santa Clara County, each with Reform California's position
details: Marin gains Reed Union School District Measure O, Corte Madera Measure Q, Mill Valley Measure T, County Service Area 29 (Paradise Cay) Measure Z, Inverness Public Utility District Measure AA, Stinson Beach County Water District Measure EE and Upper Bay Permanent Road Division Measure FF. Santa Clara County gains Morgan Hill Measure A, Santa Clara Measure C and Sunnyvale Measures G, H and I.
