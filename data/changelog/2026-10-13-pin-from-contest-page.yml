date: 2026-10-13
type: new
title: "Pin guides and count one side straight from a contest"
details: "Wherever a contest's details show, on its own page, in the panel beside the ballot list, or in the sheet on phones, every guide on each side has a pin button next to its name, so you can pin it and see its picks on every contest. The name still opens the guide's page. Pinned guides look filled in, and you can pin up to 4. On a contest page or an area's ballot, guides that made no pick on the contest are listed under No pick. Each side also has a Count only these button that counts just that side's guides across the ballot; tap it again, or use Reset filters, to count the others again."
