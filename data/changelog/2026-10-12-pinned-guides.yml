date: 2026-10-12
type: new
title: "Pin up to four guides to see their picks on every contest"
details: "In Filters, the pin next to a guide adds it to Your guides. Each contest row in the list then shows each pinned guide's pick, in the bar's colors, so you can scan how the guides you trust voted without opening each contest. Pins stay in the link, so a shared link shows the same guides, and Reset filters keeps them. A pinned guide with no position on a contest is left off that row. A guide pinned on another area's page is listed in Filters as not on this ballot."
