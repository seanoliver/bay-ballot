date: 2026-10-12
type: data
title: "Every guide page now says who the guide is"
details: "Each of the 126 guides has a new one- or two-sentence description: what kind of organization it is, what it focuses on, and how it decides its endorsements, where the guide says so. Every description has the same length budget and is sourced from the guide's own pages, news coverage, and other public records."
