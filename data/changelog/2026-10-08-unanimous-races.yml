date: 2026-10-08
type: new
title: "Races where every guide agrees now say Unanimous"
details: "The bar fills in that candidate's color instead of grey, and the line reads \"Unanimous · N of N guides\". Multi-seat races where every guide picked the same slate no longer say Split. Candidate colors now follow standing: the most-endorsed candidate is always the first color (blue), the next is pink, and so on, so a color can change if the lead changes."
