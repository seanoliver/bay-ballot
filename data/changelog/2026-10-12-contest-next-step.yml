date: 2026-10-12
type: new
title: "Contest pages link to the rest of your ballot"
details: "Each contest page now ends with a link to the rest of the ballot. A local contest, such as San Mateo County Measure J, links to its area's ballot and says how many contests that ballot has. A contest on more than one county's ballot, such as a Supreme Court retention, lists the counties whose ballots carry it so you can pick yours. Before, the only link to your area's ballot was the small one above the card."
