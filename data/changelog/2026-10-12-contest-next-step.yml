date: 2026-10-12
type: new
title: "Contest pages link to the rest of your ballot"
details: "Each contest page now ends with a link to the rest of the ballot. A local contest, such as San Mateo County Measure J, links to its area's ballot and says how many contests that ballot has. A contest on more than one county's ballot, such as a Supreme Court retention, lists the counties whose ballots carry it so you can pick yours. Before, the only way back was the small link above the card, which for a statewide contest went to the whole Bay Area."
pr: 157
