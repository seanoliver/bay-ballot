date: 2026-10-13
type: new
title: "Your ZIP now shows which House, Assembly and State Senate races are on your ballot"
details: "Entering a ZIP used to keep every congressional, Assembly, State Senate and Board of Equalization race in its counties and mark each one \"may be on your ballot\". Now the ZIP keeps only the districts it overlaps, using the congressional map voters adopted with Proposition 50 and the 2021 state maps. Sonoma County supervisor and San José City Council races work the same way. When the whole ZIP lies in one district, that race is now marked as on your ballot, and this applies to San Francisco supervisors too. A ZIP that spans more than one district keeps each of them, marked \"may be on your ballot\". Show all brings back the rest."
