date: 2026-10-13
type: new
title: "Your ZIP now narrows the House, Assembly and State Senate races"
details: "Entering a ZIP used to keep every congressional, Assembly, State Senate and Board of Equalization race in its counties and mark each one \"may be on your ballot\". Now the ZIP keeps the districts it overlaps, using the congressional map voters adopted with Proposition 50 and the 2021 state maps, and hides the others. Sonoma County supervisor and San José City Council races work the same way. When the whole ZIP lies in one district, that race is marked as on your ballot, and this applies to San Francisco supervisors too. A ZIP that spans more than one district, or lies close to another, keeps each of them as \"may be on your ballot\". ZIP areas come from the Census and don't match postal ZIPs exactly, so if a race you expect is missing, Show all brings back the rest."
