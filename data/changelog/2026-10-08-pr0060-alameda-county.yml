date: 2026-10-08
type: new
title: Alameda County is on Bay Ballot, with its own pages for Oakland and Berkeley
details: 38 guides cover Alameda County, 17 of them new, from the Alameda County Democrats and the Alameda Labor Council to East Bay for Everyone and Empower Oakland. There are 109 Alameda County contests plus Congress Districts 12 and 14 and Assembly Districts 18 and 20. Twenty-one existing guides, including the Sierra Club, SEIU 1021, East Bay DSA and Courage California, now count on Alameda contests. Alameda is in the Counties filter on the Bay Area list.
pr: 60
