date: 2026-10-12
type: new
title: "Enter your ZIP code to see only the contests that can be on your ballot"
details: "Each ballot page has a ZIP code box. It hides contests for cities and districts your ZIP doesn't touch, such as other cities' councils and measures, and says how many it hid, with Show all to see them again. Contests whose districts cover only part of your ZIP, such as Supervisor and Congress, stay and are marked \"may be on your ballot\", with a link to California's My Voter Status to confirm. The ZIP is saved only on your device and never sent with page views."
