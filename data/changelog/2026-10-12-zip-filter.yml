date: 2026-10-12
type: new
title: "Enter your ZIP code to hide contests that likely aren't on your ballot"
details: "Each ballot page has a Your ZIP chip after the county chips. Type your ZIP and it applies at the fifth digit, showing your ZIP's ballot across the Bay Area; picking a county chip shows that county in full again. The ZIP's ballot hides other counties' contests, and city contests and city council races for cities your ZIP doesn't reach, and says how many it hid, with Show all to see them again. District contests in your county, such as Supervisor, Congress and school boards, stay and are marked \"may be on your ballot\", with a link to California's My Voter Status to confirm. ZIP areas are approximate near city and county lines, so Show all is always one tap away. The ZIP is saved only on your device and never sent with page views."
