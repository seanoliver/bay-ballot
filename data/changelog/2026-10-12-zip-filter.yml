date: 2026-10-12
type: new
title: "Enter your ZIP code to hide contests that can't be on your ballot"
details: "Each ballot page has a ZIP code box. It hides other counties' contests, and city contests and city council races for cities your ZIP doesn't reach, and says how many it hid, with Show all to see them again. District contests in your county, such as Supervisor, Congress and school boards, stay and are marked \"may be on your ballot\", with a link to California's My Voter Status to confirm. The ZIP is saved only on your device and never sent with page views."
