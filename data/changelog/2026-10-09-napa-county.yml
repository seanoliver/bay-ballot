title: Napa County is on Bay Ballot, with its own page at /2026-11/napa-county
details: 15 Napa guides and 17 local contests (13 races and 4 measures, Napa County Measure B, American Canyon Measure P, St. Helena Measure S and Yountville Measure Y), plus Congress District 4 and Assembly District 4. Three guides are new (the Napa County Democrats and Republicans and the Sierra Club Redwood Chapter), The Press Democrat adds its Napa editorials, and eleven others now count on Napa contests, among them the Napa Solano Central Labor Council, Reform California, SEIU 1021, Planned Parenthood, Greenbelt Alliance and 350 Bay Area Action.
pr: 110
