date: 2026-10-09
type: new
title: Napa County is on Bay Ballot, with its own page at /2026-11/napa-county
details: 13 Napa guides and 15 local contests (13 races and 2 measures, Napa County Measure B and American Canyon Measure P), plus Congress District 4 and Assembly District 4. Three guides are new (the Napa County Democrats and Republicans and the Sierra Club Redwood Chapter), The Press Democrat adds its Napa editorials, and nine others now count on Napa contests, among them SEIU 1021, Planned Parenthood, Greenbelt Alliance and 350 Bay Area Action.
