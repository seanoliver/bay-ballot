date: 2026-10-14
type: data
title: Mercury News endorsed No on Prop 44, No on Palo Alto Measure J, and three Concord City Council candidates
details: "The Mercury News and East Bay Times editorial boards recommend No on Prop 44, No on Palo Alto Measure J, and Laura Hoffmeister (District 1), Dena Acosta Beere (District 3) and Laura Nakamura (District 5) for Concord City Council."
