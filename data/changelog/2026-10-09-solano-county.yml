type: new
title: Solano County is on Bay Ballot, with its own page at /2026-11/solano
details: 15 Solano guides and 35 local contests (24 races and 11 measures), plus Congress District 8, Assembly District 11 and Board of Equalization District 1. Five guides are new (the Solano County Democrats and Republicans, the Northern Solano Democratic Club, the Napa Solano Central Labor Council and Reform California), and ten others now count on Solano contests, among them SEIU 1021, the Sierra Club Redwood Chapter, East Bay DSA and Courage California. Reform California's county voter guides also count in every other county on Bay Ballot.
pr: 110
