date: 2026-10-09
type: new
title: Sonoma County is on Bay Ballot, with its own page at /2026-11/sonoma
details: 20 Sonoma guides and 42 local contests (30 races and 12 measures), plus Congress Districts 1, 2 and 4, State Senate District 2 and Assembly Districts 2, 4 and 12. Six guides are new (The Press Democrat, the Sonoma County Democrats and Republicans, the Sonoma County API Democratic Club, Indivisible Sonoma County and the Sonoma County Farm Bureau), and fourteen others now count on Sonoma contests, among them the North Bay Labor Council, the Sierra Club Redwood Chapter, Reform California, SEIU 1021 and Courage California. The Sonoma County Board of Education Trustee Area 2 contest moved here from Marin's list. Petaluma Joint Union High School District Trustee Area 3 and Santa Rosa Junior College Measure AB are new, and they also show on Marin pages.
pr: 110
