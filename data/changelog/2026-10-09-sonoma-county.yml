date: 2026-10-09
type: new
title: Sonoma County is on Bay Ballot, with its own page at /2026-11/sonoma
details: 18 Sonoma guides and 38 local contests (26 races and 12 measures), plus Congress Districts 1, 2 and 4, State Senate District 2 and Assembly Districts 2, 4 and 12. Six guides are new (The Press Democrat, the Sonoma County Democrats and Republicans, the Sonoma County API Democratic Club, Indivisible Sonoma County and the Sonoma County Farm Bureau), and twelve others now count on Sonoma contests, among them the North Bay Labor Council, SEIU 1021 and Courage California. The Sonoma County Board of Education, Petaluma high school and Santa Rosa Junior College contests that also reach Marin ballots are now listed with Sonoma.
