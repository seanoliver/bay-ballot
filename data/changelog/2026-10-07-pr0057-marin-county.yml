title: Marin County is on Bay Ballot, with its own page at /2026-11/marin
details: 14 Marin guides and 41 local contests, plus Congress District 2, State Senate District 2 and Assembly District 12. Five guides are new (the Marin Democrats and Republicans, the North Bay Labor Council, the League of Women Voters of Marin and Indivisible Marin), and nine others now count on Marin contests, among them the Marin Independent Journal's editorials under the Mercury News guide.
