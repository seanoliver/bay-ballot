<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.11.1/lib/elk.bundled.js"></script>
<style>
  :root {
    --bg: #0b0e13; --panel: #11161d; --line: #232b36; --text: #d7dde5; --dim: #7d8794;
    --core: #3ecf8e; --supporting: #a78bfa; --plumbing: #7b8494; --contract: #22d3ee; --test: #f472b6;
    --gotcha: #f5a524; --changed: #2ea043; --removed: #f85149;
    --call: #aab4c0; --http: #5aa9ff; --data: #c084fc; --ext: #f5a524;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #vp { position: fixed; inset: 0; overflow: hidden; cursor: grab; user-select: none;
    background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1.2px); }
  #vp.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .lvl { position: absolute; left: 0; top: 0; }
  .lvl > div, .lvl > svg { position: absolute; left: 0; top: 0; }
  .lvl > svg { overflow: visible; }
  .lvl.hidden { display: none; }
  #measure { position: absolute; left: -100000px; top: 0; visibility: hidden; }
  .flip { transition: transform .38s cubic-bezier(.3,.7,.2,1), opacity .38s; }
  .fade-in { animation: fadein .45s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* areas */
  .area { position: absolute; border: 2px solid color-mix(in srgb, var(--c) 35%, transparent);
    background: color-mix(in srgb, var(--c) 4%, transparent); border-radius: 28px; transform-origin: 0 0; }
  .area.depth-0 { border-width: 3px; background: color-mix(in srgb, var(--c) 3%, transparent); }
  .area.depth-2 { border-style: dashed; background: transparent; }
  .area-label { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb, var(--c) 80%, white); font-weight: 600; }
  .area-label small { color: var(--dim); font-weight: 400; margin-left: .5em; }

  /* units + cards */
  .unit { position: absolute; transform-origin: 0 0; }
  .card { position: absolute; left: 0; top: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .unit:hover > .card { border-color: #3a4554; }
  .repo { font-family: var(--mono); border-radius: 6px; padding: .1em .45em; font-weight: 600; color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, transparent); }

  /* System tiles: drawn at screen scale (1 world px = 1 screen px at 100%) */
  .tile { position: relative; padding: 8px 21px 8px 10px; border-left: 3px solid var(--rc); border-radius: 6px; }
  .tile .t-name { font-family: var(--mono); font-size: 13px; font-weight: 700; line-height: 17px; white-space: nowrap; overflow: hidden; color: #eef2f6; }
  .tile .t-role { font-size: 12.5px; line-height: 16px; color: #c4ccd6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tile .t-meta { font-size: 12px; line-height: 16px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .t-meta .plus { color: #7ee787; }
  /* file map: top of the strip = top of the file */
  .strip { position: absolute; right: 8px; top: 7px; bottom: 7px; width: 6px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .strip i { position: absolute; left: 0; right: 0; border-radius: 2px; min-height: 3px; cursor: pointer; background: var(--rc); }
  .strip i.f-gotcha { background: repeating-linear-gradient(180deg, var(--gotcha) 0 3px, var(--rc) 3px 6px); }
  .strip i:hover { outline: 2px solid #fff; z-index: 1; }
  .strip b { position: absolute; left: -5px; width: 2px; background: var(--changed); min-height: 2px; }
  .ext { padding: 26px 28px; border-color: rgba(245,165,36,.5); background: linear-gradient(180deg, #1a150c, var(--panel)); }
  .ext h3 { margin: 0 0 .4em; color: var(--ext); font-family: var(--mono); }
  .ext p { margin: 0; color: #b9c2cd; line-height: 1.35; }
  .ext .kind { color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  .lvl-far .ext { padding: 8px 10px; border-style: dashed; border-radius: 6px; } .lvl-far .ext h3 { font-size: 13px; line-height: 17px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lvl-far .ext p { font-size: 12.5px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lvl-mid .ext h3 { font-size: 34px; } .lvl-mid .ext p { font-size: 21px; } .lvl-mid .ext .kind { font-size: 18px; }
  .lvl-near .ext h3 { font-size: 20px; } .lvl-near .ext p { font-size: 13px; } .lvl-near .ext .kind { font-size: 10px; }

  /* code cards */
  .chead { display: flex; align-items: center; gap: .8em; border-bottom: 1px solid var(--line); background: #0e131a; }
  .chead .path { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chead .path .dir { color: var(--dim); }
  .chead .lc { color: var(--dim); font-family: var(--mono); white-space: nowrap; }
  .chead .plus { color: #7ee787; font-family: var(--mono); }
  .frole { color: #aab3bf; border-bottom: 1px solid var(--line); }
  .lvl-mid .chead { font-size: 21px; padding: 16px 22px; } .lvl-mid .frole { font-size: 18px; padding: 10px 22px; }
  .lvl-near .chead { font-size: 13px; padding: 10px 14px; } .lvl-near .frole { font-size: 12.5px; padding: 7px 14px; }
  .cbody { padding: 6px 0; }
  .row, .fold { position: relative; display: flex; white-space: pre; font-family: var(--mono); }
  .lvl-near .row, .lvl-near .fold { font-size: 12.5px; line-height: 20px; height: 20px; }
  .lvl-mid .row, .lvl-mid .fold { font-size: 18px; line-height: 28px; height: 28px; }
  .ln { color: #4a5563; text-align: right; flex: 0 0 auto; padding-right: 1.1em; }
  .lvl-near .ln { width: 50px; } .lvl-mid .ln { width: 70px; }
  .src { overflow: hidden; flex: 1; padding-left: .3em; }
  .row.r::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--rc); }
  .row.r { background: color-mix(in srgb, var(--rc) 10%, transparent); }
  .row.r.f-gotcha::before { width: 4px; background: repeating-linear-gradient(180deg, var(--gotcha) 0 5px, var(--rc) 5px 10px); }
  /* merged diff (PR mode, Diff on): deleted lines inline in red above what replaced them, added lines green */
  .diff-on .row.chg { background: rgba(46,160,67,.14); }
  .diff-on .row.chg .ln { color: #7ee787; background: rgba(46,160,67,.2); box-shadow: inset -3px 0 var(--changed); }
  .row.del { background: rgba(248,81,73,.14); overflow: hidden; }
  .row.del .ln { color: #ff9b95; background: rgba(248,81,73,.2); box-shadow: inset -3px 0 var(--removed); }
  .row.del .src { opacity: .85; }
  .diff-on .row .src::before { content: ' '; display: inline-block; width: 1.4ch; }
  .diff-on .row.chg .src::before { content: '+'; color: #7ee787; }
  .diff-on .row.del .src::before { content: '−'; color: #ff9b95; }
  #diff.on { background: #233041; color: #fff; }
  .fold { color: #5c6673; font-style: italic; background: repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 6px, transparent 6px 12px); }
  .row.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%,30% { background: rgba(90,169,255,.45); } 100% { } }
  .chips { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
  .chip { font-family: var(--sans); font-style: normal; border-radius: 999px; cursor: pointer; white-space: nowrap; border: 1px solid; background: #0d1219; }
  .lvl-near .chip { font-size: 10.5px; padding: 0 7px; line-height: 15px; }
  .lvl-mid .chip { font-size: 15px; padding: 0 9px; line-height: 22px; }
  .chip.call { color: var(--call); border-color: rgba(170,180,192,.4); }
  .chip.http { color: var(--http); border-color: rgba(90,169,255,.5); }
  .chip.data { color: var(--data); border-color: rgba(192,132,252,.5); }
  .chip:hover { background: #1b2430; }

  /* callout bubbles (opaque, live inside the unit, never under an edge) */
  .bubble { position: absolute; background: #141b24; border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4); cursor: pointer; }
  .bubble .kt { display: flex; gap: .5em; align-items: center; text-transform: uppercase; letter-spacing: .08em; color: var(--rc); font-weight: 700; }
  /* inline code in prose (callouts, tour, TL;DR, roles) */
  code { font-family: var(--mono); font-size: .9em; color: #e6edf3; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; padding: 0 .3em; }
  .badge { border-radius: 4px; padding: 0 .4em; letter-spacing: .04em; }
  .badge.gotcha { color: #1a1205; background: var(--gotcha); }
  .badge.changed { color: #04180a; background: #56d364; }
  .bubble .bt { font-weight: 650; color: #eef2f6; }
  .bubble .bb { color: #a7b0bc; }
  .lvl-near .bubble { padding: 8px 11px; } .lvl-near .bubble .kt { font-size: 9.5px; } .lvl-near .bubble .bt { font-size: 13px; margin: 2px 0 3px; } .lvl-near .bubble .bb { font-size: 12px; line-height: 1.45; }
  /* Code view callouts: one-line title; the role, flags and body slide open below it */
  .lvl-near .bubble { cursor: pointer; padding: 3px 10px; }
  .lvl-near .bubble .bt { margin: 0; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvl-near .bubble .bt .badge { margin-right: 5px; }
  .lvl-near .bubble .car { display: inline-block; color: var(--dim); font-size: 10px; margin-right: 5px; transition: transform .2s ease; }
  .lvl-near .bubble.open .car { transform: rotate(90deg); }
  .lvl-near .bubble .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
  .lvl-near .bubble.open .more { grid-template-rows: 1fr; }
  .lvl-near .bubble .more > .in { overflow: hidden; min-height: 0; }
  .lvl-near .bubble .in .kt { padding-top: 4px; } .lvl-near .bubble .in .bb { padding-bottom: 4px; }
  .lvl-near .bubble:hover { border-color: #3a4554; background: #18202b; }
  .lvl-mid .bubble { padding: 12px 18px; } .lvl-mid .bubble .kt { font-size: 14px; } .lvl-mid .bubble .bt { font-size: 19px; margin-top: 3px; }
  .usvg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* edges */
  .edge .vis { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .edge.call .vis { stroke: var(--call); } .edge.http .vis { stroke: var(--http); } .edge.data .vis { stroke: var(--data); }
  .stub.call { stroke: var(--call); } .stub.http { stroke: var(--http); } .stub.data { stroke: var(--data); }
  .edge .hit { fill: none; stroke: transparent; pointer-events: stroke; cursor: pointer; }
  .edge:hover .vis { stroke: #fff; }
  .elabel { position: absolute; white-space: nowrap; border-radius: 999px; border: 1px solid; background: #0d1219; cursor: pointer; font-family: var(--mono); box-shadow: 0 4px 14px rgba(0,0,0,.5); text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .elabel.call { color: var(--call); border-color: rgba(170,180,192,.45); }
  .elabel.http { color: var(--http); border-color: rgba(90,169,255,.55); }
  .elabel.data { color: var(--data); border-color: rgba(192,132,252,.55); }
  .elabel:hover { background: #1b2430; }
  .elabel { opacity: 0; pointer-events: none; transition: opacity .15s; }
  .elabel.show, .focusing .elabel.glow { opacity: 1; pointer-events: auto; }

  /* focus (TL;DR hover, tour step) */
  .focusing .unit:not(.glow) { opacity: .22; }
  .focusing .edge:not(.glow) { opacity: .1; }
  .focusing .unit.glow .row:not(.glow), .focusing .unit.glow .bubble:not(.glow), .focusing .unit.glow .strip i:not(.glow) { opacity: .5; }
  .unit, .edge, .bubble { transition: opacity .2s; }
  .row { transition: opacity .2s, background .28s ease; }
  .focusing .unit.glow > .card { border-color: #9fb3c8; box-shadow: 0 0 0 2px rgba(159,179,200,.35), 0 10px 40px rgba(0,0,0,.5); }
  .row.glow { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .bubble.glow { border-color: #9fb3c8; box-shadow: 0 0 0 2px rgba(159,179,200,.4), 0 6px 24px rgba(0,0,0,.5); }
  .strip i.glow { outline: 2px solid #fff; }
  .edge.glow .vis { filter: drop-shadow(0 0 6px currentColor); }
  .edge.glow.call .vis { color: var(--call); } .edge.glow.http .vis { color: var(--http); } .edge.glow.data .vis { color: var(--data); }

  /* HUD */
  .hud { position: fixed; z-index: 10; background: rgba(17,22,29,.94); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); }
  #hud-info { left: 16px; top: 16px; width: 360px; max-height: calc(100vh - 220px); overflow: auto; padding: 14px 16px; font-size: 13px; }
  #hud-info .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); padding-right: 30px; }
  #hud-info h1 { font-size: 16px; margin: 4px 30px 6px 0; }
  #hud-info .q { color: #aab3bf; margin: 0 0 8px; }
  #hud-info ul { margin: 0; padding-left: 18px; color: #c4ccd6; line-height: 1.5; }
  #hud-info li.refs { cursor: pointer; }
  #hud-info li.refs .tx { text-decoration: underline dotted rgba(200,210,220,.45); text-underline-offset: 3px; }
  #hud-info li.refs .cnt { color: var(--dim); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  #hud-info li.refs:hover .tx { color: #fff; text-decoration-color: #fff; }
  #hud-info .sub { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #hud-info.collapsed ul, #hud-info.collapsed .q, #hud-info.collapsed .sub { display: none; }
  #collapse { position: absolute; right: 10px; top: 10px; }
  #hud-zoom { right: 16px; top: 16px; display: flex; gap: 6px; padding: 6px; align-items: center; }
  #hud-zoom .seg { display: flex; background: #0b0f14; border-radius: 8px; padding: 2px; }
  #hud-zoom .seg button { border: 0; background: transparent; }
  #hud-zoom .seg button.on { background: #233041; color: #fff; }
  #pct { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 46px; text-align: center; }
  button { font: inherit; font-size: 12.5px; color: var(--text); background: #18202a; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: #222c38; }
  button:disabled { opacity: .35; cursor: default; }
  #hud-legend { left: 16px; bottom: 16px; padding: 10px 14px; font-size: 12px; max-width: 360px; }
  #hud-legend .r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #hud-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #hud-legend .ln2 { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }
  #hud-legend .defs { display: none; margin: 8px 0 2px; line-height: 1.45; color: #b6bfca; }
  #hud-legend .defs b { color: #eef2f6; font-weight: 600; }
  #hud-legend .defs div { margin: 2px 0; }
  #hud-legend:hover .defs, #hud-legend.open .defs { display: block; }
  #hud-legend .hint { color: var(--dim); margin-top: 6px; }
  #hud-mini { right: 16px; bottom: 16px; padding: 6px; }
  #mini { display: block; cursor: pointer; }
  #tour { left: 50%; transform: translateX(-50%); bottom: 16px; width: min(720px, calc(100vw - 680px)); min-width: 420px; display: flex; gap: 12px; align-items: center; padding: 10px 12px; }
  #tour .num { font: 600 11px var(--mono); color: #f5d76e; white-space: nowrap; }
  #tour .body { flex: 1; min-width: 0; font-size: 12.5px; color: #c4ccd6; }
  #tour .body b { display: block; color: #fff; font-size: 13.5px; margin-bottom: 1px; }
  #tour.idle .body, #tour.idle .num, #tour.idle #t-prev, #tour.idle #t-next, #tour.idle #t-exit { display: none; }
  #tour:not(.idle) #t-start { display: none; }
  #tour.idle { width: auto; min-width: 0; }
  #tip { position: fixed; z-index: 20; pointer-events: none; background: #0d1219; border: 1px solid #3a4554; border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px; box-shadow: 0 8px 28px rgba(0,0,0,.55); display: none; }
  #tip .kt { text-transform: uppercase; letter-spacing: .08em; font-size: 10px; font-weight: 700; display: flex; gap: .5em; }
  #tip .bt { font-weight: 650; color: #fff; margin: 2px 0; }
  #tip .ln3 { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  /* current-file label: top centre, shown in Snippets/Code once a card's header has scrolled off screen */
  #crumb { left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; border-radius: 999px; padding: 7px 14px;
    display: flex; gap: .7em; align-items: center; font-size: 13px; white-space: nowrap; max-width: max(260px, calc(100vw - 840px)); transition: opacity .15s, transform .15s; }
  #crumb.on { opacity: 1; transform: translate(-50%, 0); }
  #crumb .path { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; } #crumb .path .dir { color: var(--dim); }
  #crumb .cl { font-family: var(--mono); color: var(--dim); }
  #err { position: fixed; inset: 40px; z-index: 30; background: #1a0f10; border: 1px solid var(--removed); border-radius: 12px; padding: 20px; font-family: var(--mono); white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>
<div id="measure"></div>

<div id="hud-info" class="hud">
  <div class="tag" id="tag">Code guide</div>
  <h1 id="title"></h1>
  <p class="q" id="question"></p>
  <ul id="tldr"></ul>
  <div class="sub" id="tldr-hint"></div>
  <button id="collapse" title="Collapse / expand">–</button>
</div>
<div id="hud-zoom" class="hud">
  <div class="seg"><button data-lvl="far" title="1">System</button><button data-lvl="mid" title="2">Snippets</button><button data-lvl="near" title="3">Code</button></div>
  <span id="pct"></span>
  <button id="diff" title="Show deleted and added lines (d)" style="display:none">Diff</button>
  <button id="zout" title="Zoom out (-)">−</button><button id="zin" title="Zoom in (+)">+</button><button id="fit" title="Fit (0)">Fit</button>
</div>
<div id="hud-legend" class="hud">
  <div class="r" id="legend-row"></div>
  <div class="defs" id="legend-defs"></div>
  <div class="hint">Hover for definitions · pinch or ⌘-scroll to zoom · drag or scroll to pan · double-click a card · click an edge or chip to jump</div>
</div>
<div id="hud-mini" class="hud"><canvas id="mini" width="240" height="150"></canvas></div>
<div id="tour" class="hud idle">
  <button id="t-start">▶ Start tour</button>
  <button id="t-prev">←</button><span class="num" id="t-num"></span>
  <div class="body"><b id="t-title"></b><span id="t-body"></span></div>
  <button id="t-next">→</button><button id="t-exit" title="Exit tour (Esc)">✕</button>
</div>
<div id="crumb" class="hud"></div>

<script>window.GUIDE = {"meta": {"title": "The extraction pipeline and what it costs", "question": "How does a guide's web page become picks on the site, and where does the model spend go?", "mode": "explore", "tldr": [{"text": "Daily cron fetches every guide; only changed pages reach a model", "refs": ["h-cron", "h-gate", "h-unchanged"]}, {"text": "Two paid calls per changed guide: Sonnet extracts, Opus verifies", "refs": ["h-extract", "h-verify", "l-extract", "l-verify"]}, {"text": "Measured: about $0.30\u20130.40 per changed guide; $2.41\u2013$7.69 a day", "refs": ["h-rates", "h-budget"]}, {"text": "Quote checks and holds are plain code: no model, no cost", "refs": ["h-guards", "h-applyheld", "h-nextfile"]}, {"text": "Moving to the subscription swaps only `makeClient`; all else stays", "refs": ["h-client", "h-seam"]}], "pr": null}, "files": [{"id": "wf", "repo": "bb", "path": ".github/workflows/refresh.yml", "role": "Daily cron and merge gate", "startLine": 1, "totalLines": 306, "code": "name: Daily data refresh\n\non:\n  schedule:\n    - cron: \"0 13 * * *\"\n  workflow_dispatch:\n\npermissions: {}\n\nconcurrency:\n  group: data-refresh\n  cancel-in-progress: false\n\nenv:\n  BRANCH: data/refresh\n  ISSUE_TITLE: Data refresh needs review\n\njobs:\n  refresh:\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    permissions:\n      contents: write\n      pull-requests: write\n      issues: write\n    outputs:\n      sha: ${{ steps.pr.outputs.sha }}\n      pr: ${{ steps.pr.outputs.pr }}\n      code: ${{ steps.refresh.outputs.code }}\n      review: ${{ steps.refresh.outputs.review }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          persist-credentials: false\n          fetch-depth: 0\n\n      - name: Start from the open refresh PR, if any\n        id: base\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          echo \"main_sha=$(git rev-parse origin/main)\" >> \"$GITHUB_OUTPUT\"\n          # A fork can open a PR from its own data/refresh branch; never continue or merge that one.\n          pr=\"$(gh pr list --head \"$BRANCH\" --state open --json number,isCrossRepository,headRepositoryOwner \\\n            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')\"\n          if [ -n \"$pr\" ]; then\n            git fetch -q origin \"$BRANCH\"\n            git switch -q -c \"$BRANCH\" FETCH_HEAD\n            echo \"Continuing open PR #$pr\"\n            if ! git merge -q --no-edit origin/main; then\n              git merge --abort\n              gh label create needs-review --color d93f0b --description \"Data refresh needs a human look\" --force\n              gh pr edit \"$pr\" --add-label needs-review\n              gh pr comment \"$pr\" --body \"Refresh branch conflicts with main; resolve by hand.\"\n              echo \"stop=true\" >> \"$GITHUB_OUTPUT\"\n            fi\n          else\n            # Without this delete, the push from a fresh main branch is rejected as non-fast-forward.\n            if git ls-remote --exit-code --heads origin \"$BRANCH\" >/dev/null; then\n              git push -q \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\" --delete \"$BRANCH\"\n            fi\n            git switch -q -c \"$BRANCH\"\n          fi\n          echo \"pr=$pr\" >> \"$GITHUB_OUTPUT\"\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n\n      - run: npm ci\n\n      - name: Install pdftotext\n        run: sudo apt-get update && sudo apt-get install -y poppler-utils\n\n      - name: Install Chromium for browser-fetched guides\n        run: npx playwright install --with-deps chromium\n\n      - name: Read the open review issue\n        id: issue\n        if: steps.base.outputs.stop != 'true'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          issue=\"$(gh issue list --state open --app github-actions --search \"in:title \\\"$ISSUE_TITLE\\\"\" --json number,title --jq \"map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty\")\"\n          echo \"number=$issue\" >> \"$GITHUB_OUTPUT\"\n          if [ -n \"$issue\" ]; then\n            gh issue view \"$issue\" --json body --jq .body \\\n              | sed -n 's/^<!-- shrunk-state: \\(.*\\) -->$/\\1/p' > shrunk-state.json\n          fi\n\n      - name: Extract main's data as the changelog baseline\n        if: steps.base.outputs.stop != 'true'\n        env:\n          MAIN_SHA: ${{ steps.base.outputs.main_sha }}\n        run: |\n          mkdir -p \"$RUNNER_TEMP/main\"\n          git archive \"$MAIN_SHA\" data | tar -x -C \"$RUNNER_TEMP/main\"\n          test -d \"$RUNNER_TEMP/main/data\"\n\n      - name: Refresh\n        id: refresh\n        if: steps.base.outputs.stop != 'true'\n        env:\n          BAYBALLOT_ANTHROPIC_API_KEY: ${{ secrets.BAYBALLOT_ANTHROPIC_API_KEY }}\n        run: |\n          set +e\n          npm run bb -- refresh --summary summary.md --result result.json --shrunk-state shrunk-state.json --baseline \"$RUNNER_TEMP/main/data\"\n          echo \"code=$?\" >> \"$GITHUB_OUTPUT\"\n          echo \"review=$(node -e \"try { console.log(JSON.stringify(require('./result.json').review ?? [])) } catch { console.log('[]') }\")\" >> \"$GITHUB_OUTPUT\"\n\n      # A re-extracted guide's page text must be committed even if its data didn't change, or the next run re-extracts it.\n      - name: Decide whether to commit\n        id: changes\n        if: steps.base.outputs.stop != 'true'\n        run: |\n          data_changed=\"$(git status --porcelain -- data/2026-11/endorsements)\"\n          extracted=\"$(node -e \"try { console.log(require('./result.json').extracted.length) } catch { console.log(0) }\")\"\n          if [ -z \"$data_changed\" ] && [ \"$extracted\" = \"0\" ]; then\n            git checkout -- data/\n            git clean -fdq -- data/\n            echo \"commit=false\" >> \"$GITHUB_OUTPUT\"\n            echo \"No relevant changes; nothing to commit.\"\n          else\n            echo \"commit=true\" >> \"$GITHUB_OUTPUT\"\n          fi\n\n      - name: Commit, push, and open or update the PR\n        id: pr\n        if: steps.changes.outputs.commit == 'true'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          OPEN_PR: ${{ steps.base.outputs.pr }}\n          CODE: ${{ steps.refresh.outputs.code }}\n          REVIEW: ${{ steps.refresh.outputs.review }}\n        run: |\n          git add data/\n          git commit -q -m \"data: refresh $(date -u +%F)\"\n          git push -q \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\" \"HEAD:refs/heads/$BRANCH\"\n          echo \"sha=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"\n          { cat summary.md; echo; echo \"cc @seanoliver\"; } > pr-body.md\n          pr=\"$OPEN_PR\"\n          if [ -z \"$pr\" ]; then\n            url=\"$(gh pr create --base main --head \"$BRANCH\" --title \"data: daily refresh\" --body-file pr-body.md)\"\n            pr=\"${url##*/}\"\n          fi\n          # Before anything else can fail: gate needs `pr`, and labels again. Labeling is best effort.\n          echo \"pr=$pr\" >> \"$GITHUB_OUTPUT\"\n          if [ \"$(printf '%s' \"${REVIEW:-[]}\" | jq 'length')\" != \"0\" ]; then\n            gh label create needs-review --color d93f0b --description \"Data refresh needs a human look\" --force || echo \"::warning::could not create the needs-review label\"\n            gh pr edit \"$pr\" --add-label needs-review || echo \"::warning::could not label PR #$pr\"\n          fi\n          if [ -n \"$OPEN_PR\" ]; then\n            gh pr edit \"$pr\" --body-file pr-body.md\n            gh pr comment \"$pr\" --body \"New refresh run $(date -u +%F) (exit code $CODE); summary above is updated.\"\n          fi\n\n      - name: Open, update or close the review issue\n        if: always() && steps.refresh.outcome != 'skipped'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          CODE: ${{ steps.refresh.outputs.code }}\n          ISSUE: ${{ steps.issue.outputs.number }}\n          COMMITTED: ${{ steps.changes.outputs.commit }}\n        run: |\n          code=\"$CODE\"\n          issue=\"$ISSUE\"\n          # Without result.json (a crash) keep the previous shrunk-state rather than wiping it.\n          state=\"$(node -e \"const fs = require('fs'); try { const r = JSON.parse(fs.readFileSync('result.json', 'utf8')); console.log(JSON.stringify(Object.fromEntries(r.shrunk.map((s) => [s.id, s.pageHash])))) } catch { try { console.log(JSON.stringify(JSON.parse(fs.readFileSync('shrunk-state.json', 'utf8')))) } catch { console.log('{}') } }\")\"\n          if [ \"$code\" != \"0\" ] && { [ \"$COMMITTED\" != \"true\" ] || [ \"$state\" != \"{}\" ]; }; then\n            {\n              cat summary.md 2>/dev/null || echo \"The refresh run failed before writing a summary: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"\n              echo\n              echo \"cc @seanoliver\"\n              echo\n              # Parsed by the \"Read the open review issue\" step's sed; keep the format identical.\n              echo \"<!-- shrunk-state: $state -->\"\n            } > issue-body.md\n            if [ -n \"$issue\" ]; then\n              gh issue edit \"$issue\" --body-file issue-body.md\n              gh issue comment \"$issue\" --body \"Refresh run $(date -u +%F): exit code $code. Summary above is updated.\"\n            else\n              gh issue create --title \"$ISSUE_TITLE\" --body-file issue-body.md\n            fi\n          elif [ -n \"$issue\" ] && [ \"$code\" = \"0\" ]; then\n            gh issue close \"$issue\" --comment \"Refresh run $(date -u +%F) was clean; closing.\"\n          fi\n\n      - name: Fail the run on a refresh error\n        if: steps.refresh.outputs.code == '1'\n        run: exit 1\n\n  # Separate from refresh so the job that runs repo code never holds actions: write. It checks out nothing.\n  gate:\n    needs: refresh\n    if: ${{ !cancelled() && needs.refresh.outputs.sha != '' && needs.refresh.outputs.pr != '' }}\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    permissions:\n      actions: write\n      contents: write\n      pull-requests: write\n    env:\n      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n      GH_REPO: ${{ github.repository }}\n      SHA: ${{ needs.refresh.outputs.sha }}\n      PR: ${{ needs.refresh.outputs.pr }}\n    steps:\n      - name: Run CI on the refresh branch\n        id: ci\n        continue-on-error: true\n        timeout-minutes: 25\n        run: |\n          echo \"url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\" >> \"$GITHUB_OUTPUT\"\n          start=\"$(date -u +%FT%TZ)\"\n          gh workflow run ci.yml --ref \"$BRANCH\"\n          run=\"\"\n          for _ in $(seq 24); do\n            sleep 5\n            run=\"$(gh run list --workflow ci.yml --branch \"$BRANCH\" --event workflow_dispatch --commit \"$SHA\" --limit 5 --json databaseId,createdAt \\\n              --jq \"map(select(.createdAt >= \\\"$start\\\")) | .[0].databaseId // empty\" || true)\"\n            [ -n \"$run\" ] && break\n          done\n          [ -n \"$run\" ] || { echo \"No CI run for $SHA appeared within 2 minutes.\"; exit 1; }\n          echo \"run=$run\" >> \"$GITHUB_OUTPUT\"\n          echo \"url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run\" >> \"$GITHUB_OUTPUT\"\n          gh run watch \"$run\" --exit-status --interval 15 > /dev/null\n\n      - name: Rerun failed CI jobs once\n        id: rerun\n        if: steps.ci.outcome == 'failure' && steps.ci.outputs.run != ''\n        continue-on-error: true\n        timeout-minutes: 25\n        env:\n          RUN: ${{ steps.ci.outputs.run }}\n        run: |\n          status=\"$(gh run view \"$RUN\" --json status --jq .status)\"\n          [ \"$status\" = \"completed\" ] || { echo \"CI run $RUN is $status, not completed; not rerunning.\"; exit 1; }\n          gh run rerun \"$RUN\" --failed\n          for _ in $(seq 12); do\n            sleep 5\n            [ \"$(gh run view \"$RUN\" --json status --jq .status || true)\" != \"completed\" ] && break\n          done\n          gh run watch \"$RUN\" --exit-status --interval 15 > /dev/null\n\n      - name: Auto-merge a clean refresh, or leave it for review\n        env:\n          CODE: ${{ needs.refresh.outputs.code }}\n          REVIEW: ${{ needs.refresh.outputs.review }}\n          CI: ${{ steps.ci.outcome == 'success' || steps.rerun.outcome == 'success' }}\n          CI_URL: ${{ steps.ci.outputs.url }}\n        run: |\n          review() {\n            gh label create needs-review --color d93f0b --description \"Data refresh needs a human look\" --force || true\n            gh pr edit \"$PR\" --add-label needs-review || true\n            gh pr comment \"$PR\" --body \"$1\"\n          }\n          # Held, shrunk, removed or missing picks need a person whatever the exit code; a fetch error (exit 1) must not hide them.\n          if [ \"$(printf '%s' \"${REVIEW:-[]}\" | jq 'length')\" != \"0\" ]; then\n            review \"Not auto-merged: refresh exit code $CODE, and these need review:\n          $(printf '%s' \"$REVIEW\" | jq -r 'map(\"- \" + .) | join(\"\\n\")')\n          CI: $CI_URL\"\n            exit 0\n          fi\n          if [ \"$CODE\" = \"1\" ]; then\n            gh pr comment \"$PR\" --body \"Not auto-merged: refresh exit code 1 (a fetch or run error); the next clean run can merge it. CI: $CI_URL\"\n            exit 0\n          fi\n          if [ \"$CODE\" != \"0\" ] || [ \"$CI\" != \"true\" ]; then\n            review \"Not auto-merged: refresh exit code $CODE (2 = held picks, a changed unclear-match hold, or a shrunk result); CI $([ \"$CI\" = \"true\" ] && echo passed || echo \"failed or didn't start\"): $CI_URL\"\n            exit 0\n          fi\n          # Read at merge time: a label added while CI ran must stop the merge.\n          if ! state=\"$(gh pr view \"$PR\" --json isCrossRepository,headRefName,labels,changedFiles \\\n            --jq '\"\\(.isCrossRepository) \\(.headRefName) \\(any(.labels[]; .name == \"needs-review\")) \\(.changedFiles)\"')\"; then\n            review \"Couldn't read the PR's state; not auto-merging.\"\n            exit 1\n          fi\n          read -r cross head labeled changed <<< \"$state\"\n          [ \"$cross $head\" = \"false $BRANCH\" ] || { echo \"PR #$PR is not this repo's $BRANCH; not merging.\"; exit 1; }\n          [ \"$labeled\" = \"false\" ] || { echo \"PR #$PR is labeled needs-review; not merging.\"; exit 0; }\n          if [ \"$changed\" = \"0\" ]; then\n            gh pr close \"$PR\" --delete-branch --comment \"No net changes against main; closing.\"\n            exit 0\n          fi\n          # A rename lists only its new name in .filename, so both names must be under data/.\n          if ! files=\"$(gh api --paginate \"repos/$GH_REPO/pulls/$PR/files\" --jq '.[] | \"\\(.filename)\\t\\(.previous_filename // \"\")\"')\"; then\n            review \"Couldn't list the PR's files; not auto-merging.\"\n            exit 1\n          fi\n          listed=\"$(printf '%s\\n' \"$files\" | grep -c . || true)\"\n          outside=\"$(printf '%s\\n' \"$files\" | awk -F'\\t' 'NF && ($1 !~ /^data\\// || ($2 != \"\" && $2 !~ /^data\\//))' | grep -c . || true)\"\n          if [ \"$listed\" != \"$changed\" ]; then\n            review \"File count mismatch: the PR changes $changed files but the API lists $listed; not auto-merging.\"\n            exit 1\n          fi\n          if [ \"$outside\" != \"0\" ]; then\n            review \"Touches files outside data/; not auto-merging.\"\n            exit 1\n          fi\n          if ! out=\"$(gh pr merge \"$PR\" --squash --delete-branch --match-head-commit \"$SHA\" 2>&1)\"; then\n            review \"Auto-merge failed: $out\"\n            exit 1\n          fi", "changed": [], "removed": []}, {"id": "cli", "repo": "bb", "path": "scripts/bb.ts", "role": "`bb` CLI: refresh, extract, verify", "startLine": 1, "totalLines": 374, "code": "import { execFileSync } from \"node:child_process\";\nimport { isDeepStrictEqual } from \"node:util\";\nimport fs from \"node:fs\";\nimport path from \"node:path\";\nimport type Anthropic from \"@anthropic-ai/sdk\";\nimport { pacificDay } from \"../src/lib/changelog\";\nimport { loadElection, validateElection, type ElectionData } from \"../src/lib/data\";\nimport { EndorsementFile, type Guide } from \"../src/lib/schema\";\nimport { archiveUrl } from \"../src/pipeline/archive\";\nimport type { Source } from \"../src/pipeline/extract\";\nimport { fetchSource } from \"../src/pipeline/fetch\";\nimport { fetchCheck, formatFetchCheck } from \"../src/pipeline/fetchcheck\";\nimport { makeClient, resolveApiKey } from \"../src/pipeline/key\";\nimport { checkHosts, fetchMode, sourcesFor } from \"../src/pipeline/sources\";\nimport { buildReviewModel, renderReviewHtml } from \"../src/pipeline/review\";\nimport { toYaml } from \"../src/pipeline/write\";\nimport { costOf, exitCodeFor, resultJson, runRefresh, seedPages, summarize, type GuideResult, type RefreshDeps } from \"../src/pipeline/refresh\";\nimport { applyVerdicts, verify } from \"../src/pipeline/verify\";\nimport { badFlag } from \"../src/pipeline/args\";\nimport { guideBallot, newAreaBallot, unknownAreaError } from \"../src/pipeline/scope\";\nimport { parse as parseYaml } from \"yaml\";\n\nconst ROOT = path.join(process.cwd(), \"data\");\nconst ELECTION = process.env.BB_ELECTION ?? \"2026-11\";\nconst USAGE = `usage: npm run bb -- extract <guide...> | --all [--browser] [--archive] [--force] [--force-extract] [--no-verify]\n                                              [--only-areas <area[,area...]>]\n       npm run bb -- refresh [--summary <file.md>] [--result <file.json>] [--shrunk-state <file.json>] [--baseline <data dir>] [--archive]\n                             [--local-only] [--no-extract]\n       npm run bb -- verify <guide...> | --all [--browser]\n       npm run bb -- pages --seed [<guide...>]\n       npm run bb -- fetch-check <guide...> | --all [--browser]   (fetch only; prints what came back, writes nothing)\n       npm run bb -- discover\n       npm run bb -- check\n       npm run bb -- review [--no-open]\n\nextract and refresh fetch each guide's pages and compare them with the stored page text\n(data/<election>/pages). Guides whose pages changed only in dates, banners or other text\nthat names no contest are skipped with no model call; --force-extract re-extracts anyway.\nrefresh checks every guide, extracts at most 20 changed guides, validates, and exits\n0 (clean), 2 (something held or needs review) or 1 (error). Guides marked fetchFrom: local\n(their sites block GitHub's runners) are skipped unless --local-only, which refreshes only\nthem. --no-extract fetches and gates pages but makes no model calls and stores nothing new\nfor changed guides. pages --seed stores today's page text without extracting.\n\nextract rewrites each guide's picks from its pages, overwriting hand edits to picks\n(mark hand-entered guides with 'manual: true' to skip them). --force accepts a result\nthat empties or more than halves the previous picks. Unless --no-verify, extract then\nruns verify on each guide whose picks or quotes changed.\n\nextract --only-areas marin[,contra-costa] is for widening a guide's areas: it always\nextracts, but only the contests those areas add to the guide's ballot, and verifies only\nthe picks that changed there. Every other pick, quote and hold in the file stays as it is.\nEach area must exist and be in the guide's areas, and the guide must have another area; with\n--all, only guides that list them and another area run.\n\nverify has a separate model audit each guide's picks and quotes against its pages.\nUnconfirmed picks move to 'held' (not published) and unconfirmed quotes are dropped;\nthe command exits non-zero when anything is held.`;\n\nconst [cmd, ...args] = process.argv.slice(2);\nconst flag = (f: string) => args.includes(f);\nconst VALUE_OPTIONS = [\"--summary\", \"--result\", \"--shrunk-state\", \"--baseline\", \"--only-areas\"];\nconst option = (name: string) => (args.includes(name) ? args[args.indexOf(name) + 1] : undefined);\nconst positional = () => args.filter((a, i) => !a.startsWith(\"--\") && !VALUE_OPTIONS.includes(args[i - 1]));\nconst REFRESH_BUDGET = 20;\nconst errMsg = (e: unknown) => (e instanceof Error ? e.message : String(e));\nconst today = () => pacificDay();\nconst endorsementPath = (id: string) => path.join(ROOT, ELECTION, \"endorsements\", `${id}.yml`);\n\n\ntype Totals = { guides: number; confirmed: number; held: number; quotes: number; missing: number; tokens: number[] };\nconst totals: Totals = { guides: 0, confirmed: 0, held: 0, quotes: 0, missing: 0, tokens: [0, 0, 0, 0] };\n\nasync function fetchAll(guideId: string, file: EndorsementFile): Promise<Source[]> {\n  const browser = fetchMode(file, flag(\"--browser\")) === \"browser\";\n  const sources: Source[] = [];\n  for (const url of sourcesFor(file)) {\n    const fetched = await fetchSource(url, { browser });\n    if (fetched.kind === \"pdf\" && fetched.text.trim() === \"\") {\n      console.warn(`${guideId}: warning: no text extracted from PDF ${url}; quotes from it will drop`);\n    }\n    sources.push({ url, fetched });\n  }\n  return sources;\n}\n\nasync function verifyAndWrite(client: Anthropic, data: ElectionData, guide: Guide, file: EndorsementFile, sources: Source[]): Promise<void> {\n  const { output, usage } = await verify(client, guideBallot(data.ballot, guide, data.areas), guide, file, sources);\n  const applied = applyVerdicts(file, output);\n  // Held contests are asked about only when the verifier sees them, so it may report an unclear-match hold as missing.\n  const isHeld = new Set((applied.file.held ?? []).map((h) => h.contestId));\n  const r = { ...applied, missing: applied.missing.filter((m) => !isHeld.has(m.contestId)) };\n  const path_ = endorsementPath(guide.id);\n  if (!isDeepStrictEqual(r.file, file)) fs.writeFileSync(path_, toYaml(EndorsementFile.parse(r.file), { previous: fs.readFileSync(path_, \"utf8\") }));\n\n  const u = [usage.cache_read_input_tokens ?? 0, usage.cache_creation_input_tokens ?? 0, usage.input_tokens, usage.output_tokens];\n  totals.guides++;\n  totals.confirmed += r.confirmed;\n  totals.held += r.held.length;\n  totals.quotes += r.droppedQuotes.length;\n  totals.missing += r.missing.length;\n  u.forEach((n, i) => (totals.tokens[i] += n));\n  if (r.held.length) process.exitCode = 1;\n\n  console.log(\n    `${guide.id}: verify ${r.confirmed} confirmed, ${r.held.length} held, ${r.droppedQuotes.length} quotes dropped, ${r.missing.length} missing  (cache_read=${u[0]} cache_write=${u[1]} in=${u[2]} out=${u[3]})`,\n  );\n  for (const h of r.held) console.log(`  !! HELD ${h.contestId}: ${Array.isArray(h.pick) ? h.pick.join(\" / \") : h.pick} \u2014 ${h.reason}: ${h.evidence}`);\n  for (const d of r.droppedQuotes) console.log(`  ! ${d.contestId}: dropped quote (${d.reason}): \"${d.text.slice(0, 100)}\" \u2014 ${d.evidence}`);\n  for (const m of r.missing) console.log(`  ? missing ${m.contestId}: ${m.pick} \u2014 ${m.evidence}`);\n  for (const n of r.notes) console.log(`  ! ${n}`);\n}\n\nfunction printVerifyTotals(): void {\n  if (totals.guides === 0) return;\n  const [cr, cw, i, o] = totals.tokens;\n  console.log(\n    `\\nVerified ${totals.guides} guide(s): ${totals.confirmed} picks confirmed, ${totals.held} held, ${totals.quotes} quotes dropped, ${totals.missing} missing reported (tokens: cache_read=${cr} cache_write=${cw} in=${i} out=${o})`,\n  );\n  if (totals.held) console.log(\"Held picks are not published; see 'held:' in the endorsement files.\");\n}\n\nasync function runVerify(): Promise<void> {\n  const data = loadElection(ROOT, ELECTION);\n  const ids = flag(\"--all\") ? Object.keys(data.endorsements).sort() : positional();\n  if (ids.length === 0) {\n    console.log(USAGE);\n    process.exitCode = 1;\n    return;\n  }\n  const client = makeClient(resolveApiKey(\".env.local\"));\n  for (const id of ids) {\n    try {\n      const guide = data.guides.find((g) => g.id === id);\n      const file = data.endorsements[id];\n      if (!guide || !file) throw new Error(`no guide or endorsement file for '${id}'`);\n      if (file.manual) {\n        console.log(`${id}: skipped (manual)`);\n        continue;\n      }\n      if (sourcesFor(file).length === 0 || Object.keys(file.picks).length + (file.held ?? []).filter((h) => h.reason !== \"unclear-match\").length === 0) {\n        console.log(`${id}: skipped (no source or no picks)`);\n        continue;\n      }\n      await verifyAndWrite(client, data, guide, file, await fetchAll(id, file));\n    } catch (e) {\n      console.error(`${id}: FAILED \u2014 ${errMsg(e)}`);\n      process.exitCode = 1;\n    }\n  }\n  printVerifyTotals();\n  console.log(\"\\nReview with: git diff data/\");\n}\n\nconst NO_MODEL = {\n  messages: { stream: () => { throw new Error(\"no model calls in this mode\"); } },\n} as unknown as RefreshDeps[\"client\"];\n\nfunction refreshDeps({ model = true }: { model?: boolean } = {}): RefreshDeps {\n  return {\n    client: model ? makeClient(resolveApiKey(\".env.local\")) : NO_MODEL,\n    fetchSource,\n    archiveUrl: (url) => archiveUrl(url),\n    today,\n    log: (line) => console.log(line),\n  };\n}\n\nfunction totalsLine(results: GuideResult[]): string {\n  const n = (s: GuideResult[\"status\"]) => results.filter((r) => r.status === s).length;\n  return `${results.length} checked: ${n(\"unchanged\")} unchanged, ${n(\"changed\")} re-extracted, ${n(\"would-extract\") ? `${n(\"would-extract\")} would extract (dry run), ` : \"\"}${n(\"deferred\")} deferred, ${n(\"skipped\")} skipped, ${n(\"failed\") + n(\  browser: flag(\"--browser\"), archive: flag(\"--archive\"), force: flag(\"--force\"),\n    forceExtract: flag(\"--force-extract\"), verify: !flag(\"--no-verify\"), onlyAreas,\n  });\n  console.log(`\\n${totalsLine(results)}\\nReview with: git diff data/`);\n  process.exitCode = exitCodeFor(results);\n}\n\nasync function runRefreshCmd(): Promise<void> {\n  const gateOnly = flag(\"--no-extract\");\n  const results = await runRefresh(refreshDeps({ model: !gateOnly }), {\n    root: ROOT, election: ELECTION,\n    browser: flag(\"--browser\"), archive: flag(\"--archive\"), maxChanged: REFRESH_BUDGET,\n    shrunkSkip: readShrunkState(option(\"--shrunk-state\")),\n    baseline: option(\"--baseline\"),\n    scope: flag(\"--local-only\") ? \"local\" : \"cloud\",\n    gateOnly,\n  });\n  const { errors } = validateElection(loadElection(ROOT, ELECTION));\n  let md = summarize(results, { date: today(), dryRun: gateOnly });\n  if (errors.length) md += `\\n## Validation errors\\n\\n${errors.map((e) => `- ${e}`).join(\"\\n\")}\\n`;\n  const code = errors.length ? 1 : exitCodeFor(results);\n  const summaryPath = option(\"--summary\");\n  if (summaryPath) fs.writeFileSync(summaryPath, md);\n  const resultPath = option(\"--result\");\n  if (resultPath) fs.writeFileSync(resultPath, JSON.stringify(resultJson(results, code), null, 2));\n  console.log(`\\n${totalsLine(results)}`);\n  errors.forEach((e) => console.error(`ERROR ${e}`));\n  process.exitCode = code;\n}\n\nfunction readShrunkState(file: string | undefined): Record<string, string> | undefined {\n  if (!file || !fs.existsSync(file)) return undefined;\n  try {\n    const parsed: unknown = JSON.parse(fs.readFileSync(file, \"utf8\"));\n    if (!parsed || typeof parsed !== \"object\") return undefined;\n    return Object.fromEntries(Object.entries(parsed).filter((e): e is [string, string] => typeof e[1] === \"string\"));\n  } catch {\n    return undefined;\n  }\n}\n\nasync function runPages(): Promise<void> {\n  if (!flag(\"--seed\")) {\n    console.log(USAGE);\n    process.exitCode = 1;\n    return;\n  }\n  const deps: RefreshDeps = { client: NO_MODEL, fetchSource, today, log: (l) => console.log(l) };\n  const out = await seedPages(deps, { root: ROOT, election: ELECTION, browser: flag(\"--browser\"), ids: positional().length ? positional() : undefined });\n  const failed = out.filter((o) => o.error);\n  console.log(`\\nStored pages for ${out.length - failed.length} guide(s); ${failed.length} failed.`);\n  if (failed.length) process.exitCode = 1;\n}\n\nfunction runDiscover(): void {\n  const data = loadElection(ROOT, ELECTION);\n  for (const g of data.guides) {\n    const e = data.endorsements[g.id];\n    if (e?.source) continue;\n    console.log(`${g.id}: no ${ELECTION} source. Start from ${g.previousElectionLink ?? g.homepage}`);\n    if (!e) {\n      const stub: EndorsementFile = {\n        guide: g.id, election: ELECTION, status: \"pending\", fetchedAt: today(), hasReasoning: false, picks: {},\n      };\n      fs.writeFileSync(endorsementPath(g.id), toYaml(stub));\n      console.log(`  created ${path.relative(process.cwd(), endorsementPath(g.id))}`);\n    }\n  }\n}\n\nfunction runCheck(): void {\n  const data = loadElection(ROOT, ELECTION);\n  const { errors, warnings } = validateElection(data);\n  const hostProblems = data.guides.flatMap((g) => {\n    const e = data.endorsements[g.id];\n    return e ? checkHosts(g, e).map((p) => `${g.id}: ${p}`) : [];\n  });\n  const manual = data.guides.filter((g) => data.endorsements[g.id]?.manual).map((g) => g.id);\n  const noSource = data.guides.filter((g) => !data.endorsements[g.id]?.source).map((g) => g.id);\n  console.log(`INFO  manual (${manual.length}): ${manual.join(\", \") || \"none\"}`);\n  console.log(`INFO  no source (${noSource.length}): ${noSource.join(\", \") || \"none\"}`);\n  warnings.forEach((w) => console.warn(`WARN  ${w}`));\n  [...errors, ...hostProblems].forEach((e) => console.error(`ERROR ${e}`));\n  if (errors.length > 0 || host ", \")}` };\n  const hostProblems = checkHosts(guide, prev);\n  if (hostProblems.length) return { id, status: \"skipped\", reason: `source host check: ${hostProblems.join(\"; \")}` };\n\n  const browser = fetchMode(prev, Boolean(opts.browser)) === \"browser\";\n  const pages: Fetchedpage[] = [];\n  for (const url of urls) {\n    const fetched = await deps.fetchSource(url, { browser });\n    const p = pagePath(opts.root, opts.election, id, url);\n    const stored = storedText(fetched, { ballot });\n    const old = readStored(p);\n    const outsideWarning = outside ? changedOutside(url, old, stored, outside, guide.areas, opts.onlyAreas ?? []) : undefined;\n    pages.push({ source: { url, fetched }, stored, path: p, gate: pageGate(old, stored, ballot), outsideWarning });\n  }\n\n  const relevant = forceExtract || pages.some((p) => p.gate === \"new\" || p.gate === \"relevant\");\n  if (!relevant) {\n    // Store the drift (dates, banners) so it never accumulates into a later diff.\n    for (const p of pages) writeStored(p.path, p.stored);\n    return { id, status: \"unchanged\" };\n  }\n  const pageHash = createHash(\"sha256\").update(pages.map((p) => `${p.source.url}\\n${p.stored}`).join(\"\\n\\0\\n\")).digest(\"hex\");\n  if (!forceExtract && opts.shrunkSkip?.[id] === pageHash) return { id, status: \"shrunk-skipped\", pageHash };\n  if (opts.gateOnly) return { id, status: \"would-extract\" };\n  if (budget.left <= 0) return { id, status: \"deferred\" };\n  budget.left--;\n\n  const sources = pages.map((p) => p.source);\n  const { output, usage } = await extract(deps.client, ballot, guide, sources);\n  const entries = toEntries(output, ballot.contests, pagesFor(sources), { ownNames: [guide.name] });\n  const picks = Object.fromEntries(Object.entries(entries.picks).filter(([c]) => inScope(c)));\n  const outOfScope = new Set(ballot.contests.filter((c) => !inScope(c.id)).map((c) => c.id));\n  const notes = entries.notes.filter((n) => !outOfScope.has(n.split(\":\")[0]));\n  const prevInScope = Object.fromEntries(Object.entries(prev.picks).filter(([c]) => inScope(c)));\n  const shrunk = shrinkWarning(id, prevInScope, picks, { force: opts.force });\n  if (shrunk) return { id, status: \"shrunk\", message: shrunk.trim(), notes, pageHash, usage };\n\n  let archived: ArchivedSource[] | undefined;\n  if (opts.archive && deps.archiveUrl) {\n    const snaps: ArchivedSource[] = [];\n    for (const url of urls) {\n      const snapshot = await deps.archiveUrl(url);\n      if (snapshot) snaps.push({ source: url, snapshot });\n      else log(`${id}: warning: could not archive ${url}`);\n    }\n    if (snaps.length) archived = snaps;\n  }\n\n  const unclear = (prev.held ?? []).flatMap((h) => {\n    if (h.reason !== \"unclear-match\" || !inScope(h.contestId)) return [];\n    const now = picks[h.contestId];\n    if (!now) return [`${h.contestId}: held ${showPick(h.pick)}, guide no longer picks this contest`];\n    return isDeepStrictEqual(now.pick, h.pick) ? [] : [`${h.contestId}: held ${showPick(h.pick)}, guide now picks ${showPick(now.pick)}`];\n  });\n  let next = EndorsementFile.parse(\n    scoped ? scopedNextFile(prev, picks, inScope, deps.today(), archived) : nextFile(prev, picks, output.hasReasoning, deps.today(), archived),\n  );\n  const result: Extract<GuideResult, { status: \"changed\" }> = {\n    id,\n    status: \"changed\",\n    dataChanged: false,\n    diff: diffPicks(prev.picks, next.picks),\n    notes,\n    held: [],\n    ...(unclear.length ? { unclear } : {}),\n    droppedByVerifier: 0,\n    missing: [],\n    usage: { extract: usage },\n    warnings: pages.flatMap((p) => (p.outsideWarning ? [p.outsideWarning] : [])),\n  };\n\n  const hasHeld = (next.held ?? []).some((h) => h.reason !== \"unclear-match\" && inScope(h.contestId));\n  const changedIds = Object.keys(next.picks).filter((c) => inScope(c) && !isDeepStrictEqual(prev.picks[c], next.picks[c]));\n  const picksChanged = scoped ? changedIds.length > 0 : !isDeepStrictEqual(prev.picks, next.picks) && Object.keys(next.picks).length > 0;\n  if (opts.verify !== false && (picksChanged || hasHeld)) {\n    const audited = scoped ? auditPart(next, changedIds, inScope) : next;\n    const v = await verify(deps.client, ballot, guide, audited, sources);\n    const applied = applyVerdicts(audited, v.output);\n    next = EndorsementFile.parse(scoped ? withAudited(next, applied.file, changedIds, inScope) : applied.file);\n    result.held = applied.held;\n    result.droppedByVerifier = applied.droppedQuotes.length;\n    const picked = (c: string) => c in next.picks || (next.held ?? []).some((h) => h.contestId === c);\n    result.missing = applied.missing.filter((m) => inScope(m.contestId) && !picked(m.contestId));\n    result.notes = [\n      ...notes,\n      ...applied.droppedQuotes.map((d) => `${d.contestId}: verifier dropped quote (${d.reason}): \"${d.text.slice(0, 80)}\"`),\n      ...applied.notes,\n    ];\n    result.usage.verify = v.usage;\n    result.diff = diffPicks(prev.picks, next.picks);\n  }\n\n  if (scoped && !Object.keys(next.picks).some(inScope) && !(next.held ?? []).some((h) => inScope(h.contestId))) {\n    result.warnings?.push(`no endorsements found for ${opts.onlyAreas?.join(\", \")}`);\n  }\n  result.dataChanged = !sameFile(prev, next);\n  if (result.dataChanged) {\n    const file = path.join(opts.root, opts.election, \"endorsements\", `${id}.yml`);\n    fs.writeFileSync(file, toYaml(next, { previous: fs.readFileSync(file, \"utf8\") }));\n  }\n  for (const p of pages) if (!p.outsideWarning) writeStored(p.path, p.stored);\n  return result;\n}\n\nexport async function runRefresh(deps: RefreshDeps, opts: RefreshOptions): Promise<GuideResult[]> {\n  const baseline = opts.baseline ? loadBaseline(opts.baseline, opts.election) : null;\n  const log = deps.log ?? (() => {});\n  const data = loadElection(opts.root, opts.election);\n  const ids = (opts.ids ?? Object.keys(data.endorsements).sort()).filter(\n    (id) => opts.scope !== \"local\" || data.endorsements[id]?.fetchFrom === \"local\",\n  );\n  const budget = { left: opts.maxChanged ?? Infinity };\n  const unknown = opts.onlyAreas && unknownAreaError(data.areas, opts.onlyAreas);\n  if (unknown) throw new Error(unknown);\n  const results: GuideResult[] = [];\n  for (const id of ids) {\n    const guide = data.guides.find((g) => g.id === id);\n    let r: GuideResult;\n    if (!guide || !data.endorsements[id]) r = { id, status: \"failed\", error: `no guide or endorsement file for '${id}'` };\n    else {\n      try {\n        r = await refreshGuide(deps, opts, data, guide, budget);\n      } catch (e) {\n        r = { id, status: \"failed\", error: errMsg(e) };\n      }\n    }\n    log(describe(r));\n    results.push(r);\n  }\n  if (baseline) writeChangelog(deps, opts, baseline, results);\n  return results;\n}\n\ntype Baseline = { data: ElectionData; keep: Set<string> };\n\nfunction loadBaseline(dir: string, election: string): Baseline {\n  if (!fs.existsSync(path.join(dir, election))) throw new Error(`baseline ${dir} has no ${election}/ data`);\n  const changelog = path.join(dir, \"changelog\");\n  return { data: loadElection(dir, election), keep: new Set(fs.existsSync(changelog) ? fs.readdirSync(changelog) : []) };\n}\n\nfunction writeChangelog(deps: RefreshDeps, opts: RefreshOptions, main: Baseline, results: GuideResult[]): void {\n  const changed = results.filter((r) => r.status === \"changed\" && r.dataChanged).map((r) => r.id);\n  if (changed.length === 0) return;\n  const after = loadElection(opts.root, opts.election);\n  const dir = path.join(opts.root, \"changelog\");\n  for (const id of changed) {\n    const guide = after.guides.find((g) => g.id === id);\n    const before = main.data.endorsements[id];\n    if (!guide || !before) continue;\n    const entry = guideChangelogEntry({ guideName: guide.name, before, after: after.endorsements[id], contests: after.ballot.contests, date: deps.today() });\n    writeRefreshEntry(dir, id, entry, { date: deps.t ) + usageCost(r.usage.verify, RATES.verify)\n        : r.status === \"shrunk\"\n          ? sum + usageCost(r.usage, RATES.extract)\n          : sum,\n    0,\n  );\n}\n\nexport function exitCodeFor(results: GuideResult[]): 0 | 1 | 2 {\n  if (results.some((r) => r.status === \"failed\")) return 1;\n  if (results.some((r) => r.status === \"shrunk\" || r.status === \"shrunk-skipped\" || (r.status === \"changed\" && (r.held.length > 0 || !!r.unclear?.length)))) return 2;\n  return 0;\n}\n\nexport function summarize(results: GuideResult[], { date, dryRun = false }: { date: string; dryRun?: boolean }): string {\n  const by = (s: GuideResult[\"status\"]) => results.filter((r) => r.status === s);\n  const changed = by(\"changed\") as Extract<GuideResult, { status: \"changed\" }>[];\n  const held = changed.reduce((n, r) => n + r.held.length, 0);\n  const unclear = changed.reduce((n, r) => n + (r.unclear?.length ?? 0), 0);\n  const code = exitCodeFor(results);\n  const would = by(\"would-extract\").length;\n  const isDryRun = dryRun || would > 0;\n  const verdict =", "changed": [], "removed": []}, {"id": "fetch", "repo": "bb", "path": "src/pipeline/fetch.ts", "role": "Fetch HTML, PDF, or browser", "startLine": 1, "totalLines": 217, "code": "import { execFileSync } from \"node:child_process\";\nimport * as cheerio from \"cheerio\";\n\nexport type Fetched = { kind: \"text\"; text: string } | { kind: \"pdf\"; base64: string; text: string };\n\nconst BLOCKS = \"p, div, li, ul, ol, h1, h2, h3, h4, h5, h6, tr, table, section, article, header, main, aside, blockquote, pre, dl, dt, dd, figure, figcaption, form, fieldset, summary, details\";\n\n/** Keeps the page's words verbatim: extracted quotes are verified against this text. */\nexport function htmlToText(html: string): string {\n  const $ = cheerio.load(html);\n  $(\"script, style, noscript, template, nav, footer, svg, iframe, head\").remove();\n\n  $(\"body *\")\n    .addBack(\"body\")\n    .contents()\n    .each((_, node) => {\ cess denied\\s*$|you don'?t have permission to access .* on this server/im],\n  [\"bot check\", /verify(?:ing)? (?:that )?you are (?:a )?human|are you a robot\\?/i],\n];\n// Not /cdn-cgi/challenge-platform/scripts/jsd/main.js: real Cloudflare sites load it on every page.\nconst BLOCK_MARKUP: [string, RegExp][] = [\n  [\"cloudflare challenge\", /id=[\"']challenge-form[\"']|window\\._cf_chl_opt|\\/cdn-cgi\\/challenge-platform\\/h\\//],\n  [\"perimeterx\", /px-captcha/],\n  [\"datadome\", /captcha-delivery\\.com/],\n];\nconst MAX_BLOCK_PAGE_TEXT = 1500;\n\nfunction visibleText(html: string): { title: string; text: string } {\n  const $ = cheerio.load(html);\n  const title = $(\"title\").first().text().trim();\n  $(\"script, style, noscript, template\").remove();\n  return { title, text: $(\"body\").text().replace(/\\s+/g, \" \").trim() };\n}\n\nexport function detectBlock(html: string): string | null {\n  const { title, text } = visibleText(html);\n  const short = text.length <= MAX_BLOCK_PAGE_TEXT;\n  // Match only the <title> or a short page's text: a real page can say \"access denied\" in passing.\n  for (const [name, re] of BLOCK_SIGNS) if (re.test(title) || (short && re.test(text))) return name;\n  if (short) for (const [name, re] of BLOCK_MARKUP) if (re.test(html)) return name;\n  return null;\n}\n\n// Not page.goto's status: a challenge that solves itself navigates again.\nexport function finalStatus(responses: { status: number; mainFrameNavigation: boolean }[], fallback: number): number {\n  return responses.filter((r) => r.mainFrameNavigation).at(-1)?.status ?? fallback;\n}\n\nexport async function contentAfterNavigation(content: () => Promise<string>, settle: () => Promise<void>): Promise<string> {\n  try {\n    return await content();\n  } catch (e) {\n    if (!/execution context was destroyed|navigating/i.test(errMsg(e))) throw e;\n    await settle();\n    return content();\n  }\n}\n\nexport type FetchAttempt = { via: \"http\" | \"browser\"; status: number; Page) {\n      throw new Error(httpFailure ? `${httpFailure} (browser: HTTP ${r.status})` : `${url} -> HTTP ${r.status}`);\n    }\n    if (blocked) throw new Error(`${url}: blocked (${blocked})${httpFailure ? \" over http and browser\" : \"\"}`);\n    return { kind: \"text\", text: htmlToText(r.html) };\n  };\n\n  if (opts.browser && !isPdfPath(url)) return viaBrowser(null);\n\n  const r = await fetchHttp(url);\n  if (r.kind === \"error\") {\n    report({ via: \"http\", status: r.status, bytes: r.bytes, blocked: null });\n    const failure = `${url} -> HTTP ${r.status}`;\n    if (!RETRY_IN_BROWSER.has(r.status) || isPdfPath(url)) throw new Error(failure);\n    return viaBrowser(failure, r.status);\n  }\n  const blocked = r.html ? detectBlock(r.html) : null;\n  report({ via: \"http\", status: r.status, bytes: r.bytes, blocked });\n  if (!blocked) return r.fetched;\n  return viaBrowser(`${url}: blocked (${blocked})`);\n}", "changed": [], "removed": []}, {"id": "store", "repo": "bb", "path": "src/pipeline/pagestore.ts", "role": "Stored text and the page gate", "startLine": 1, "totalLines": 208, "code": "import { createHash } from \"node:crypto\";\nimport type { Ballot } from \"@/lib/schema\";\nimport type { Aliases } from \"@/lib/names\";\nimport type { Fetched } from \"./fetch\";\nimport { contestMarkerSet, lowerWords, needleOf, type Matcher } from \"./placement\";\n\nconst MONTHS =\n  \"jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?\";\nconst WEEKDAYS = \"mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?\";\nconst DATE_PATTERNS = [\n  new RegExp(`\\\\b(?:${WEEKDAYS})\\\\.?,?(?=\\\\s)`, \"gi\"),\n  new RegExp(`\\\\b(?:${MONTHS})\\\\.?\\\\s+\\\\d{1,2}(?:st|nd|rd|th)?(?:,?\\\\s+\\\\d{4})?\\\\b`, \"gi\"), // Oct. 5, 2026\n  new RegExp(`\\\\b\\\\d{1,2}(?:st|nd|rd|th)?\\\\s+(?:${MONTHS})\\\\.?(?:,?\\\\s+\\\\d{4})?\\\\b`, \"g "id": "extract", "repo": "bb", "path": "src/pipeline/extract.ts", "role": "Extract call (Sonnet)", "startLine": 1, "totalLines": 255, "code": "import type Anthropic from \"@anthropic-ai/sdk\";\nimport { z } from \"zod\";\nimport type { Ballot, Contest, Entry, Guide } from \"@/lib/schema\";\nimport { matchName, type Aliases } from \"@/lib/names\";\nimport type { Fetched } from \"./fetch\";\nimport { misplacedUnder } from \"./placement\";\nimport { standsAlone, verifyQuotes, type Page } from \"./quotes\";\n\nexport const ExtractOutput = z.object({\n  hasReasoning: z\n    .boolean()\n    .describe(\"true if the organization explains its picks anywhere on these pages; false if it only lists them\"),\n  picks: z.array(\n    z.object({\n      contestId: z.string(),\n      vote: z.enum([\"Y\", \"N\"]).nullable().describe(\"for measure and retention contests; null for candidate races\"),\n      candidates: z\n        .array(z.string())\n        .describe(\"endorsed candidate names, in rank order if ranked; empty for measures\"),\n      ranked: z.boolean(),\n      // Not z.int(): structured outputs reject the integer bounds it emits.\n      rankedCount: z\n        .number()\n        .nullable()\n        .describe(\"when only the first N listed names are ranked and the rest are unranked co-endorsements, N; otherwise null\"),\n      quotes: z\n        .array(z.string())\n        .describe(\n          \"up to 3 complete sentences copied exactly from the pages, in the organization's own voice, explaining this pick; empty if none\",\n        ),\n      note: z\n        .string()\n        .nullable()\n        .describe(\"use only when the position is unclear or partial; otherwise null\"),\n    }),\n  ),\n});\nexport type ExtractOutput = z.infer<typeof ExtractOutput>;\n\n/** Not the SDK's zodOutputFormat: it folds `enum` into the description, leaving `vote` unconstrained. */\nfunction outputFormat(): Anthropic.Messages.JSONOutputFormat {\n  const schema: Record<string, unknown> = { ...z.toJSONSchema(ExtractOutput) };\n  delete schema.$schema;\n  return { type: \"json_schema\", schema };\n}\n\nexport type Source = { url: string; fetched: Fetched };\nexport type ExtractClient = { messages: Pick<Anthropic[\"messages\"], \"stream\"> };\n\nexport const MODEL = \"claude-sonnet-5-5\";\nconst MAX_TOKENS = 64000;\nconst MAX_QUOTES = 3;\nconst NOTE_QUOTE_CHARS = 80;\n\n/** No clock or per-guide text: the prompt must stay byte-identical across guides with the same areas to hit the cache. */\nexport function systemPrompt(ballot: Ballot): string {\n  const contests = ballot.contests.map((c) => ({\n    id: c.id,\n    title: c.title,\n    kind: c.kind,\n    candidates: c.candidates,\n    seats: c.seats,\n    rankedChoice: c.rankedChoice,\n  }));\n  return [\n    `You extract one organization's voter-guide endorsements for the ${ballot.title} on ${ballot.date}.`,\n    `The pages may list endorsements for several elections. Extract only endorsements for the ${ballot.title} on ${ballot.date}; ignore every other election.`,\n    \"Extract only this organization's own endorsements; ignore endorsements the pages attribute to other organizations.\",\n    \"\",\n    \"Rules:\",\n    \"- Return one pick per contest the organization takes a position on. Use the contestId values from the ballot below exactly.\",\n    \"- Copy candidate names exactly as printed on the page; they are matched to the ballot downstream.\",\n    '- Skip contests the organization does not mention, and contests where it takes no position, is \"neutral\", or says \"no recommendation\" or \"no endorsement\".',\n    '- A candidate labelled \"Open Endorsement\" (or \"Open\" in a column of endorsement statuses) is not endorsed: leave that candidate out, and skip the contest if no one else in it is endorsed (\"X \u2014 Sole Endorsement, Y \u2014 Open Endorsement\" is a pick of X alone). An \"open seat\" (a vacancy) does not affect the pick.',\n    \"- Measure and retention contests: set vote to Y or ization's own voice. Never quote text it attributes to opponents, critics, candidates or anyone else.\",\n    \"- Never paraphrase, summarize, shorten or combine sentences.\",\n    \"- At most 3 quotes per pick. If the pages give no reasons for a pick, return an empty quotes array.\",\n    \"\",\n    \"Ballot contests (JSON):\",\n    JSON.stringify(contests),\n  ].join(\"\\n\");\n}\n\nexport function pagesFor(sources: Source[]): Page[] {\n  return sources.map(({ url, fetched }) =>\n    fetched.kind === \"pdf\" ? { url, text: fetched.text, kind: \"pdf\" } : { url, text: fetched.text, kind: \"html\" },\n  );\n}\n\nfunction candidateNames(id: string, raw: string[], official: string[], aliases: Aliases, notes: string[]): string[] | null {\n  const matches = raw.map((name) => ({ name, m: matchName(name, official, aliases) }));\n  const unknown = matches.find(({ m }) => !m);\n  if (unknown) {\n    notes.push(`${id}: PICK DROPPED \u2014 unknown candidate '${unknown.name}' (would change the pick's meaning)`);\n    return null;\n  }\n  const names: string[] = [];\n  for (const { name, m } of matches) {\n    if (!m) continue;\n    if (m.fuzzy) notes.push(`${id}: '${name}' -> '${m.name}'`);\n    if (!names.includes(m.name)) names.push(m.name);\n  }\n  return names;\n}\n\nconst clip = (q: string) => (q.length > NOTE_QUOTE_CHARS ? `${q.slice(0, NOTE_QUOTE_CHARS)}\u2026` : q);\n\nexport function toEntries(\n  out: ExtractOutput,\n  contests: Contest[],\n  pages: Page[],\n  { ownNames = [] }: { ownNames?: string[] } = {},\n): { picks: Record<string, Entry>; notes: string[] } {\n  const byId = new Map(contests.map((c) => [c.id, c]));\n  const picks: Record<string, Entry> = {};\n  const notes: string[] = [];\n\n  for (const p of out.picks) {\n    const note = p.note?.trim();\n    if (note) notes.push(`${p.contestId}: model note: ${note}`);\n    const c = byId.get(p.contestId);\n    if (!c) {\n      notes.push(`unknown contest ${p.contestId}`);\n      continue;\n    }\n    if (c.id i  .map((c) => {\n      const extra = c.kind === \"candidate\" ? ` \u2014 candidates: ${c.candidates.join(\"; \")}${c.rankedChoice ? \" (ranked-choice)\" : \"\"}` : \"\";\n      return `- ${c.id}: ${c.title} [${c.kind}]${extra}`;\n    })\n    .join(\"\\n\");\n  return [\n    \"You are auditing someone else's extraction of one organization's voter-guide endorsements.\",\n    `The election is the ${ballot.title} on ${ballot.date}. For each pick and quote, say whether the organization's pages support it.`,\n    \"Judge only from the pages provided. Do not add, fix or re-extract anything; report what is wrong.\",\n    \"\",\n    \"Picks: give exactly one verdict per pick listed in the extraction.\",\n    \"- confirmed: the pages show this organization taking this position in this contest for this election.\",\n    \"- wrong-pick: the pages show a different position (other candidates, the opposite vote, or no position or neutral). A candidate labelled \\\"Open Endorsement\\\" (or \\\"Open\\\" in a column of endorsement statuses) is not endorsed; an \\\"open seat\\\" (a vacancy) says nothing about the pick.\",\n    \"- wrong-rank: the names are right but the ranking is not (ranked when the page gives no order, unranked when it ranks them, a different order, or rankedCount wrong when only some names are ranked).\",\n    \"- not-found: the pages do not mention this organization's position in this contest at all.\",\n    \"- old-election: the position on the page is for a different election (an earlier primary or special election).\",\n    \"A Y on a measure means the organization supports it; N means it opposes it. A candidate pick lists the endorsed names; ranked means the page gives a rank order.\",\n    \"\",\n    \"Quotes: give exactly one verdict per quote, identified by contestId and its number.\",\n    \"- confirmed: the sentence appears on the pages, sits in this contest's section, is the organization's own words, and gives a reason for the pick that makes sense on its own.\",\n    \"- not-found: the sentence is not on the pages word for word.\",\n    \"- wrong-contest: the sentence is about a different contest than the pick it is attached to.\",\n    \"- not-own-words: the sentence is someone else's words (opponents, candidates, news coverage, another organization).\",\n    \"- not-substantive: it gives no reason (an announcement, slogan, call to vote, thanks, or background).\",\n    \"- not-standalone: shown alone it is unclear or misleading, e.g. it starts with This/It/He and depends on an earlier sentence, or reads as an argument for the other side.\",\n    \"- old-election: the sentence is about a different election.\",\n    'A quote is always shown under its contest and pick. \"It\" or \"This measure\" referring to that contest\\'s measure, and \"He\" or \"She\" when the pick names a single candidate, are not not-standalone.',\n    \"For a pick that names several candidates, a quote starting with He/She/His/Her is standalone only if the same quote names one of the endorsed candidates.\",\n    \"Mark not-substantive only when the sentence gives no reason at all; a fact cited as a reason for the position counts as a reason.\",\n    \"\",\n    \"Missing: list positions the pages clearly state for contests on this ballot that the extraction has no pick for. Report only clear positions, not neutral ones.\",\n    \"\",\n    \"Evidence: quote the few words of page text that decided each verdict.\",\n    \"\",\n    \"Ballot contests:\",\n    contests,\n  ].join(\"\\n\");\n}\n\nfunction auditText(guide: Guide, file: EndorsementFile): string {\n  const describe = (contestId: string, e: Entry, held: boolean) => ({\n    contestId,\n    pick: e.pick,\n    ...(Array.isArray(e.pick) ? { ranked: e.ranked, ...(e.rankedCount ? { rankedCount: e.rankedCount } : {}) } : {}),\n    ...(held ? { held: true } : {}),\n    quotes: e.quotes.map((q, i) => ({ index: i + 1, text: q.text, page: q.source })),\n  });\n  const picks = [\n    ...Object.entries(file.picks).map(([contestId, e]) => describe(contestId, e, false)),\n    ...(file.held ?? []).filter((h) => h.reason !== \"unclear-match\").map((h) => describe(h.contestId, heldEntry(h), true)),\n  ];\n  return [\n    `Organization: ${guide.name} (${guide.homepage})`,\n    \"Extraction to audit (JSON, one object per pick):\",\n    ...picks.map((p) => JSON.stringify(p)),\n  ].join(\"\\n\");\n}\n\nfunction parseOutput(text: string): VerifyOutput {\n  let json: unknown;\n  try {\n    json = JSON.parse(text);\n  } catch (e) {\n    throw new Error(`verifier output did not match the schema: invalid JSON (${e instanceof Error ? e.message : String(e)})`);\n  }\n  const r = VerifyOutput.safeParse(json);\n  if (!r.success) {\n    const issue = r.error.issues[0];\n    throw new Error(`verifier output did not match the schema: ${issue.path.join(\".\") || \"(root)\"}: ${issue.message}`);\n  }\n  return r.data;\n}\n\nexport async function verify(\n  client: ExtractClient,\n  ballot: Ballot,\n  guide: Guide,\n  file: EndorsementFile,\n  sources: Source[],\n): Promise<{ output: VerifyOutput; usage: Anthropic.Messages.Usage }> {\n  const res = await client.messages\n    .stream({\n      model: VERIFY_MODEL,\n      max_tokens: MAX_TOKENS,\n      system: [{ type: \"text\", text: verifierPrompt(ballot), cache_control: { type: \"ephemeral\" } }],\n      messages: [{ role: \"user\", content: [...pageBlocks(sources), { type: \"text\", text: auditText(guide, file) }] }],\n      output_config: { effort: \"high\", format: outputFormat() },\n    })\n    .finalMessage();\n  if (res.stop_reason === \"refusal\") throw new Error(`refused (category: ${res.stop_details?.category ?? \"none\"})`);\n  if (res.stop_reason === \"max_tokens\") throw new Error(\"verifier output hit max_tokens before finishing\");\n  const text = res.content.flatMap((b) => (b.type === \"text\" ? [b.text] : [])).join(\"\");\n  return { output: parseOutput(text), usage: res.usage };\n}\n\nfunction heldEntry(h: HeldPick): e?: string | null; inline?: string | null };\n\nfunction topLevelComments(previous: string): Map<string, Comments> {\n  const out = new Map<string, Comments>();\n  const doc = parseDocument(previous);\n  if (!isMap(doc.contents)) return out;\n  for (const p of doc.contents.items as Pair[]) {\n    if (!isScalar(p.key)) continue;\n    out.set(String(p.key.value), {\n      before: p.key.commentBefore,\n      inline: isScalar(p.value) ? p.value.comment : undefined,\n    });\n  }\n  return out;\n}\n\nexport function toYaml(file: EndorsementFile, { previous }: { previous?: string } = {}): string {\n  const doc = new Document(ordered(file));\n  if (previous !== undefined && isMap(doc.contents)) {\n    const comments = topLevelComments(previous);\n    for (const p of doc.contents.items as Pair[]) {\n      if (!isScalar(p.key)) continue;\n      const c = comments.get(String(p.key.value));\n      if (!c) continue;\n      if (c.before) p.key.commentBefore = c.before;\n      if (c.inline && isScalar(p.value)) p.value.comment = c.inline;\n    }\n  }\n  return doc.toString({ lineWidth: 0 });\n}", "changed": [], "removed": []}, {"id": "key", "repo": "bb", "path": "src/pipeline/key.ts", "role": "API client: where spend bills", "startLine": 1, "totalLines": 24, "code": "import fs from \"node:fs\";\nimport Anthropic from \"@anthropic-ai/sdk\";\nimport { parseEnv } from \"node:util\";\n\nconst VAR = \"BAYBALLOT_ANTHROPIC_API_KEY\";\nconst MISSING = `Set ${VAR} in .env.local`;\n\n/** Never falls back to ANTHROPIC_API_KEY: the shell's key bills another account. Never log the result. */\nexport function resolveApiKey(envFilePath: string): string {\n  let contents: string | null = null;\n  try {\n    contents = fs.readFileSync(envFilePath, \"utf8\");\n  } catch {\n    contents = null;\n  }\n  const key = (contents === null ? process.env[VAR] : parseEnv(contents)[VAR])?.trim();\n  if (!key) throw new Error(MISSING);\n  return key;\n}\n\n/** Explicit baseURL and null authToken, so a shell's
