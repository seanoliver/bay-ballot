name: Daily data refresh

on:
  schedule:
    # 13:00 UTC = 6:00 am Pacific during daylight time (PDT). After clocks change on
    # Nov 1 it runs at 5:00 am PST; Election Day is Nov 3, so that is left alone.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  BRANCH: data/refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # No stored credentials in .git/config: only the push step below uses the token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One refresh PR at a time. If yesterday's PR is still open, today's run starts from its
      # branch, so its stored page text and held picks are the baseline, and commits on top.
      - name: Start from the open refresh PR, if any
        id: base
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            git fetch -q origin "$BRANCH"
            git switch -q -c "$BRANCH" FETCH_HEAD
            echo "Continuing open PR #$pr"
          else
            # A leftover branch whose PR was closed without merging is stale; start over from main.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"
            fi
            git switch -q -c "$BRANCH"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Chromium for browser-fetched guides
        run: npx playwright install --with-deps chromium

      # Pages that changed only in dates, banners or text naming no contest are skipped
      # with no model call, so a quiet day costs nothing.
      - name: Refresh
        id: refresh
        env:
          BAYBALLOT_ANTHROPIC_API_KEY: ${{ secrets.BAYBALLOT_ANTHROPIC_API_KEY }}
        run: |
          set +e
          npm run bb -- refresh --summary summary.md --result result.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Commit only when endorsement data changed or a guide was re-extracted (its page text
      # must be kept, or tomorrow's run would pay to re-extract it). Page-text drift alone
      # (dates, banners) is discarded: it never counts as a relevant change.
      - name: Decide whether to commit
        id: changes
        run: |
          data_changed="$(git status --porcelain -- data/2026-11/endorsements)"
          extracted="$(node -e "try { console.log(require('./result.json').extracted.length) } catch { console.log(0) }")"
          if [ -z "$data_changed" ] && [ "$extracted" = "0" ]; then
            git checkout -- data/
            git clean -fdq -- data/
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes; nothing to commit."
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open or update the PR
        id: pr
        if: steps.changes.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -q -m "data: refresh $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          { cat summary.md; echo; echo "cc @seanoliver"; } > pr-body.md
          pr="${{ steps.base.outputs.pr }}"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file pr-body.md
            gh pr comment "$pr" --body "New refresh run $(date -u +%F) (exit code ${{ steps.refresh.outputs.code }}); summary above is updated."
          else
            gh pr create --base main --head "$BRANCH" --title "data: daily refresh" --body-file pr-body.md
            pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          labels="$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so check them here.
      - name: Validate, test and build
        id: checks
        if: steps.changes.outputs.commit == 'true'
        continue-on-error: true
        run: npm run validate && npm test && npm run build

      # A PR already labeled needs-review (held picks from an earlier run) waits for a person,
      # even if today's run was clean.
      - name: Auto-merge a clean refresh
        if: >-
          steps.changes.outputs.commit == 'true' && steps.refresh.outputs.code == '0' &&
          steps.checks.outcome == 'success' && !contains(steps.pr.outputs.labels, 'needs-review')
        run: gh pr merge "${{ steps.pr.outputs.pr }}" --squash --delete-branch

      - name: Leave the PR open for review
        if: >-
          steps.changes.outputs.commit == 'true' &&
          (steps.refresh.outputs.code != '0' || steps.checks.outcome != 'success')
        run: |
          gh label create needs-review --color d93f0b --description "Data refresh needs a human look" --force
          gh pr edit "${{ steps.pr.outputs.pr }}" --add-label needs-review
          gh pr comment "${{ steps.pr.outputs.pr }}" --body "Not auto-merged: refresh exit code ${{ steps.refresh.outputs.code }} (2 = held picks or a shrunk result, 1 = error), checks ${{ steps.checks.outcome }}."

      - name: Fail the run on a refresh error
        if: steps.refresh.outputs.code == '1'
        run: exit 1
