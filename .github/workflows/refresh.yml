name: Daily data refresh

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  BRANCH: data/refresh
  ISSUE_TITLE: Data refresh needs review

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Claude Code calls take longer than API calls: about a minute for each re-extracted guide.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      pr: ${{ steps.pr.outputs.pr }}
      code: ${{ steps.refresh.outputs.code }}
      review: ${{ steps.refresh.outputs.review }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start from the open refresh PR, if any
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          # A fork can open a PR from its own data/refresh branch; never continue or merge that one.
          pr="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository,headRepositoryOwner \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$pr" ]; then
            git fetch -q origin "$BRANCH"
            git switch -q -c "$BRANCH" FETCH_HEAD
            echo "Continuing open PR #$pr"
            if ! git merge -q --no-edit origin/main; then
              git merge --abort
              gh label create needs-review --color d93f0b --description "Data refresh needs a human look" --force
              gh pr edit "$pr" --add-label needs-review
              gh pr comment "$pr" --body "Refresh branch conflicts with main; resolve by hand."
              echo "stop=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Without this delete, the push from a fresh main branch is rejected as non-fast-forward.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"
            fi
            git switch -q -c "$BRANCH"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Chromium for browser-fetched guides
        run: npx playwright install --with-deps chromium

      # Model calls run through Claude Code on Sean's subscription. Pinned, and the Refresh step sets
      # DISABLE_UPDATES so the CLI can't update itself mid-run. Not here: it stops the installer too.
      - name: Install Claude Code
        if: steps.base.outputs.stop != 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.296
          "$HOME/.local/bin/claude" --version

      - name: Read the open review issue
        id: issue
        if: steps.base.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue="$(gh issue list --state open --app github-actions --search "in:title \"$ISSUE_TITLE\"" --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          echo "number=$issue" >> "$GITHUB_OUTPUT"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json body --jq .body \
              | sed -n 's/^<!-- shrunk-state: \(.*\) -->$/\1/p' > shrunk-state.json
          fi

      - name: Extract main's data as the changelog baseline
        if: steps.base.outputs.stop != 'true'
        env:
          MAIN_SHA: ${{ steps.base.outputs.main_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/main"
          git archive "$MAIN_SHA" data | tar -x -C "$RUNNER_TEMP/main"
          test -d "$RUNNER_TEMP/main/data"

      - name: Refresh
        id: refresh
        if: steps.base.outputs.stop != 'true'
        # Under the job's 90, so the alert step still runs if this one is stopped.
        timeout-minutes: 75
        env:
          BAYBALLOT_FALLBACK_MARKER: ${{ runner.temp }}/api-fallback
          # From `claude setup-token` on Sean's personal login; it expires after a year.
          BAYBALLOT_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Used only once the subscription's usage limit is reached; the next step alerts when it was.
          BAYBALLOT_ANTHROPIC_API_KEY: ${{ secrets.BAYBALLOT_ANTHROPIC_API_KEY }}
          DISABLE_UPDATES: "1"
        run: |
          set +e
          npm run bb -- refresh --summary summary.md --result result.json --shrunk-state shrunk-state.json --baseline "$RUNNER_TEMP/main/data"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "api_cost=$(node -e "try { console.log(require('./result.json').apiCost ?? 0) } catch { console.log(0) }")" >> "$GITHUB_OUTPUT"
          echo "api_calls=$(node -e "try { console.log(require('./result.json').apiFallbackCalls ?? 0) } catch { console.log(0) }")" >> "$GITHUB_OUTPUT"
          echo "review=$(node -e "try { console.log(JSON.stringify(require('./result.json').review ?? [])) } catch { console.log('[]') }")" >> "$GITHUB_OUTPUT"

      - name: Alert when the run used the API
        if: always() && steps.refresh.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COST: ${{ steps.refresh.outputs.api_cost }}
          CALLS: ${{ steps.refresh.outputs.api_calls }}
        run: |
          # The marker is written when the first call goes to the API, so it survives a refresh that was stopped.
          if [ ! -f "$RUNNER_TEMP/api-fallback" ] && [ "${COST:-0}" = "0" ] && [ "${CALLS:-0}" = "0" ]; then exit 0; fi
          title="Refresh used the API"
          body="The Claude subscription's usage limit was reached during the refresh on $(date -u +%F), so the rest of the run used the API: ${CALLS:-an unknown number of} calls, about \$${COST:-?} (calls in guides that then failed are not priced; blank if the refresh was stopped). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          cc @seanoliver"
          issue="$(gh issue list --state open --app github-actions --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # A re-extracted guide's page text must be committed even if its data didn't change, or the next run re-extracts it.
      - name: Decide whether to commit
        id: changes
        if: steps.base.outputs.stop != 'true'
        run: |
          data_changed="$(git status --porcelain -- data/2026-11/endorsements)"
          extracted="$(node -e "try { console.log(require('./result.json').extracted.length) } catch { console.log(0) }")"
          if [ -z "$data_changed" ] && [ "$extracted" = "0" ]; then
            git checkout -- data/
            git clean -fdq -- data/
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes; nothing to commit."
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open or update the PR
        id: pr
        if: steps.changes.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_PR: ${{ steps.base.outputs.pr }}
          CODE: ${{ steps.refresh.outputs.code }}
          REVIEW: ${{ steps.refresh.outputs.review }}
        run: |
          git add data/
          git commit -q -m "data: refresh $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          { cat summary.md; echo; echo "cc @seanoliver"; } > pr-body.md
          pr="$OPEN_PR"
          if [ -z "$pr" ]; then
            url="$(gh pr create --base main --head "$BRANCH" --title "data: daily refresh" --body-file pr-body.md)"
            pr="${url##*/}"
          fi
          # Before anything else can fail: gate needs `pr`, and labels again. Labeling is best effort.
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s' "${REVIEW:-[]}" | jq 'length')" != "0" ]; then
            gh label create needs-review --color d93f0b --description "Data refresh needs a human look" --force || echo "::warning::could not create the needs-review label"
            gh pr edit "$pr" --add-label needs-review || echo "::warning::could not label PR #$pr"
          fi
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$pr" --body-file pr-body.md
            gh pr comment "$pr" --body "New refresh run $(date -u +%F) (exit code $CODE); summary above is updated."
          fi

      - name: Open, update or close the review issue
        if: always() && steps.refresh.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.refresh.outputs.code }}
          ISSUE: ${{ steps.issue.outputs.number }}
          COMMITTED: ${{ steps.changes.outputs.commit }}
        run: |
          code="$CODE"
          issue="$ISSUE"
          # Without result.json (a crash) keep the previous shrunk-state rather than wiping it.
          state="$(node -e "const fs = require('fs'); try { const r = JSON.parse(fs.readFileSync('result.json', 'utf8')); console.log(JSON.stringify(Object.fromEntries(r.shrunk.map((s) => [s.id, s.pageHash])))) } catch { try { console.log(JSON.stringify(JSON.parse(fs.readFileSync('shrunk-state.json', 'utf8')))) } catch { console.log('{}') } }")"
          if [ "$code" != "0" ] && { [ "$COMMITTED" != "true" ] || [ "$state" != "{}" ]; }; then
            {
              cat summary.md 2>/dev/null || echo "The refresh run failed before writing a summary: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "cc @seanoliver"
              echo
              # Parsed by the "Read the open review issue" step's sed; keep the format identical.
              echo "<!-- shrunk-state: $state -->"
            } > issue-body.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file issue-body.md
              gh issue comment "$issue" --body "Refresh run $(date -u +%F): exit code $code. Summary above is updated."
            else
              gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
            fi
          elif [ -n "$issue" ] && [ "$code" = "0" ]; then
            gh issue close "$issue" --comment "Refresh run $(date -u +%F) was clean; closing."
          fi

      - name: Fail the run on a refresh error
        if: steps.refresh.outputs.code == '1'
        run: exit 1

  # Separate from refresh so the job that runs repo code never holds actions: write. It checks out nothing.
  gate:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.sha != '' && needs.refresh.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.refresh.outputs.sha }}
      PR: ${{ needs.refresh.outputs.pr }}
    steps:
      - name: Run CI on the refresh branch
        id: ci
        continue-on-error: true
        timeout-minutes: 25
        run: |
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          start="$(date -u +%FT%TZ)"
          gh workflow run ci.yml --ref "$BRANCH"
          run=""
          for _ in $(seq 24); do
            sleep 5
            run="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" --limit 5 --json databaseId,createdAt \
              --jq "map(select(.createdAt >= \"$start\")) | .[0].databaseId // empty" || true)"
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "No CI run for $SHA appeared within 2 minutes."; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run" >> "$GITHUB_OUTPUT"
          gh run watch "$run" --exit-status --interval 15 > /dev/null

      - name: Rerun failed CI jobs once
        id: rerun
        if: steps.ci.outcome == 'failure' && steps.ci.outputs.run != ''
        continue-on-error: true
        timeout-minutes: 25
        env:
          RUN: ${{ steps.ci.outputs.run }}
        run: |
          status="$(gh run view "$RUN" --json status --jq .status)"
          [ "$status" = "completed" ] || { echo "CI run $RUN is $status, not completed; not rerunning."; exit 1; }
          gh run rerun "$RUN" --failed
          for _ in $(seq 12); do
            sleep 5
            [ "$(gh run view "$RUN" --json status --jq .status || true)" != "completed" ] && break
          done
          gh run watch "$RUN" --exit-status --interval 15 > /dev/null

      - name: Auto-merge a clean refresh, or leave it for review
        env:
          CODE: ${{ needs.refresh.outputs.code }}
          REVIEW: ${{ needs.refresh.outputs.review }}
          CI: ${{ steps.ci.outcome == 'success' || steps.rerun.outcome == 'success' }}
          CI_URL: ${{ steps.ci.outputs.url }}
        run: |
          review() {
            gh label create needs-review --color d93f0b --description "Data refresh needs a human look" --force || true
            gh pr edit "$PR" --add-label needs-review || true
            gh pr comment "$PR" --body "$1"
          }
          # Held, shrunk, removed or missing picks need a person whatever the exit code; a fetch error (exit 1) must not hide them.
          if [ "$(printf '%s' "${REVIEW:-[]}" | jq 'length')" != "0" ]; then
            review "Not auto-merged: refresh exit code $CODE, and these need review:
          $(printf '%s' "$REVIEW" | jq -r 'map("- " + .) | join("\n")')
          CI: $CI_URL"
            exit 0
          fi
          if [ "$CODE" = "1" ]; then
            gh pr comment "$PR" --body "Not auto-merged: refresh exit code 1 (a fetch or run error); the next clean run can merge it. CI: $CI_URL"
            exit 0
          fi
          if [ "$CODE" != "0" ] || [ "$CI" != "true" ]; then
            review "Not auto-merged: refresh exit code $CODE (2 = held picks, a changed unclear-match hold, or a shrunk result); CI $([ "$CI" = "true" ] && echo passed || echo "failed or didn't start"): $CI_URL"
            exit 0
          fi
          # Read at merge time: a label added while CI ran must stop the merge.
          if ! state="$(gh pr view "$PR" --json isCrossRepository,headRefName,labels,changedFiles \
            --jq '"\(.isCrossRepository) \(.headRefName) \(any(.labels[]; .name == "needs-review")) \(.changedFiles)"')"; then
            review "Couldn't read the PR's state; not auto-merging."
            exit 1
          fi
          read -r cross head labeled changed <<< "$state"
          [ "$cross $head" = "false $BRANCH" ] || { echo "PR #$PR is not this repo's $BRANCH; not merging."; exit 1; }
          [ "$labeled" = "false" ] || { echo "PR #$PR is labeled needs-review; not merging."; exit 0; }
          if [ "$changed" = "0" ]; then
            gh pr close "$PR" --delete-branch --comment "No net changes against main; closing."
            exit 0
          fi
          # A rename lists only its new name in .filename, so both names must be under data/.
          if ! files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | "\(.filename)\t\(.previous_filename // "")"')"; then
            review "Couldn't list the PR's files; not auto-merging."
            exit 1
          fi
          listed="$(printf '%s\n' "$files" | grep -c . || true)"
          outside="$(printf '%s\n' "$files" | awk -F'\t' 'NF && ($1 !~ /^data\// || ($2 != "" && $2 !~ /^data\//))' | grep -c . || true)"
          if [ "$listed" != "$changed" ]; then
            review "File count mismatch: the PR changes $changed files but the API lists $listed; not auto-merging."
            exit 1
          fi
          if [ "$outside" != "0" ]; then
            review "Touches files outside data/; not auto-merging."
            exit 1
          fi
          if ! out="$(gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" 2>&1)"; then
            review "Auto-merge failed: $out"
            exit 1
          fi
