name: CI

on:
  push:
    # The run history branch holds only runs.ndjson; there is nothing to build.
    branches-ignore: [runs]
  pull_request:
  # The refresh workflow dispatches CI on its branch: its GITHUB_TOKEN pushes don't trigger push/pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
